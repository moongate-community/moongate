mode = "game"

[shard]
shard_name = "Moongate Realm 1"

[network]
listen_address = "0.0.0.0"
game_port = 2593

[ultima]
ultima_path = "/uo"

[persistence]
auto_sync_schema = false
migrations_directory = "/app/migrations"

[persistence.realm]
connection_string = "$MOONGATE_REALM_DATABASE"

[api]
enabled = false
certificate_path = "tls/server.pfx"
certificate_password_environment_variable = ""
trusted_root_paths = ["tls/login.pem"]

[[api.peers]]
certificate_sha256 = "$MOONGATE_LOGIN_CERT_SHA256"
peer_id = "login"
allowed_operations = []

[realm_directory]
realm_id = "realm-1"
name = "Moongate Realm 1"
server_index = 1
advertised_address = "127.0.0.1"
advertised_port = 2595
login_api_host = "login"
login_api_port = 2594
expected_login_peer_id = "login"
