mode = "game"

[shard]
shard_name = "Moongate Realm 1"

[network]
listen_address = "0.0.0.0"
game_port = 2595

[ultima]
ultima_path = "/uo"

[persistence]
auto_sync_schema = false
migrations_directory = "/app/migrations"

[persistence.realm]
connection_string = "$MOONGATE_REALM_DATABASE"


[redis]
connection_string = "$MOONGATE_REDIS_CONNECTION_STRING"
handoff_secret = "$MOONGATE_HANDOFF_SECRET"

[realm_directory]
realm_id = "realm-1"
name = "Moongate Realm 1"
server_index = 1
advertised_address = "127.0.0.1"
advertised_port = 2595

[admin_api]
enabled = true
listen_address = "0.0.0.0"
port = 2590
certificate_path = "/run/admin-certificates/game-1.pfx"
certificate_password = "$MOONGATE_ADMIN_CERTIFICATE_PASSWORD"
