[project]
name = "moongate-convert"
version = "0.1.0"
description = "Converters of the data of other Ultima Online emulators (UOX3, ModernUO) into the templates of Moongate"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
moongate-convert = "moongate_convert.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moongate_convert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
