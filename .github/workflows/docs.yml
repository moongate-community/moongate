name: Documentation

# Called by release.yml after release-please creates a release, or run by hand from the Actions tab.
on:
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  # Publishing a documentation or installer fix must not require cutting a release.
  # Both inputs are optional: empty leaves checkout on the branch the run started from,
  # source links on develop, and the site title on the version in the manifest.
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit to publish; empty publishes the selected branch
        required: false
        type: string
        default: ''
      release_tag:
        description: Version label for the site title; empty uses the manifest version
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # Read the CI run and its coverage artifact for the published commit.
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      # The coverage page shows the CI report of the commit being published. A release
      # starts this workflow while CI may still be testing the same commit, so wait for it.
      # Without a successful run the page says no report was available.
      - name: Download test coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run=$(gh run list --workflow CI --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            gh run watch "$run" --exit-status --interval 30 > /dev/null || true
          fi
          if [ -n "$run" ] && gh run download "$run" --name coverage-report --dir artifacts/coverage; then
            echo "MOONGATE_COVERAGE_COMMIT=${sha:0:7}" >> "$GITHUB_ENV"
          else
            echo "::warning::No CI coverage report for $sha; the coverage page will say so."
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Test documentation tools
        run: npm test
        working-directory: website

      - name: Build and validate the website
        run: npm run build
        working-directory: website
        env:
          MOONGATE_DOCS_REF: ${{ inputs.release_tag }}
          MOONGATE_DOCS_VERSION: ${{ inputs.release_tag }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
