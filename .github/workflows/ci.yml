name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

# A single self-hosted runner serves this repository, so a superseded run would
# otherwise hold the queue against the run that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Self-hosted runner on gung-server-01, registered with the custom label
    # "gung-dotnet"; GitHub adds "self-hosted", "Linux" and "X64" on its own.
    # The container step below needs a working Docker daemon on that host.
    runs-on: [self-hosted, gung-dotnet]

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    strategy:
      # Report both configurations even when one of them fails.
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Moongate.slnx

      - name: Build
        run: dotnet build Moongate.slnx -c ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test Moongate.slnx -c ${{ matrix.configuration }} --no-build
