name: CI

on:
  push:
    branches:
      - develop
      - main
    # Documentation-only changes cannot affect the build or the tests; the docs workflow checks the site.
    paths-ignore:
      - docs/**
      - website/**
      - '**/*.md'
  pull_request:
    paths-ignore:
      - docs/**
      - website/**
      - '**/*.md'

# Superseded runs should release the shared runner capacity promptly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests into develop and pushes to develop only build: the tests run locally before the pull request.
  # The full pipeline runs where a release is cut, on pull requests into main and pushes to main.
  build:
    if: ${{ !((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, gung-dotnet]

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      volumes:
        - moongate-nuget-packages:/nuget-packages

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      NUGET_PACKAGES: /nuget-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore Moongate.slnx

      - name: Verify method body style
        run: dotnet format style Moongate.slnx --diagnostics IDE0022 --severity warn --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Moongate.slnx -c Release --no-restore

  build-and-test:
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # Self-hosted runner on gung-server-01, registered with the custom label
    # "gung-dotnet"; GitHub adds "self-hosted", "Linux" and "X64" on its own.
    # The container step below needs a working Docker daemon on that host.
    runs-on: [self-hosted, gung-dotnet]

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      # The runner is dedicated, so NuGet packages persist in a Docker volume on its host instead of an
      # actions/cache archive, which was re-downloaded and re-uploaded (hundreds of MB) on every project change.
      volumes:
        - moongate-nuget-packages:/nuget-packages

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        command: redis-server --maxmemory-policy noeviction
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      NUGET_PACKAGES: /nuget-packages
      MOONGATE_TEST_POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=postgres;Username=postgres;Pooling=false
      MOONGATE_REDIS_CONNECTION_STRING: redis:6379
      MOONGATE_TEST_REDIS_CONNECTION_STRING: redis:6379
      # The public commit SHA is a test-only proof key for ephemeral CI services.
      MOONGATE_HANDOFF_SECRET: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore Moongate.slnx

      - name: Verify method body style
        run: dotnet format style Moongate.slnx --diagnostics IDE0022 --severity warn --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Moongate.slnx -c Release --no-restore

      - name: Test
        # Test projects share PostgreSQL and Redis services; run their hosts one at a time.
        # The run also collects code coverage and merges it into artifacts/coverage.
        run: bash scripts/coverage.sh all -c Release --no-build --logger trx

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/coverage/results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish coverage summary
        run: cat artifacts/coverage/Summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            artifacts/coverage
            !artifacts/coverage/results
          # Documentation publishes the report of the released commit, possibly long after it ran.
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}

      # The distribution checks below guard what a release ships.
      - name: Verify portable administration client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          bash scripts/verify-admin-protos.sh

      - name: Verify NuGet packages and README examples
        run: bash scripts/verify-packages.sh

      # The notices ship beside the binaries, so a dependency change that does not
      # reach them would distribute the wrong attributions.
      - name: Verify the third-party notices are current
        run: |
          ./scripts/third-party-notices.sh
          git diff --exit-code -- THIRD-PARTY-NOTICES.md
