name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  build-and-test:
    # Self-hosted runner on gung-server-01, registered with the custom label
    # "gung-dotnet"; GitHub adds "self-hosted", "Linux" and "X64" on its own.
    # The container step below needs a working Docker daemon on that host.
    runs-on: [self-hosted, gung-dotnet]

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore Moongate.slnx

      - name: Build
        run: dotnet build Moongate.slnx --no-restore

      - name: Test
        run: dotnet test Moongate.slnx --no-build
