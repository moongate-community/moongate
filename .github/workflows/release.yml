name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: [self-hosted, gung-dotnet]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/Moongate.Server/Moongate.Server.csproj
          -c Release -r ${{ matrix.rid }}
          -o dist/moongate-${{ matrix.rid }}

      - name: Publish mgctl ${{ matrix.rid }}
        run: >
          dotnet publish src/Moongate.Ctl/Moongate.Ctl.csproj
          -c Release -r ${{ matrix.rid }}
          -o dist/moongate-${{ matrix.rid }}

      - name: Package
        run: >
          tar -C dist -czf
          moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
          moongate-${{ matrix.rid }}

      - name: Checksum
        run: >
          sha256sum
          moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
          > moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
            moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz.sha256

  admin-contracts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    steps:
      # As the docker job: not a container job, so it cannot clean a workspace the container jobs wrote as root.
      - name: Take the workspace back from the container jobs
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP:/owner:ro" alpine \
            sh -c 'chown -R "$(stat -c %u:%g /owner)" /workspace'

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Package portable administration contracts
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bash scripts/package-admin-protos.sh "$VERSION"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/moongate-admin-protos-${{ needs.release-please.outputs.version }}.zip

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Deliberately not a container job: building an image needs the runner's own
    # Docker daemon, which a containerised job cannot reach.
    runs-on: [self-hosted, gung-dotnet]
    permissions:
      contents: read
      packages: write
    steps:
      # The container jobs of the same runner write the workspace as root; this job runs as the runner's own user and
      # could not clean it for the checkout. The owner is read inside the container, from a directory the runner
      # made: with a rootless Docker the runner's user is root in there, and its own uid would be someone else's.
      - name: Take the workspace back from the container jobs
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP:/owner:ro" alpine \
            sh -c 'chown -R "$(stat -c %u:%g /owner)" /workspace'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Moongate.Server/Dockerfile
          # One architecture on purpose: the runner is x64, so an arm64 image
          # would be emulated through QEMU and take far longer to build.
          platforms: linux/amd64
          push: true
          # Separate writers prevent development and release builds replacing each other's cache.
          cache-from: |
            type=registry,ref=ghcr.io/moongate-community/moongate:buildcache-release
            type=registry,ref=ghcr.io/moongate-community/moongate:buildcache-develop
          cache-to: type=registry,ref=ghcr.io/moongate-community/moongate:buildcache-release,mode=max
          tags: |
            ghcr.io/moongate-community/moongate:${{ needs.release-please.outputs.version }}
            ghcr.io/moongate-community/moongate:latest

  helm:
    # After the image job: the chart's appVersion names an image tag that must exist when the chart is published.
    needs: [release-please, docker]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install helm and kubeconform
        run: deploy/helm/ci-tools.sh /usr/local/bin

      - name: Check the chart
        run: deploy/helm/moongate/tests/validate.sh

      # The chart version is the release version; Chart.yaml in the repository is bumped by release-please too.
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package deploy/helm/moongate --version "$VERSION" --app-version "$VERSION"
          helm push "moongate-$VERSION.tgz" oci://ghcr.io/moongate-community/charts

  nuget:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Which projects produce a package is decided by IsPackable in the project
      # files, not here, so adding or withdrawing a library needs no workflow edit.
      - name: Pack
        run: dotnet pack Moongate.slnx -c Release -o packages

      - name: List the packages
        run: ls -1 packages

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not set, so nothing was published." >&2
            exit 0
          fi
          # nuget.org pulls the matching .snupkg alongside each .nupkg on its own.
          # --skip-duplicate keeps a re-run from failing on versions already there.
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      # The documentation reads the CI coverage artifact of the released commit.
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      release_sha: ${{ needs.release-please.outputs.sha }}
      release_tag: ${{ needs.release-please.outputs.tag_name }}
