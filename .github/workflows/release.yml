name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: [self-hosted, gung-dotnet]
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64, osx-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/Moongate.Server/Moongate.Server.csproj
          -c Release -r ${{ matrix.rid }}
          -o dist/moongate-${{ matrix.rid }}

      - name: Package
        run: >
          tar -C dist -czf
          moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
          moongate-${{ matrix.rid }}

      - name: Checksum
        run: >
          sha256sum
          moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
          > moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz
            moongate-${{ matrix.rid }}-${{ needs.release-please.outputs.version }}.tar.gz.sha256

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Deliberately not a container job: building an image needs the runner's own
    # Docker daemon, which a containerised job cannot reach.
    runs-on: [self-hosted, gung-dotnet]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Moongate.Server/Dockerfile
          # One architecture on purpose: the runner is x64, so an arm64 image
          # would be emulated through QEMU and take far longer to build.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/moongate-community/moongate:${{ needs.release-please.outputs.version }}
            ghcr.io/moongate-community/moongate:latest

  nuget:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, gung-dotnet]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Which projects produce a package is decided by IsPackable in the project
      # files, not here, so adding or withdrawing a library needs no workflow edit.
      - name: Pack
        run: dotnet pack Moongate.slnx -c Release -o packages

      - name: List the packages
        run: ls -1 packages

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not set, so nothing was published." >&2
            exit 0
          fi
          # nuget.org pulls the matching .snupkg alongside each .nupkg on its own.
          # --skip-duplicate keeps a re-run from failing on versions already there.
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
