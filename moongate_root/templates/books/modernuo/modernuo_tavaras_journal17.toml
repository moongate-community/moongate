title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day Seventeen - Day
Eighteen :

I cannot go on much
longer.  I know now
t'was no work of the
earth that trapped us
here - I can feel His

force in it.  It was His
will, His power that
has sealed us here in
this nightmare.  The
barricade will not be
enough.  So many of
them. They come like
unto the ocean's waves

- ceaseless,
neverending.  For
every five we strike
down, another ten rise
up against us.  And
like the sands we
cannot help but be
brought down, wasted

away in this ocean of
blood."""
