[translations.pol]
title = "Gramatyka języka orków"
content = """Ten tom oraz pozostałe w
serii powstały dzięki
datkom Lord Blackthorn,
który zawsze wspiera
zrozumienie innych
rozumnych ras

Britannia. -
 
Język orków może brzmieć
niemiło dla ucha, lecz
posiada złożoną
gramatykę, często

błędnie rozumianą przez
tych, którzy słyszą
jedynie kilka kaleczonych
angielskich słów, jakimi
nasi orczy bracia radzą
sobie bez nauki.
Oto podstawowe

reguły języka orków:
Orczy ma pięć czasów:
teraźniejszy, przeszły,
przyszły niedokonany,
teraźniejszy
wykrzyknikowy oraz
chwytny.
Przykłady: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Wszystkie czasowniki
przechodnie w czasie
chwytnym kończą się na
„ug”.
Przykłady: urgleighug,
biggugdaghgug,
curdakalmug.

Wszystkie odmiany czasu
teraźniejszego
wykrzyknikowego zaczynają
się literą G, chyba że
zawierają trzeci akcent
deklinacyjny litery U.
Przykłady:

ghothudunglug, lecz nie
azhbuugub.
Czas przeszły może
odnosić się jedynie do
wydarzeń od ostatniego
posiłku, lecz czas
chwytny może odnosić się
do każdego wydarzenia w

zasięgu.
Czas teraźniejszy
odmienia się jak przyszły
niedokonany, gdy stosuje
się tryb pytający przez
podniesienie wysokości
dźwięku o ćwierć tonu

wyżej. Orczy nie ma
pojęcia osoby, jak
pierwsza osoba, trzecia
osoba, ja, my itd.
Gramatyka orcza opiera
się na trzech
podstawowych regułach:

akrecji, prefiksacji i
aglutynacji, a także na
wysokości dźwięku. W
pierwszej fonemy łączą
się w większe słowa,
które mogą zawierać
znaczenie całych fraz. W

drugiej dodanie
określonych dźwięków
fonetycznych jako
przedrostków zmienia
podmiot zdania w
dopełnienie, pytanie,
osobę, do której się
mówi, albo obiad.

Aglutynacja występuje,
gdy w słowie znajdują się
cztery takie same litery;
wtedy dowolne dwie można
usunąć lub wymówić
niewyraźnie.
Wysokość dźwięku zmienia

wartość fonemiczną
poszczególnych sylab,
całkowicie zmieniając
znaczenie słowa.
Klasycznym przykładem
jest „Aktgluthugrot
bigglogubuu

dargilgaglug lublublub”,
co może znaczyć „Jesteś
taką piękną dziewczyną”,
„Moja matka zjadła twoje
pierwiosnki” albo „Meduzi
nos maluje jałmużny
ziemniak”, zależnie od
wysokości dźwięku.

Orcza poezja często
opiera się na powtarzaniu
tej samej frazy na
różnych wysokościach,
nawet ze zmianą tonu w
środku słowa. Nic z tej
wielkiej sztuki nie da
się przetłumaczyć.

Język orków używa
następujących samogłosek:
ab, ad, ag, akt, at,
augh, auh, azh, e, i, o,
oo, u, uu. Dźwięk a nie
jest uznawany za
samogłoskę i nie
występuje w

ich alfabecie. Orczego
alfabetu najlepiej uczyć
się za pomocą klasycznej
rymowanki powtarzanej na
23 różnych wysokościach:
Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Przekład

pierwszej wysokości:
Jedz jedzenie, pierwszą
literą jest ab,
Zabijaj ludzi, następna
litera to ad,
Resztę zapomniałem,
Ale augh gdzieś tam jest!

 
Poniżej pełna biblioteka
fonetyczna języka orków:
ab, ad, ag, akt, alm, at,
augh, auh, azh, ba, ba,
bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug, bug,
buil, buim, bum, buo,
buor, buu, ca, car, clog,
cro, cuk, cur, da, dagh,
dagh, dak, dar, deak,
der, dil, dit, dor, dre,
dri,

dru, du, dud, duf, dug,
dug, duh, dun, eag, eg,
egg, eichel, ek, ep, ewk,
faugh, fid, flu, fog,
foo, foz, fruk, fu, fub,
fud, fun, fup, fur, gaa,
gag, gagh, gan,

gar, gh, gha, ghat, ghed,
ghig, gho, ghu, gig, gil,
gka, glu, glu, glug, gna,
gno, gnu, gol, gom, goth,
grunt, grut, gu, gub,
gub, gug, gug, gugh, guk,
guk,"""
[translations.por]
title = "Uma gramática do orc"
content = """Este volume e os demais
da série são patrocinados
por doações de Lord
Blackthorn, sempre um
defensor da compreensão
das outras raças
sencientes

de Britannia.
-
 
A língua orc pode soar
desagradável ao ouvido,
mas possui uma gramática
complexa frequentemente

mal compreendida por
aqueles que apenas ouvem
as poucas palavras
fragmentadas de inglês
que nossos irmãos orcs
conseguem usar sem
instrução.
Estas são as regras
básicas

do orc:
O orc tem cinco tempos:
presente, passado, futuro
imperfeito, presente
interjeicional e
preênsil.
Exemplos: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Todos os verbos
transitivos no tempo
preênsil terminam em
\"ug\".
Exemplos:
urgleighug,
biggugdaghgug,
curdakalmug.

Todas as conjugações do
presente interjeicional
começam com a letra G, a
menos que contenham o
terceiro acento
declinativo da letra U.
Exemplos:

ghothudunglug, mas não
azhbuugub.
O passado só pode se
referir a acontecimentos
desde a última refeição,
mas o tempo preênsil pode
se referir a qualquer
acontecimento ao

alcance.
O presente é conjugado
como o futuro imperfeito,
quando o modo
interrogativo é usado
elevando o som em um
quarto de tom.

O orc não possui o
conceito de pessoa, como
em primeira pessoa,
terceira pessoa, eu, nós
etc.
A gramática orc se apoia
nas três regras
fundamentais de

acreção, prefixação e
aglutinação, além da
altura do som. Na
primeira, os fonemas se
combinam em palavras
maiores, que podem conter
o significado de uma
frase inteira. Na

segunda, a prefixação de
sons fonéticos
específicos transforma o
sujeito da frase em
objeto, interrogativo,
indivíduo a quem se
dirige ou jantar.

A aglutinação ocorre
sempre que quatro letras
iguais estão presentes
numa palavra; nesse caso,
quaisquer duas delas
podem ser removidas ou
pronunciadas de forma
indistinta.
A altura do som altera o

valor fonêmico de sílabas
individuais, mudando
assim completamente o que
uma palavra pode
significar. O exemplo
clássico é
\"Aktgluthugrot
bigglogubuu

dargilgaglug lublublub\"
que pode significar
\"Você é uma menina tão
bonita\", \"Minha mãe
comeu suas prímulas\" ou
\"Nariz de água-viva
pinta esmolas batata\",
dependendo da altura do
som.

A poesia orc
frequentemente se baseia
em repetir a mesma frase
em várias alturas,
chegando a mudar a altura
no meio da palavra. Nada
dessa grande arte é
traduzível.

A língua orc usa as
seguintes vogais: ab, ad,
ag, akt, at, augh, auh,
azh, e, i, o, oo, u, uu.
O som vocálico a não é
reconhecido como vogal e
não existe em

seu alfabeto.
O alfabeto orc é melhor
aprendido usando a rima
clássica repetida em 23
alturas diferentes:
   Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
  Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Uma tradução da

primeira altura:
Coma comida, a primeira
letra é ab,
Mate pessoas, a próxima
letra
é ad,
Esqueço o resto
Mas augh está em algum
lugar aí!

 
O que segue é uma
biblioteca fonética
completa da língua orc:
ab, ad, ag, akt, alm,
at, augh, auh, azh,
ba, ba, bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug,
bug, buil, buim, bum,
buo, buor, buu, ca,
car, clog, cro, cuk,
cur, da, dagh, dagh,
dak, dar, deak, der,
dil, dit, dor, dre, dri,

dru, du, dud, duf,
dug, dug, duh, dun,
eag, eg, egg, eichel,
ek, ep, ewk, faugh,
fid, flu, fog, foo,
foz, fruk, fu, fub,
fud, fun, fup, fur,
gaa, gag, gagh, gan,

gar, gh, gha, ghat,
ghed, ghig, gho, ghu,
gig, gil, gka, glu, glu,
glug, gna, gno, gnu,
gol, gom, goth, grunt,
grut, gu, gub, gub,
gug, gug, gugh, guk,
guk,"""
[translations.spa]
title = "Una gramática del orco"
content = """Este volumen, y los demás
de la serie, se financian
con donaciones de Lord
Blackthorn, siempre
partidario de comprender
a las demás razas
inteligentes

de Britannia. -
 
La lengua orca puede
resultar desagradable al
oído, pero encierra una
gramática compleja que a
menudo

malinterpretan quienes
solo oyen las pocas
palabras de inglés
entrecortado que nuestros
hermanos orcos consiguen
pronunciar sin educación.
Estas son las reglas

básicas del orco: el orco
tiene cinco tiempos:
presente, pasado, futuro
imperfecto, presente
interjeccional y prensil.
Ejemplos: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Todos los verbos
transitivos en tiempo
prensil terminan en
\"ug\". Ejemplos:
urgleighug,
biggugdaghgug,
curdakalmug.

Todas las conjugaciones
del presente
interjeccional comienzan
con la letra G, salvo que
contengan el tercer
acento declinativo de la
letra U. Ejemplos:

ghothudunglug, pero no
azhbuugub. El pasado solo
puede referirse a sucesos
ocurridos desde la última
comida, pero el tiempo
prensil puede referirse a
cualquier suceso al

alcance. El presente se
conjuga como el futuro
imperfecto cuando se
emplea el modo
interrogativo, elevando
el tono del sonido un
cuarto de tono.

El orco no tiene concepto
de persona, como primera
persona, tercera persona,
yo, nosotros, etc. La
gramática orca se basa en
las tres reglas
cardinales de

acreción, prefijación y
aglutinación, además del
tono. En la primera, los
fonemas se combinan en
palabras mayores que
pueden contener el
significado de frases
completas. En la

segunda, la prefijación
de sonidos fonéticos
concretos convierte el
sujeto de la oración en
objeto, interrogación,
individuo al que se habla
o cena.

La aglutinación ocurre
cuando una palabra
contiene cuatro letras
iguales, en cuyo caso
pueden eliminarse o
arrastrarse dos
cualesquiera. El tono
cambia el

valor fonémico de las
sílabas individuales,
alterando así por
completo lo que una
palabra puede significar.
El ejemplo clásico es
\"Aktgluthugrot
bigglogubuu

dargilgaglug lublublub\",
que puede significar
\"Eres una muchacha tan
bonita\", \"Mi madre se
comió tus prímulas\" o
\"Nariz de medusa pinta
limosna patata\", según
el tono.

La poesía orca suele
repetir la misma frase en
varios tonos, llegando
incluso a cambiar de tono
a mitad de palabra. Nada
de este gran arte es
traducible.

La lengua orca utiliza
las siguientes vocales:
ab, ad, ag, akt, at,
augh, auh, azh, e, i, o,
oo, u, uu. El sonido
vocálico a no se reconoce
como vocal y no existe en

su alfabeto. La mejor
forma de aprender el
alfabeto orco es mediante
la rima clásica repetida
en 23 tonos distintos:
Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo, Gothnogbuim ad
gilgubbugbuilug Bilgeaugh
thurggulg stuiggro!
 
Una traducción del

primer tono: Come comida,
la primera letra es ab,
Mata gente, la siguiente
letra es ad, Olvido lo
demás ¡Pero augh está por
ahí en alguna parte!

 
Lo que sigue es una
biblioteca fonética
completa de la lengua
orca: ab, ad, ag, akt,
alm, at, augh, auh, azh,
ba, ba, bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug, bug,
buil, buim, bum, buo,
buor, buu, ca, car, clog,
cro, cuk, cur, da, dagh,
dagh, dak, dar, deak,
der, dil, dit, dor, dre,
dri,

dru, du, dud, duf, dug,
dug, duh, dun, eag, eg,
egg, eichel, ek, ep, ewk,
faugh, fid, flu, fog,
foo, foz, fruk, fu, fub,
fud, fun, fup, fur, gaa,
gag, gagh, gan,

gar, gh, gha, ghat, ghed,
ghig, gho, ghu, gig, gil,
gka, glu, glu, glug, gna,
gno, gnu, gol, gom, goth,
grunt, grut, gu, gub,
gub, gug, gug, gugh, guk,
guk,"""
