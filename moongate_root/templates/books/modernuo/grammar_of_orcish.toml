[translations.cze]
title = "Mluvnice skřetí řeči"
content = """Tento svazek i další z
této řady jsou
podporovány dary od Lord
Blackthorn, jenž vždy
podporuje porozumění
ostatním rozumným rasám

země Britannia.
-
 
Skřetí jazyk může uchu
znít nelibě, přesto
obsahuje složitou
mluvnici, často

nepochopenou těmi, kdo
slyší jen těch několik
lámaných anglických slov,
která naši skřetí bratři
zvládají bez vzdělání.
Toto jsou základní

pravidla skřetí řeči:
Skřetí řeč má pět časů:
přítomný, minulý, budoucí
nedokonavý, přítomný
citoslovečný a chápavý.
Příklady: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Všechna přechodná slovesa
v chápavém čase končí na
„ug“.
Příklady:
urgleighug,
biggugdaghgug,
curdakalmug.

Všechna časování
přítomného citoslovečného
času začínají písmenem G,
pokud neobsahují třetí
skloňovací přízvuk
písmene U.
Příklady:

ghothudunglug, nikoli
však azhbuugub.
Minulý čas se může
vztahovat pouze k
událostem od posledního
jídla, ale chápavý čas
může označovat jakoukoli
událost v

dosahu.
Přítomný čas se časuje
stejně jako budoucí
nedokonavý, používá-li se
tázací způsob zvýšením
tónu o čtvrt tónu

výše.
Skřetí řeč nezná pojem
osoby, jako první osoba,
třetí osoba, já, my a
podobně.
Skřetí mluvnice se vedle
výšky tónu opírá o tři
hlavní pravidla:

přirůstání, přidávání
předpon a aglutinaci. V
prvním se fonémy spojují
do větších slov, která
mohou obsahovat význam
celé fráze. Ve

druhém připojení určitých
fonetických zvuků na
začátek mění podmět věty
v předmět, otázku,
osloveného jedince nebo
večeři.

K aglutinaci dochází,
kdykoli se ve slově
nacházejí čtyři stejná
písmena; v takovém
případě lze kterákoli dvě
odstranit nebo setřít ve
výslovnosti.
Výška tónu mění

fonémovou hodnotu
jednotlivých slabik a tím
úplně mění význam slova.
Klasickým příkladem je
„Aktgluthugrot
bigglogubuu

dargilgaglug lublublub“,
což může znamenat „Jsi
tak hezká dívka“, „Moje
matka snědla tvé
prvosenky“ nebo „Medúza
nos maluje almužny
brambora“, podle výšky
tónu.

Skřetí poezie se často
zakládá na opakování
stejné fráze v různých
výškách tónu, přičemž se
tón mění i uprostřed
slova. Nic z tohoto
velkého umění nelze
přeložit.

Skřetí jazyk užívá
následující samohlásky:
ab, ad, ag, akt, at,
augh, auh, azh, e, i, o,
oo, u, uu. Samohláskový
zvuk a není uznáván za
samohlásku a neexistuje v

jejich abecedě.
Skřetí abeceda se nejlépe
učí pomocí klasické
říkanky opakované ve 23
různých výškách tónu:
   Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
  Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Překlad

první výšky tónu:
Jez jídlo, první
písmeno je ab,
Zabíjej lidi, další
písmeno je ad,
Zbytek si nepamatuji,
Ale augh tam někde
je!

 
Následuje úplný fonetický
soupis skřetího jazyka:
ab, ad, ag, akt, alm,
at, augh, auh, azh,
ba, ba, bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug,
bug, buil, buim, bum,
buo, buor, buu, ca,
car, clog, cro, cuk,
cur, da, dagh, dagh,
dak, dar, deak, der,
dil, dit, dor, dre, dri,

dru, du, dud, duf,
dug, dug, duh, dun,
eag, eg, egg, eichel,
ek, ep, ewk, faugh,
fid, flu, fog, foo,
foz, fruk, fu, fub,
fud, fun, fup, fur,
gaa, gag, gagh, gan,

gar, gh, gha, ghat,
ghed, ghig, gho, ghu,
gig, gil, gka, glu, glu,
glug, gna, gno, gnu,
gol, gom, goth, grunt,
grut, gu, gub, gub,
gug, gug, gugh, guk,
guk,"""
[translations.fre]
title = "Grammaire de l’orque"
content = """Ce volume et les autres
de la série sont financés
par les dons de Lord
Blackthorn, qui a
toujours soutenu la
compréhension des autres
races douées de raison

de Britannia.
-
 
La langue orque peut être
désagréable à l’oreille,
mais elle possède une
grammaire complexe,
souvent

mal comprise de ceux qui
n’entendent que les
quelques mots d’anglais
maladroits que nos frères
orques parviennent à
prononcer sans
instruction. Voici les
règles

fondamentales de l’orque
: l’orque a cinq temps :
le présent, le passé, le
futur imparfait, le
présent interjectionnel
et le préhensile.
Exemples : gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug. Tous
les verbes transitifs au
temps préhensile se
terminent par « ug ».
Exemples : urgleighug,
biggugdaghgug,
curdakalmug.

Toutes les conjugaisons
au présent
interjectionnel
commencent par la lettre
G, sauf si elles
contiennent le troisième
accent déclensionnel de
la lettre U. Exemples :

ghothudunglug, mais pas
azhbuugub. Le passé ne
peut désigner que des
événements survenus
depuis le dernier repas,
mais le préhensile peut
désigner n’importe quel
événement à

portée. Le présent se
conjugue comme le futur
imparfait lorsque l’on
emploie le mode
interrogatif en élevant
le son d’un quart de ton

supplémentaire. L’orque
n’a aucune notion de
personne, comme la
première personne, la
troisième personne, je,
nous, etc. La grammaire
orque repose sur les
trois règles cardinales
de

l’accrétion, de la
préfixation et de
l’agglutination, en plus
de la hauteur du son.
Dans la première, les
phonèmes se combinent en
mots plus grands,
susceptibles de contenir
le sens de phrases
entières. Dans la

deuxième, la préfixation
de sons phonétiques
précis transforme le
sujet de la phrase en
objet, en interrogatif,
en individu auquel on
s’adresse ou en dîner.

L’agglutination survient
dès que quatre
exemplaires de la même
lettre sont présents dans
un mot ; on peut alors en
supprimer ou en escamoter
deux quelconques. La
hauteur du son modifie la

valeur phonémique des
différentes syllabes,
altérant ainsi
complètement le sens
possible d’un mot.
L’exemple classique est «
Aktgluthugrot bigglogubuu

dargilgaglug lublublub »,
qui peut signifier « Vous
êtes une si jolie fille
», « Ma mère a mangé vos
primevères » ou « Nez de
méduse peint aumônes
pomme de terre », selon
la hauteur du son.

La poésie orque repose
souvent sur la répétition
de la même phrase à
différentes hauteurs,
voire sur un changement
de hauteur au milieu d’un
mot. Rien de ce grand art
n’est traduisible.

La langue orque utilise
les voyelles suivantes :
ab, ad, ag, akt, at,
augh, auh, azh, e, i, o,
oo, u, uu. Le son
vocalique a n’est pas
reconnu comme une voyelle
et n’existe pas dans

leur alphabet. L’alphabet
orque s’apprend au mieux
grâce à la comptine
classique répétée à 23
hauteurs différentes :
Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Traduction de la

première hauteur :
Mange nourriture, la
première lettre est ab,
Tue gens, la lettre
suivante est ad,
J’oublie le reste
Mais augh est quelque
part là-dedans !

 
Voici un répertoire
phonétique complet de la
langue orque :
ab, ad, ag, akt, alm, at,
augh, auh, azh, ba, ba,
bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug, bug,
buil, buim, bum, buo,
buor, buu, ca, car, clog,
cro, cuk, cur, da, dagh,
dagh, dak, dar, deak,
der, dil, dit, dor, dre,
dri,

dru, du, dud, duf, dug,
dug, duh, dun, eag, eg,
egg, eichel, ek, ep, ewk,
faugh, fid, flu, fog,
foo, foz, fruk, fu, fub,
fud, fun, fup, fur, gaa,
gag, gagh, gan,

gar, gh, gha, ghat, ghed,
ghig, gho, ghu, gig, gil,
gka, glu, glu, glug, gna,
gno, gnu, gol, gom, goth,
grunt, grut, gu, gub,
gub, gug, gug, gugh, guk,
guk,"""
[translations.ger]
title = "Eine Grammatik des Orkischen"
content = """Dieser Band und die
anderen dieser Reihe
werden durch Spenden von
Lord Blackthorn
gefördert, der stets das
Verständnis der anderen
vernunftbegabten Völker

Britannias unterstützt.
-
 
Die orkische Sprache mag
dem Ohr missfallen, doch
birgt sie eine
vielschichtige Grammatik,
die oft

von jenen missverstanden
wird, die nur die wenigen
gebrochenen englischen
Worte hören, welche
unsere orkischen Brüder
ohne Unterricht zustande
bringen.
Dies sind die
grundlegenden

Regeln des Orkischen:
Das Orkische hat fünf
Zeitformen: Gegenwart,
Vergangenheit,
unvollendete Zukunft,
interjektionale Gegenwart
und greifende Zeitform.
Beispiele: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Alle transitiven Verben
in der greifenden
Zeitform enden auf „ug“.
Beispiele:
urgleighug,
biggugdaghgug,
curdakalmug.

Alle Konjugationen der
interjektionalen
Gegenwart beginnen mit
dem Buchstaben G, sofern
sie nicht den dritten
deklinierenden Akzent des
Buchstabens U enthalten.
Beispiele:

ghothudunglug, aber nicht
azhbuugub.
Die Vergangenheit kann
sich nur auf Ereignisse
seit der letzten Mahlzeit
beziehen, doch die
greifende Zeitform kann
sich auf jedes Ereignis
innerhalb der

Reichweite beziehen.
Die Gegenwart wird wie
die unvollendete Zukunft
konjugiert, wenn der
Fragemodus benutzt wird,
indem man den Laut einen
Viertelton

höher ansetzt.
Das Orkische kennt keine
Person im Sinne von
erster Person, dritter
Person, ich, wir usw.
Die orkische Grammatik
beruht neben der Tonhöhe
auf den drei Grundregeln
der

Anlagerung, Präfigierung
und Agglutination. Bei
der ersten verbinden sich
Phoneme zu größeren
Wörtern, die die
Bedeutung ganzer Sätze
enthalten können. Bei der

zweiten verwandelt das
Voranstellen bestimmter
phonetischer Laute das
Subjekt des Satzes in ein
Objekt, eine Frage, eine
angesprochene Person oder
ein Abendessen.

Agglutination tritt auf,
sobald vier gleiche
Buchstaben in einem Wort
vorkommen; in diesem Fall
dürfen beliebige zwei
davon weggelassen oder
verschliffen werden.
Die Tonhöhe verändert den

Phonemwert einzelner
Silben und damit
vollkommen die mögliche
Bedeutung eines Wortes.
Das klassische Beispiel
lautet „Aktgluthugrot
bigglogubuu

dargilgaglug lublublub“
und kann je nach Tonhöhe
„Du bist so ein hübsches
Mädchen“, „Meine Mutter
hat deine Primeln
gegessen“ oder
„Quallennase malt
Almosenkartoffel“
bedeuten.

Orkische Dichtung beruht
oft darauf, denselben
Satz in mehreren Tonhöhen
zu wiederholen und sogar
mitten im Wort die
Tonhöhe zu wechseln.
Nichts von dieser großen
Kunst ist übersetzbar.

Die orkische Sprache
verwendet die folgenden
Vokale: ab, ad, ag, akt,
at, augh, auh, azh, e, i,
o, oo, u, uu. Der
Vokallaut a wird nicht
als Vokal anerkannt und
kommt in

ihrem Alphabet nicht vor.
Das orkische Alphabet
lernt man am besten mit
dem klassischen Reim, der
in 23 verschiedenen
Tonhöhen wiederholt wird:
Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Eine Übersetzung der

ersten Tonhöhe:
Iss Nahrung, der erste
Buchstabe ist ab,
Töte Leute, der nächste
Buchstabe ist ad,
Den Rest habe ich
vergessen
Aber augh steckt irgendwo
darin!

 
Es folgt ein
vollständiger
phonetischer Bestand der
orkischen Sprache:
ab, ad, ag, akt, alm,
at, augh, auh, azh,
ba, ba, bag, bar, baz,

bid, bilge, bo, bog, bog,
brui, bu, buad, bug,
bug, buil, buim, bum,
buo, buor, buu, ca,
car, clog, cro, cuk,
cur, da, dagh, dagh,
dak, dar, deak, der,
dil, dit, dor, dre, dri,

dru, du, dud, duf,
dug, dug, duh, dun,
eag, eg, egg, eichel,
ek, ep, ewk, faugh,
fid, flu, fog, foo,
foz, fruk, fu, fub,
fud, fun, fup, fur,
gaa, gag, gagh, gan,

gar, gh, gha, ghat,
ghed, ghig, gho, ghu,
gig, gil, gka, glu, glu,
glug, gna, gno, gnu,
gol, gom, goth, grunt,
grut, gu, gub, gub,
gug, gug, gugh, guk,
guk,"""
[translations.ita]
title = "Una grammatica della lingua degli orchi"
content = """Questo volume, e gli
altri della serie, sono
patrocinati dalle
donazioni di Lord
Blackthorn, da sempre
sostenitore della
comprensione delle altre
razze senzienti

di Britannia.
-
 
La lingua degli orchi può
risultare sgradevole
all'orecchio, eppure
racchiude una grammatica
complessa spesso

fraintesa da chi ascolta
soltanto le poche parole
stentate d'inglese che i
nostri fratelli orchi
riescono a pronunciare
senza istruzione.
Queste sono le regole
fondamentali

della lingua degli orchi:
La lingua degli orchi ha
cinque tempi: presente,
passato, futuro
imperfetto, presente
interiettivo e prensile.
Esempi: gugroflu,
gugrofloog, gugrobo,

gugroglu!, gugrogug.
Tutti i verbi transitivi
al tempo prensile
terminano in «ug».
Esempi:
urgleighug,
biggugdaghgug,
curdakalmug.

Tutte le coniugazioni del
presente interiettivo
iniziano con la lettera
G, a meno che contengano
il terzo accento
declinativo della lettera
U.
Esempi:

ghothudunglug, ma non
azhbuugub.
Il passato può riferirsi
soltanto a eventi
successivi all'ultimo
pasto, ma il tempo
prensile può riferirsi a
qualsiasi evento a

portata di mano.
Il presente si coniuga
come il futuro imperfetto
quando si usa il modo
interrogativo alzando il
suono di un quarto di
tono.

La lingua degli orchi non
ha il concetto di
persona, come prima
persona, terza persona,
io, noi, ecc.
La grammatica degli orchi
si basa sulle tre regole
cardinali di

accrescimento,
prefissazione e
agglutinazione, oltre
all'altezza del tono. Nel
primo caso, i fonemi si
combinano in parole più
grandi che possono
contenere il significato
di frasi intere. Nel

secondo, anteporre
specifici suoni fonetici
trasforma il soggetto
della frase in oggetto,
interrogativo, individuo
cui ci si rivolge o cena.

L'agglutinazione avviene
ogni volta che una parola
contiene quattro lettere
uguali, nel qual caso due
qualsiasi di esse possono
essere eliminate o
pronunciate
indistintamente.
L'altezza del tono cambia
il

valore fonemico delle
singole sillabe,
alterando dunque
completamente ciò che una
parola può significare.
L'esempio classico è
«Aktgluthugrot
bigglogubuu

dargilgaglug lublublub»,
che può significare «Sei
una ragazza così
graziosa», «Mia madre ha
mangiato le tue primule»
o «Naso medusa dipinge
elemosine patata»,
secondo l'altezza del
tono.

La poesia degli orchi si
basa spesso sulla
ripetizione della stessa
frase a diverse altezze,
cambiando persino tono
nel mezzo di una parola.
Nulla di questa grande
arte è traducibile.

La lingua degli orchi usa
le seguenti vocali: ab,
ad, ag, akt, at, augh,
auh, azh, e, i, o, oo, u,
uu. Il suono vocalico a
non è riconosciuto come
vocale e non esiste nel

loro alfabeto.
L'alfabeto degli orchi si
impara meglio usando la
classica filastrocca
ripetuta a 23 altezze
diverse:
   Lugnog ghu blat
suggaroglug,

Gaghbuu dakdar ab
highugbo,
  Gothnogbuim ad
gilgubbugbuilug
Bilgeaugh thurggulg
stuiggro!
 
Una traduzione della

prima altezza:
Mangia cibo, la prima
lettera è ab,
Uccidi gente, la prossima
