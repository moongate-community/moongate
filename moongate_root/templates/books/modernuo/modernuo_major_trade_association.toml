Barwy: czerwień i czerń
Podgildie: Łotry (żebracy), Zabójcy, Złodzieje"""

[translations.por]
title = "As principais associações de ofícios"
content = """
Existem dez grandes associações de ofícios que operam legitimamente nas terras de Britannia e entre seus parceiros comerciais. Muitas dessas guildas se dividem em subguildas locais ou

especializadas, que usam as mesmas cores, mas variam o padrão heráldico.
Há muitas associações menores de ofícios que têm participação restrita,

e só é possível ingressar nelas por convite. O Guia de guildas de Beltran é o texto definitivo sobre a variedade completa de guildas e outras associações de Britannia, e eu o

recomendo calorosamente.
No que segue, tentei reunir as informações conhecidas a respeito dessas guildas. Ofereço a você

o nome, os membros típicos, as cores heráldicas, as organizações especializadas conhecidas dentro da guilda maior e quaisquer afiliações conhecidas a outras

guildas, que frequentemente ocorrem por razões comerciais.

