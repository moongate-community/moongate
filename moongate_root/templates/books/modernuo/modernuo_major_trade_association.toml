[translations.pol]
title = "Główne stowarzyszenia zawodowe"
content = """
Na ziemiach Britannia i wśród jej partnerów handlowych działa legalnie dziesięć głównych stowarzyszeń zawodowych. Wiele z tych gildii dzieli się na lokalne lub

wyspecjalizowane podgildie, używające tych samych barw, lecz różnych wzorów heraldycznych.
Istnieje wiele pomniejszych stowarzyszeń zawodowych o zamkniętym członkostwie,

do których można wstąpić tylko za zaproszeniem. „Przewodnik Beltran po gildiach” to miarodajny opis wszystkich gildii i innych stowarzyszeń Britannia, i

gorąco go polecam.
Poniżej podjąłem próbę zebrania znanych informacji o tych gildiach. Podaję wam

nazwę, typowych członków, barwy heraldyczne, znane organizacje specjalistyczne w obrębie większej gildii oraz wszelkie znane powiązania z innymi

gildiami, często wynikające z przyczyn handlowych.

