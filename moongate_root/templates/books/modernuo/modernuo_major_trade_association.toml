[translations.spa]
title = "Las principales asociaciones de oficios"
content = """
Hay diez grandes asociaciones de oficios que operan legítimamente en las tierras de Britannia y entre sus socios comerciales. Muchos de estos gremios se dividen en subgremios locales o

especializados, que usan los mismos colores pero varían el diseño heráldico. Existen muchas asociaciones menores cuyos miembros forman un círculo cerrado,

y solo se puede entrar en ellas por invitación. La Guía de gremios de Beltran es el texto definitivo sobre todos los gremios y demás asociaciones de Britannia, y lo

recomiendo de todo corazón. En las páginas siguientes he intentado reunir la información conocida sobre estos gremios. Os ofrezco

el nombre, sus miembros habituales, los colores heráldicos, las organizaciones especializadas conocidas dentro del gremio mayor y los vínculos conocidos con otros

gremios, que a menudo se deben a motivos comerciales.

Gremio de Artes Arcanas. Miembros: alquimistas y hechiceros.

Colores: azul y púrpura. Subgremios: Ilusionistas, Magos, Hechiceros. Vínculos: Gremio de Sanadores.

Gremio de Guerreros. Miembros:

mercenarios, soldados, guardias, maestros de armas, paladines. Colores: azul y rojo. Subgremios: Caballería, Combatientes, Guerreros. Vínculos: Liga

de Exploradores.

Liga de Exploradores. Miembros: exploradores, fabricantes de arcos, adiestradores de animales. Colores: rojo, dorado y azul.


Gremio de Sanadores. Miembros: sanadores. Colores: verde, dorado y púrpura. Vínculos: Gremio de Artes Arcanas.

Cooperativa Minera. Miembros: mineros. Colores: damero azul y negro, con cruz dorada. Vínculos: Orden de Ingenieros.

Asociación de Mercaderes. Miembros: posaderos, taberneros, joyeros, proveedores. Colores: monedas de oro sobre

campo verde para los Mercaderes. Blanco y verde para los demás. Subgremios: Trueque, Proveedores, Comerciantes, Mercaderes.

Orden de Ingenieros. Miembros: artesanos e ingenieros. Colores: franjas verticales azules, doradas y púrpuras. Vínculos: Cooperativa Minera.

Sociedad de Confeccionistas. Miembros: sastres y tejedores. Colores: franjas horizontales púrpuras, doradas y rojas.

Gremio Marítimo.

Miembros: pescadores, marineros, cartógrafos, constructores navales. Colores: azul y blanco. Subgremios: Pescadores, Navegantes, Constructores Navales.

Colegio de Bardos. Miembros: bardos, músicos, narradores y otros artistas. Colores: damero púrpura, rojo y dorado.

Sociedad de Ladrones. Miembros: mendigos, cortabolsas, asesinos y bandidos. Colores: rojo y negro. Subgremios: Pícaros (mendigos), Asesinos, Ladrones."""
