title = "The Major Trade Associations"
author = "Pieter of Vesper"
content = """  There are ten major
trade associations that
operate legitimately in
the lands of Britannia
and among its trading
partners. Many of
these guilds are
divided into local or

specialty subguilds,
who use the same
colors but vary the
heraldic pattern.
  There are many
lesser trade
associations that have
closed membership,

and one can join them
only by invitation.
Beltran's Guide to
Guilds is the
definitive text on the
full range of guilds
and other associations
in Britannia, and I

heartily recommend
it.
  In what follows I
have attempted to
bring together the
known information
regarding these
guilds. I offer thee

the name, typical
membership, heraldic
colors, known
specialty
organizations within
the larger guild, and
any known
affiliations to other

guilds, which often
occur because of
trade reasons.

The Guild of Arcane
Arts
Members: alchemists
and wizards

Colors: blue and purple
Subguilds: Illusionists,
Mages, Wizards
Affiliations: Healer's
Guild

The Warrior's Guild
Members:

mercenaries,
soldiery, guardsmen,
weapons masters,
paladins.
Colors: Blue and red
Subguilds: Cavalry,
Fighters, Warriors
Affiliations: League

of Rangers

League of Rangers
Members: rangers,
bowyers, animal
trainers
Colors: Red, gold and
blue


Guild of Healers
Members: healers
Colors: Green, gold,
and purple
Affiliations: Guild of
Arcane Arts

Mining Cooperative
Members: miners
Colors: blue and black
checkers, with a gold
cross
Affiliations: Order of
Engineers

Merchants'
Association
Members:
innkeepers,
tavernkeepers,
jewelers,
provisioners
Colors: gold coins on a

green field for
Merchants.  White
and green for the
others.
Subguilds: Barters,
Provisioners,
Traders, Merchants

Order of Engineers
Members: tinkers and
engineers
Colors: Blue, gold, and
purple vertical bars
Affiliations: Mining
Cooperative

Society of Clothiers
Members: tailors and
weavers
Colors: Purple, gold,
and red horizontal
bars

Maritime Guild

Members: fishermen,
sailors, mapmakers,
shipwrights
Colors: blue and white
Subguilds:
Fishermen, Sailors,
Shipwrights

Bardic Collegium
Members: bards,
musicians,
storytellers, and other
performers
Colors: Purple, red
and gold checkerboard

Society of Thieves
Members: beggars,
cutpurses, assassins,
and brigands
Colors: red and black
Subguilds: Rogues
(beggars), Assassins,
Thieves"""
item_template = "readable_scroll"

[translations.cze]
title = "Hlavní řemeslnická sdružení"
content = """
V zemích Britannia a mezi jejich obchodními partnery legálně působí deset hlavních řemeslnických sdružení. Mnohé z těchto cechů se dělí na místní nebo

specializované podcechy, které používají stejné barvy, avšak obměňují heraldický vzor.
Existuje mnoho menších řemeslnických sdružení s uzavřeným členstvím,

do nichž lze vstoupit pouze na pozvání. Beltranův průvodce cechy je rozhodujícím dílem o celém rozsahu cechů a dalších sdružení v zemi Britannia a

vřele jej doporučuji.
V následujícím textu jsem se pokusil shromáždit známé informace o těchto ceších. Nabízím ti

jméno, obvyklé členstvo, heraldické barvy, známé specializované organizace uvnitř většího cechu a veškeré známé vazby na jiné

cechy, které často vznikají z obchodních důvodů.

Cech tajemných umění
Členové: alchymisté a čarodějové

Barvy: modrá a fialová
Podcechy: Iluzionisté, Mágové, Čarodějové
Vazby: Cech léčitelů

Cech válečníků
Členové:

námezdní bojovníci, vojáci, strážci, mistři zbraní, paladinové.
Barvy: modrá a červená
Podcechy: Jízda, Bojovníci, Válečníci
Vazby: Liga

hraničářů

Liga hraničářů
Členové: hraničáři, výrobci luků, cvičitelé zvířat
Barvy: červená, zlatá a modrá


Cech léčitelů
Členové: léčitelé
Barvy: zelená, zlatá a fialová
Vazby: Cech tajemných umění

Hornické družstvo
Členové: horníci
Barvy: modrá a černá šachovnice se zlatým křížem
Vazby: Řád inženýrů

Sdružení obchodníků
Členové: hostinští, krčmáři, klenotníci, zásobovatelé
Barvy: zlaté mince v

zeleném poli pro Obchodníky. Bílá a zelená pro ostatní.
Podcechy: Směnárníci, Zásobovatelé, Kupci, Obchodníci

Řád inženýrů
Členové: dráteníci a inženýři
Barvy: modré, zlaté a fialové svislé pruhy
Vazby: Hornické družstvo

Spolek oděvníků
Členové: krejčí a tkalci
Barvy: fialové, zlaté a červené vodorovné pruhy

Námořní cech

Členové: rybáři, námořníci, kartografové, stavitelé lodí
Barvy: modrá a bílá
Podcechy: Rybáři, Námořníci, Stavitelé lodí

Bardské kolegium
Členové: bardové, hudebníci, vypravěči a další umělci
Barvy: fialová, červená a zlatá šachovnice

Spolek zlodějů
Členové: žebráci, kapsáři, vrazi a lupiči
Barvy: červená a černá
Podcechy: Darebáci (žebráci), Vrazi, Zloději"""

[translations.fre]
title = "Les principales associations de métiers"
content = """
Dix grandes associations de métiers exercent légitimement dans les terres de Britannia et chez ses partenaires commerciaux. Nombre de ces guildes sont divisées en sous-guildes locales ou

spécialisées, qui utilisent les mêmes couleurs mais font varier le motif héraldique. Beaucoup d’associations de métiers plus petites réservent leur adhésion,

et l’on ne peut les rejoindre que sur invitation. Le guide des guildes de Beltran est l’ouvrage de référence sur l’ensemble des guildes et des autres associations de Britannia, et je le

recommande vivement. Dans ce qui suit, j’ai tenté de rassembler les renseignements connus concernant ces guildes. Je vous propose

leur nom, leurs membres habituels, leurs couleurs héraldiques, les organisations spécialisées connues au sein de la grande guilde et toute affiliation connue à d’autres

guildes, souvent motivée par le commerce.

La Guilde des Arts Occultes
Membres : alchimistes et sorciers

Couleurs : bleu et violet
Sous-guildes : Illusionnistes, Mages, Sorciers
Affiliations : Guilde des Guérisseurs

La Guilde des Guerriers
Membres :

mercenaires, soldats, gardes, maîtres d’armes, paladins.
Couleurs : bleu et rouge
Sous-guildes : Cavalerie, Combattants, Guerriers
Affiliations : Ligue

des Rôdeurs

Ligue des Rôdeurs
Membres : rôdeurs, facteurs d’arcs, dresseurs d’animaux
Couleurs : rouge, or et bleu


Guilde des Guérisseurs
Membres : guérisseurs
Couleurs : vert, or et violet
Affiliations : Guilde des Arts Occultes

Coopérative Minière
Membres : mineurs
Couleurs : damier bleu et noir, avec une croix d’or
Affiliations : Ordre des Ingénieurs

Association des Marchands
Membres : aubergistes, taverniers, joailliers, pourvoyeurs
Couleurs : pièces d’or sur

fond vert pour les Marchands. Blanc et vert pour les autres.
Sous-guildes : Troqueurs, Pourvoyeurs, Négociants, Marchands

Ordre des Ingénieurs
Membres : bricoleurs et ingénieurs
Couleurs : barres verticales bleues, d’or et violettes
Affiliations : Coopérative Minière

Société des Habilleurs
Membres : tailleurs et tisserands
Couleurs : barres horizontales violettes, d’or et rouges

Guilde Maritime

Membres : pêcheurs, marins, cartographes, charpentiers de marine
Couleurs : bleu et blanc
Sous-guildes : Pêcheurs, Marins, Charpentiers de Marine

Collège des Bardes
Membres : bardes, musiciens, conteurs et autres artistes
Couleurs : damier violet, rouge et or

Société des Voleurs
Membres : mendiants, coupe-bourses, assassins et brigands
Couleurs : rouge et noir
Sous-guildes : Fripons (mendiants), Assassins, Voleurs"""

[translations.ger]
title = "Die großen Gewerbevereinigungen"
content = """
Es gibt zehn große Gewerbevereinigungen, die in den Landen Britannias und unter seinen Handelspartnern rechtmäßig tätig sind. Viele dieser Gilden sind in örtliche oder

fachliche Untergilden geteilt, die dieselben Farben verwenden, aber das Wappenmuster abwandeln.
Es gibt viele kleinere Gewerbevereinigungen mit geschlossener Mitgliedschaft,

denen man nur auf Einladung beitreten kann. Beltrans Gildenführer ist das maßgebliche Werk über das gesamte Spektrum der Gilden und anderer Vereinigungen in Britannia, und ich

empfehle ihn nachdrücklich.
Im Folgenden habe ich versucht, die bekannten Informationen über diese Gilden zusammenzutragen. Ich biete Euch

den Namen, die übliche Mitgliedschaft, die Wappenfarben, bekannte Fachverbände innerhalb der größeren Gilde und alle bekannten Verbindungen zu anderen

Gilden, die oft aus Gründen des Handels entstehen.

Die Gilde der Arkanen Künste
Mitglieder: Alchemisten und Zauberer

Farben: Blau und Purpur
Untergilden: Illusionisten, Magier, Zauberer
Verbindungen: Gilde der Heiler

Die Gilde der Krieger
Mitglieder:

Söldner, Soldaten, Wachen, Waffenmeister, Paladine.
Farben: Blau und Rot
Untergilden: Reiterei, Kämpfer, Krieger
Verbindungen: Bund

der Waldläufer

Bund der Waldläufer
Mitglieder: Waldläufer, Bogenmacher, Tiertrainer
Farben: Rot, Gold und Blau


Gilde der Heiler
Mitglieder: Heiler
Farben: Grün, Gold und Purpur
Verbindungen: Gilde der Arkanen Künste

Bergbaugenossenschaft
Mitglieder: Bergleute
Farben: Blau und Schwarz geschacht, mit goldenem Kreuz
Verbindungen: Orden der Ingenieure

Vereinigung der Kaufleute
Mitglieder: Herbergswirte, Schankwirte, Juweliere, Versorger
Farben: Goldmünzen auf

grünem Feld für Kaufleute. Weiß und Grün für die anderen.
Untergilden: Tauschhändler, Versorger, Händler, Kaufleute

Orden der Ingenieure
Mitglieder: Kesselflicker und Ingenieure
Farben: Blaue, goldene und purpurne senkrechte Balken
Verbindungen: Bergbaugenossenschaft

Gesellschaft der Tuchmacher
Mitglieder: Schneider und Weber
Farben: Purpurne, goldene und rote waagerechte Balken

Seefahrtsgilde

Mitglieder: Fischer, Matrosen, Kartenmacher, Schiffbauer
Farben: Blau und Weiß
Untergilden: Fischer, Matrosen, Schiffbauer

Bardenkollegium
Mitglieder: Barden, Musiker, Erzähler und andere Künstler
Farben: Purpur, Rot und Gold geschacht

Gesellschaft der Diebe
Mitglieder: Bettler, Beutelschneider, Meuchelmörder und Räuber
Farben: Rot und Schwarz
Untergilden: Schurken (Bettler), Meuchelmörder, Diebe"""

[translations.ita]
title = "Le principali associazioni professionali"
content = """
Esistono dieci principali associazioni professionali che operano legittimamente nelle terre di Britannia e fra i suoi partner commerciali. Molte di queste gilde sono divise in sottogilde locali o

specialistiche, che usano gli stessi colori ma variano il motivo araldico.
Vi sono molte associazioni professionali minori a numero chiuso,

e vi si può entrare solo su invito. La guida alle gilde di Beltran è il testo definitivo sull'intera gamma di gilde e altre associazioni di Britannia, e lo

raccomando caldamente.
In quanto segue ho tentato di raccogliere le informazioni note su queste gilde. Vi offro

il nome, i membri tipici, i colori araldici, le organizzazioni specialistiche note all'interno della gilda maggiore e ogni affiliazione nota con altre

