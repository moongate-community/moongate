title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day Nine - Day Ten:

The excavation of the
next set of tunnels
has ceased, as three
of the workers have
gone missing in the
night.  Bergen voiced

the opinion that they
had most likely
abandoned our group
altogether and headed
back, as they were of
the number that
seemed especially
disturbed by the

Tomb.  Lysander had
other ideas, however.
In the middle of our
discussion on the
matter, he went into a
wild tirade on the
possibility that they
had somehow

infiltrated the tomb's
interior without us.
The pure, hateful
venom in his voice
when he spoke of the
workers shocked me,
as I had always
thought him to be a

levelheaded man of
great learning.  As we
are still at work
digging out the rubble
that blocks all access
to the inner chambers,
I cannot help but
believe the workers

must have fled the
site altogether, as
Bergen said."""
item_template = "readable_scroll"

[translations.cze]
title = "Deník: Objevení hrobky"
content = """
Den devátý až desátý:

Odkrývání další
soustavy tunelů se
zastavilo, protože v
noci zmizeli tři
dělníci. Bergen
vyslovil

názor, že nejspíš naši
skupinu úplně opustili
a vydali se zpátky,
neboť patřili k těm,
které hrobka obzvláště
znepokojovala.

Lysander měl však jiné
představy. Uprostřed
naší rozpravy o této
věci spustil zuřivou
tirádu o možnosti, že
nějak

pronikli do nitra
hrobky bez nás. Čistý
nenávistný jed v jeho
hlase, když mluvil o
dělnících, mě otřásl,
neboť jsem jej vždy
považovala za

rozvážného muže veliké
učenosti. Jelikož
stále pracujeme na
odklízení suti, jež
blokuje všechny
přístupy do vnitřních
komnat, nezbývá mi než
věřit, že dělníci

z naleziště zcela
uprchli, jak řekl
Bergen."""

[translations.fre]
title = "Journal : découverte du tombeau"
content = """
Du neuvième au dixième
jour :

Le déblaiement de la
série de tunnels
suivante a cessé, car
trois ouvriers ont
disparu pendant la
nuit. Bergen a exprimé

l’opinion qu’ils
avaient très
probablement abandonné
notre groupe et repris
le chemin du retour,
puisqu’ils étaient de
ceux qui semblaient
particulièrement
troublés par le

Tombeau. Lysander,
toutefois, avait
d’autres idées. Au
milieu de notre
discussion à ce sujet,
il s’est lancé dans
une tirade furieuse
sur la possibilité
qu’ils aient réussi à
se

introduits à
l’intérieur du tombeau
sans nous. Le venin
pur et haineux dans sa
voix lorsqu’il parlait
des ouvriers m’a
choquée, car je
l’avais toujours
considéré comme un

homme pondéré, d’un
grand savoir. Puisque
nous travaillons
encore à déblayer les
gravats qui barrent
tout accès aux salles
intérieures, je ne
puis que croire que
les ouvriers

ont dû fuir le site
entièrement, comme l’a
dit Bergen."""

[translations.ger]
title = "Tagebuch: Entdeckung des Grabes"
content = """
Neunter bis zehnter
Tag:

Das Freilegen der
nächsten Tunnel ist
zum Stillstand
gekommen, da in der
Nacht drei Arbeiter
verschwunden sind.
Bergen äußerte

die Meinung, sie
hätten unsere Gruppe
höchstwahrscheinlich
ganz verlassen und
seien zurückgegangen,
da sie zu jenen
gehörten, die durch
das

Grab besonders
verstört schienen.
Lysander hatte jedoch
andere Vorstellungen.
Mitten in unserer
Besprechung brach er
in eine wilde Tirade
über die Möglichkeit
aus, dass sie
irgendwie

ohne uns ins Innere
des Grabes
vorgedrungen seien.
Das reine,
hasserfüllte Gift in
seiner Stimme, als er
von den Arbeitern
sprach, erschütterte
mich, denn ich hatte
ihn stets für einen

besonnenen Mann von
großer Gelehrsamkeit
gehalten. Da wir noch
immer die Trümmer
ausgraben, die jeden
Zugang zu den inneren
Kammern versperren,
kann ich nur glauben,
dass die Arbeiter

die Stätte gänzlich
verlassen haben
müssen, wie Bergen
sagte."""

[translations.ita]
title = "Diario: scoperta della Tomba"
content = """
Giorno Nove - Giorno
Dieci:

Lo scavo della
successiva serie di
cunicoli si è fermato,
poiché tre operai sono
scomparsi nella notte.
Bergen ha espresso

l'opinione che molto
probabilmente avessero
abbandonato del tutto
il nostro gruppo e
fossero tornati
indietro, poiché erano
fra quelli che
sembravano
particolarmente
turbati dalla

Tomba. Lysander aveva
però altre idee. Nel
mezzo della nostra
discussione
sull'argomento si è
lanciato in una
sfuriata sulla
possibilità che si
fossero in qualche
modo

infiltrati
nell'interno della
tomba senza di noi. Il
puro, odioso veleno
nella sua voce quando
parlava degli operai
mi ha sconvolta,
poiché l'avevo sempre
considerato un

uomo equilibrato e di
grande cultura. Poiché
stiamo ancora scavando
le macerie che
bloccano ogni accesso
alle stanze interne,
non posso che credere
che gli operai

siano fuggiti del
tutto dal sito, come
ha detto Bergen."""

[translations.pol]
title = "Dziennik: odkrycie Grobowca"
content = """
Dzień dziewiąty —
dzień dziesiąty:

Odsłanianie kolejnych
tuneli ustało, gdyż
nocą zaginęło trzech
robotników. Bergen
wyraził

opinię, że najpewniej
zupełnie porzucili
naszą grupę i ruszyli
z powrotem, należeli
bowiem do tych,
których Grobowiec
zdawał się szczególnie

niepokoić. Lysander
miał jednak inne
pomysły. W środku
naszej rozmowy wybuchł
dziką tyradą o
możliwości, że jakoś

przedostali się do
wnętrza grobowca bez
nas. Czysty,
nienawistny jad w jego
głosie, kiedy mówił o
robotnikach,
wstrząsnął mną, gdyż
zawsze uważałam go za

rozsądnego człowieka
wielkiej wiedzy. Skoro
nadal kopiemy gruz
blokujący wszelki
dostęp do wewnętrznych
komnat, nie mogę nie
wierzyć, że robotnicy

musieli zupełnie
opuścić to miejsce,
jak powiedział Bergen."""

[translations.por]
title = "Diário: descoberta da tumba"
content = """
Nono dia - Décimo dia:

A escavação do próximo
conjunto de túneis
parou, pois três dos
trabalhadores
desapareceram durante
a noite. Bergen
expressou

a opinião de que muito
provavelmente haviam
abandonado nosso grupo
por completo e
voltado, já que
estavam entre os que
pareciam especialmente
perturbados pela

Tumba. Lysander,
porém, tinha outras
ideias. No meio de
nossa discussão sobre
o assunto, começou um
discurso furioso sobre
a possibilidade de que
eles de algum modo
tivessem

se infiltrado no
interior da tumba sem
nós. O puro veneno de
ódio em sua voz quando
falou dos
trabalhadores me
chocou, pois eu sempre
o considerara um

homem equilibrado e de
grande erudição. Como
ainda estamos
trabalhando para
retirar o entulho que
bloqueia todo acesso
às câmaras internas,
não posso deixar de
acreditar que os
trabalhadores

devem ter fugido do
sítio por completo,
como disse Bergen."""

[translations.spa]
title = "Diario: descubrimiento de la tumba"
content = """
Día nueve - Día diez:

La excavación del
siguiente conjunto de
túneles se ha
detenido, pues tres
trabajadores
desaparecieron durante
la noche. Bergen
expresó

la opinión de que
probablemente habían
abandonado nuestro
grupo y emprendido el
regreso, pues eran de
los que parecían
especialmente
perturbados por la

Tumba. Lysander, sin
embargo, tenía otras
ideas. En mitad de
nuestra conversación
sobre el asunto, lanzó
una diatriba desatada
sobre la posibilidad
de que de algún modo
se hubieran

infiltrado en el
interior de la tumba
sin nosotros. El
veneno puro y odioso
de su voz al hablar de
los trabajadores me
conmocionó, pues
siempre lo había
considerado un

hombre sensato y de
gran erudición. Como
seguimos excavando los
escombros que bloquean
todo acceso a las
cámaras interiores, no
puedo evitar creer que
los trabajadores

debieron de huir del
lugar por completo,
como dijo Bergen."""
