title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day Seven:
 
T'was written that,
upon his death, Khal
Ankur's followers,
those known as the
Keepers of the
Seventh Death, sealed

themselves within the
Sanctum they had
carved from the
mountains in his
honor.  The Zealots of
his order entombed
the lesser followers
alive, then, when all

but two remained, slit
their throats and
joined Khal Ankur in
death.  Surely this is
not surprising for a
Cult that worshipped
death and sacrifice so
vehemently as it is

said that the Keepers
did - and yet, to be in
this Tomb, to know
that somewhere in its
depths hundreds upon
hundreds of bodies
lay, sealed alive at
their own behest...

I must confess that
the very thought of it
troubles my dreams at
night.  I've asked
Lysander if we might
reestablish the camp
outside the Tomb,
setting up night

watches and some sort
of fortification, but
he'll have none of it.  I
did not press the
issue, as I suddenly
felt foolish even at
my askance."""
item_template = "readable_book"
item_id = 0x0FF1
[translations]
[translations.cze]
title = "Deník: Objevení hrobky"
content = """Den sedmý:
 
Bylo psáno, že po smrti
Khal Ankur se jeho
stoupenci, známí jako
Strážci Sedmé smrti,
uzavřeli

ve svatyni, kterou na
jeho počest vytesali z
hor. Fanatici jeho řádu
pohřbili méně významné
následovníky zaživa a
pak, když zbývali

jen dva, podřízli si
hrdla a připojili se ke
Khal Ankur ve smrti.
Jistě to nepřekvapí u
kultu, který uctíval smrt
a oběť tak vroucně, jak

údajně činili Strážci – a
přece být v této hrobce,
vědět, že kdesi v jejích
hlubinách leží stovky a
stovky těl, uzavřených
zaživa na vlastní
žádost...

Musím přiznat, že samotná
myšlenka na to v noci
zneklidňuje mé sny.
Zeptala jsem se mága
Lysander, zda bychom
nemohli znovu zřídit
tábor před hrobkou,
postavit noční

hlídky a nějaké opevnění,
ale nechce o tom ani
slyšet. Nenaléhala jsem,
protože mi náhle
připadala pošetilá už
samotná moje otázka."""
[translations.fre]
title = "Journal : découverte du tombeau"
content = """Septième jour :
 
Il était écrit qu’à sa
mort, les fidèles de Khal
Ankur, ceux que l’on
nommait les Gardiens de
la Septième Mort,
s’enfermèrent

dans le Sanctuaire qu’ils
avaient taillé dans les
montagnes en son honneur.
Les Fanatiques de son
ordre ensevelirent
vivants les fidèles de
moindre rang, puis,
lorsqu’il n’en

resta plus que deux, se
tranchèrent la gorge et
rejoignirent Khal Ankur
dans la mort. Certes,
cela n’est pas surprenant
pour un Culte qui
vénérait la mort et le
sacrifice avec autant de
ferveur qu’on le

prête aux Gardiens ; et
pourtant, se trouver dans
ce Tombeau, savoir que
quelque part dans ses
profondeurs reposent des
centaines et des
centaines de corps,
enfermés vivants à leur
propre demande...

Je dois avouer que cette
seule pensée trouble mes
rêves la nuit. J’ai
demandé à Lysander si
nous pouvions rétablir le
camp à l’extérieur du
Tombeau, en organisant
des veilles

nocturnes et quelque
sorte de fortification,
mais il ne veut rien
entendre. Je n’ai pas
insisté, car je me suis
soudain sentie ridicule
d’avoir seulement posé la
question."""
[translations.ger]
title = "Tagebuch: Entdeckung des Grabes"
content = """Siebter Tag:
 
Es stand geschrieben,
dass nach Khal Ankurs Tod
seine Anhänger, die als
Hüter des Siebten Todes
bekannt waren, sich

in dem Heiligtum
einschlossen, das sie ihm
zu Ehren aus den Bergen
gehauen hatten. Die
Eiferer seines Ordens
begruben die niederen
Anhänger lebendig und
schnitten sich dann, als
nur noch

zwei übrig waren, die
Kehlen durch und folgten
Khal Ankur in den Tod.
Gewiss ist dies nicht
überraschend für einen
Kult, der Tod und Opfer
so leidenschaftlich
verehrte, wie es

von den Hütern heißt –
und doch, in diesem Grab
zu sein, zu wissen, dass
irgendwo in seinen Tiefen
Hunderte und Aberhunderte
von Leichen liegen, auf
eigenen Wunsch lebendig
eingeschlossen ...

Ich muss gestehen, dass
schon der Gedanke daran
nachts meine Träume
beunruhigt. Ich habe
Lysander gefragt, ob wir
das Lager wieder
außerhalb des Grabes
aufschlagen könnten, mit
Nachtwachen

und irgendeiner
Befestigung, doch er will
davon nichts hören. Ich
drängte nicht weiter
darauf, da ich mich
plötzlich schon wegen
meiner Frage töricht
fühlte."""
[translations.ita]
title = "Diario: scoperta della Tomba"
content = """Giorno Sette:
 
È scritto che, alla morte
di Khal Ankur, i suoi
seguaci, quelli noti come
Custodi della Settima
Morte, si rinchiusero

nel Santuario che avevano
scavato nelle montagne in
suo onore. I Fanatici del
suo ordine seppellirono
vivi i seguaci minori;
poi, quando ne rimasero

soltanto due, si
tagliarono la gola e si
unirono a Khal Ankur
nella morte. Certo ciò
non sorprende per un
Culto che venerava la
morte e il sacrificio con
tanta veemenza quanto si

dice facessero i Custodi;
eppure, trovarsi in
questa Tomba, sapere che
da qualche parte nelle
sue profondità giacciono
centinaia e centinaia di
corpi, sigillati vivi per
loro stessa volontà...

Devo confessare che il
solo pensiero turba i
miei sogni notturni. Ho
chiesto a Lysander se
potessimo ristabilire
l'accampamento fuori
dalla Tomba, organizzando
turni notturni

di guardia e qualche
sorta di fortificazione,
ma non ne vuole sapere.
Non ho insistito, poiché
d'un tratto mi sono
sentita sciocca anche
solo per averlo chiesto."""
[translations.pol]
title = "Dziennik: odkrycie Grobowca"
content = """Dzień siódmy:
 
Napisano, że po śmierci
Khal Ankur jego wyznawcy,
zwani Strażnikami Siódmej
Śmierci, zamknęli

się w Sanktuarium wykutym
w górach ku jego czci.
Fanatycy jego zakonu
zamurowali żywcem
pomniejszych wyznawców, a
potem, gdy

pozostało tylko dwóch,
podcięli sobie gardła i
dołączyli do Khal Ankur w
śmierci. Z pewnością nie
dziwi to w kulcie, który
tak gorliwie czcił śmierć
i ofiarę, jak

podobno czynili Strażnicy
— a jednak być w tym
Grobowcu, wiedzieć, że
gdzieś w jego głębi leżą
setki i setki ciał ludzi
zamurowanych żywcem na
własne życzenie...

Muszę przyznać, że sama
ta myśl niepokoi moje
nocne sny. Spytałam
Lysander, czy moglibyśmy
znów rozbić obóz poza
Grobowcem, wystawić nocne

straże i jakieś
umocnienia, lecz nie chce
o tym słyszeć. Nie
nalegałam, bo nagle
poczułam się głupio już
od samego pytania."""
[translations.por]
title = "Diário: descoberta da tumba"
content = """Sétimo dia:
 
Estava escrito que, após
sua morte, os seguidores
de Khal Ankur, conhecidos
como os Guardiões da
Sétima Morte, se selaram

dentro do Santuário que
haviam escavado nas
montanhas em sua honra.
Os Fanáticos de sua ordem
sepultaram vivos os
seguidores menores;
depois, quando só

restavam dois, cortaram
as próprias gargantas e
se juntaram a Khal Ankur
na morte. Certamente isso
não surpreende num Culto
que adorava a morte e o
sacrifício tão
veementemente como se

diz que os Guardiões
faziam; ainda assim,
estar nesta Tumba, saber
que em algum lugar de
suas profundezas jazem
centenas e centenas de
corpos, selados vivos por
vontade própria...

Preciso confessar que só
de pensar nisso meus
sonhos se perturbam à
noite. Perguntei a
Lysander se poderíamos
restabelecer o
acampamento fora da
Tumba, organizando
vigílias

noturnas e algum tipo de
fortificação, mas ele não
quis saber. Não insisti
no assunto, pois de
repente me senti tola até
por ter perguntado."""
[translations.spa]
title = "Diario: descubrimiento de la tumba"
content = """Día siete:
 
Se escribió que, a su
muerte, los seguidores de
Khal Ankur, conocidos
como los Guardianes de la
Séptima Muerte, se
encerraron

en el Santuario que
habían tallado en las
montañas en su honor. Los
Fanáticos de su orden
sepultaron vivos a los
seguidores menores;
después, cuando solo

quedaban dos, se cortaron
la garganta y se unieron
a Khal Ankur en la
muerte. Desde luego, esto
no sorprende en un Culto
que veneraba la muerte y
el sacrificio con tanta
vehemencia como se

dice que lo hacían los
Guardianes; y, sin
embargo, estar en esta
Tumba, saber que en algún
lugar de sus
profundidades yacen
cientos y cientos de
cuerpos, encerrados vivos
por su propia voluntad...

Debo confesar que solo
pensarlo perturba mis
sueños por la noche. He
preguntado a Lysander si
podríamos volver a
establecer el campamento
fuera de la Tumba,
organizando guardias

nocturnas y algún tipo de
fortificación, pero no
quiere oír hablar de
ello. No insistí, pues de
pronto me sentí necia
incluso por haberlo
preguntado."""
