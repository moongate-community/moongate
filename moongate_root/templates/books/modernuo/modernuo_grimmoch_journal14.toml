title = "The daily journal of Grimmoch Drummel"
author = "Grimmoch"
content = """Day Fourteen - Day
Sixteen :

We are lost... we are
lost... all is lost.  The
dead are piled up at
my feet.  Bergen and I
somehow managed in

the madness to piece
together a barricade,
barring access to the
camp antechamber.
He knows as well as I
that we cannot hold it
forever.  The dead
come.  They took

Lysander before our
eyes.  I pity the soul
of even such a
madman - no one
should die in such a
manner.  And yet so
many have.  We're
trapped here in this

horror.  So many have
died, and for what?
What curse have we
stumbled upon?  I
cannot bear it, the
moaning, wailing cries
of the dead.  Poor
Thomas, cut to pieces

by their blades.  We
had only an hour to
properly bury those
we could, before the
undead legions struck
again.  I cannot go on...
I cannot go on."""
