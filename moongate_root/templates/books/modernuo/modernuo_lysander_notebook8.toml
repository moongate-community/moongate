title = "Lysander's Notebook"
author = "L. Gathenwale"
content = """Day Eight - Day Ten :

Have you taken them,
Master?  They could
not have found a way
past the stones that
block our path!  The
three workers, My

Master, where have
they gone?  Curses
upon them!  I'll cut
them all to pieces if
they show their faces
again, then burn the
rest alive upon a pyre,
for all to see, as a

warning of Thy
Power.  How could
they have gotten past
me?  I sleep against
the very walls, to
hear Thy Words, to
feel Thy Breath.  I
can find no egress

from the chambers
that the Sewel woman
does not know of nor
have men working at
excavating.  Where
have they gone,
Master?  Have you
taken them, or do they

truly flee from Thy
Presence?  I will kill
them if they show
their faces again.
Give me Strength, my
Master, to let them
live a while longer,
until they have

fulfilled their
purpose and I kneel
before Thee, covered
in their blood."""
item_template = "readable_scroll"

[translations.cze]
title = "Lysanderův zápisník"
content = """
Den osmý až desátý:

Vzal sis je, Mistře?
Nemohli najít cestu za
kameny, které blokují
naši stezku! Ti tři
dělníci, můj

Mistře, kam zmizeli?
Kletba na ně! Rozsekám
je všechny na kusy,
ukážou-li se znovu, a
pak zbytek upálím
zaživa na hranici před
očima všech jako

varování před Tvou
mocí. Jak se mohli
dostat kolem mě? Spím u
samotných zdí, abych
slyšel Tvá slova, cítil
Tvůj dech. Nedovedu
najít žádný východ

z komnat, o němž by ta
ženská Sewel nevěděla
nebo kde by její lidé
nepracovali na
vykopávkách. Kam
zmizeli, Mistře? Vzal
sis je, nebo opravdu

prchají před Tvou
přítomností? Zabiju je,
jestli se znovu ukážou.
Dej mi sílu, můj
Mistře, nechat je ještě
chvíli žít, dokud

nenaplní svůj účel a já
před Tebou nepokleknu
pokryt jejich krví."""

[translations.fre]
title = "Le carnet de Lysander"
content = """
Du huitième au dixième
jour :

Les as-Tu pris, Maître
? Ils n’ont pas pu
trouver un chemin
au-delà des pierres qui
nous barrent la route !
Les trois ouvriers, mon

Maître, où sont-ils
passés ? Maudits
soient-ils ! Je les
taillerai tous en
pièces s’ils montrent
de nouveau leur visage,
puis je brûlerai les
autres vivants sur un
bûcher, à la vue de
tous, pour avertir de
Ta

Puissance. Comment
ont-ils pu me passer
devant ? Je dors contre
les murs mêmes, pour
entendre Tes Paroles,
pour sentir Ton
Souffle. Je ne trouve
aucune issue

à ces salles dont la
femme Sewel n’ait
connaissance ou qu’elle
ne fasse dégager par
ses hommes. Où sont-ils
passés, Maître ? Les
as-Tu pris, ou
fuient-ils

véritablement Ta
Présence ? Je les
tuerai s’ils montrent
de nouveau leur visage.
Donne-moi la Force, mon
Maître, de les laisser
vivre encore un peu,
jusqu’à ce qu’ils aient

accompli leur dessein
et que je m’agenouille
devant Toi, couvert de
leur sang."""

[translations.ger]
title = "Lysanders Notizbuch"
content = """
Achter bis zehnter Tag:

Hast du sie genommen,
Meister? Sie können
keinen Weg an den
Steinen vorbei gefunden
haben, die unseren Pfad
versperren! Die drei
Arbeiter, mein

Meister, wohin sind sie
gegangen? Verflucht
seien sie! Ich werde
sie alle in Stücke
schneiden, wenn sie
wieder ihr Gesicht
zeigen, und dann die
übrigen vor aller Augen
auf einem
Scheiterhaufen lebendig
verbrennen, als

Warnung vor Deiner
Macht. Wie konnten sie
an mir vorbeikommen?
Ich schlafe an den
Mauern selbst, um Deine
Worte zu hören, Deinen
Atem zu spüren. Ich
kann keinen Ausgang

aus den Kammern finden,
von dem das Weib Sewel
nicht weiß oder an dem
sie nicht Männer graben
lässt. Wohin sind sie
gegangen, Meister? Hast
du sie genommen, oder

fliehen sie wahrhaft
vor Deiner Gegenwart?
Ich werde sie töten,
wenn sie wieder ihr
Gesicht zeigen. Gib mir
Stärke, mein Meister,
sie noch ein wenig
länger leben zu lassen,
bis sie

ihren Zweck erfüllt
haben und ich vor Dir
knie, bedeckt mit ihrem
Blut."""

[translations.ita]
title = "Il taccuino di Lysander"
content = """
Giorno Otto - Giorno
Dieci :

Li hai presi Tu,
Padrone? Non possono
aver trovato una via
oltre le pietre che ci
sbarrano il cammino! I
tre operai, Mio

Padrone, dove sono
andati? Maledetti! Li
farò tutti a pezzi se
mostreranno di nuovo la
faccia, poi brucerò
vivi gli altri su una
pira, sotto gli occhi
di tutti, come

monito del Tuo Potere.
Come possono essermi
passati davanti? Dormo
contro le mura stesse,
per sentire le Tue
Parole, per sentire il
Tuo Respiro. Non riesco
a trovare un'uscita

dalle stanze che la
donna Sewel non conosca
già, o dove non abbia
uomini impegnati a
scavare. Dove sono
andati, Padrone? Li hai
presi Tu, o

fuggono davvero dalla
Tua Presenza? Li
ucciderò se mostreranno
di nuovo la faccia.
Dammi la Forza, mio
Padrone, di lasciarli
vivere ancora un poco,
finché non avranno

adempiuto al loro scopo
e io mi inginocchierò
davanti a Te, coperto
del loro sangue."""

[translations.pol]
title = "Notatnik Lysander"
content = """
Dzień ósmy — dzień
dziesiąty:

Czy ich zabrałeś,
Mistrzu? Nie mogli
znaleźć drogi za
kamienie blokujące
nasze przejście! Ci
trzej robotnicy, mój

Mistrzu, dokąd odeszli?
Niech będą przeklęci!
Posiekam ich na
kawałki, jeśli znów
pokażą twarze, a potem
spalę resztę żywcem na
stosie, na oczach
wszystkich, jako

przestrogę o Twej Mocy.
Jak mogli przejść obok
mnie? Śpię przy samych
ścianach, by słyszeć
Twe Słowa, czuć Twój
Oddech. Nie mogę
znaleźć wyjścia

z komnat, o którym
kobieta Sewel by nie
wiedziała lub przy
którym nie kazałaby
ludziom kopać. Dokąd
poszli, Mistrzu?
Zabrałeś ich, czy

naprawdę uciekają przed
Twą Obecnością? Zabiję
ich, jeśli znów pokażą
twarze. Daj mi Siłę,
mój Mistrzu, by
pozwolić im żyć jeszcze
trochę, aż

spełnią swe zadanie, a
ja uklęknę przed Tobą,
pokryty ich krwią."""

[translations.por]
title = "Caderno de Lysander"
content = """
Oitavo dia - Décimo
dia:

Você os levou, Mestre?
Eles não poderiam ter
encontrado um caminho
além das pedras que
bloqueiam nossa
passagem! Os três
trabalhadores, meu

Mestre, para onde
foram? Malditos sejam!
Vou cortar todos em
pedaços se mostrarem a
cara de novo, e depois
queimar os restantes
vivos numa pira, à
vista de todos, como

aviso de Seu Poder.
Como puderam passar por
mim? Durmo encostado
nas próprias paredes,
para ouvir Suas
Palavras, sentir Seu
Sopro. Não consigo
encontrar nenhuma saída

das câmaras que a
mulher Sewel desconheça
ou em que não tenha
homens trabalhando na
escavação. Para onde
foram, Mestre? Você os
levou ou eles

realmente fogem de Sua
Presença? Vou matá-los
se mostrarem a cara de
novo. Dê-me Força, meu
Mestre, para deixá-los
viver um pouco mais,
até que tenham

cumprido seu propósito
e eu me ajoelhe diante
de Você, coberto de seu
sangue."""

[translations.spa]
title = "Cuaderno de Lysander"
content = """
Día ocho - Día diez:

¿Te los has llevado,
Maestro? ¡No podrían
haber encontrado un
camino más allá de las
piedras que nos
bloquean el paso! Los
tres trabajadores, mi

Maestro, ¿adónde han
ido? ¡Malditos sean!
Los haré pedazos a
todos si vuelven a
aparecer, y quemaré
vivos a los demás en
una pira, ante todos,
como

advertencia de Tu
Poder. ¿Cómo han podido
pasar sin que los
viera? Duermo contra
las propias paredes
para oír Tus Palabras,
para sentir Tu Aliento.
No encuentro ninguna
salida

de las cámaras que la
mujer Sewel no conozca
o en la que no tenga
hombres excavando.
¿Adónde han ido,
Maestro? ¿Te los has
llevado Tú, o de verdad

huyen de Tu Presencia?
Los mataré si vuelven a
aparecer. Dame Fuerza,
mi Maestro, para
dejarlos vivir algo
más, hasta que hayan

cumplido su propósito y
yo me arrodille ante
Ti, cubierto de su
sangre."""
