title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day One:

The workers continue
tirelessly in their
efforts to unload our
supplies even as light
fades.  I feel I should
lend a hand in the

effort, and yet I
cannot bear to take my
attention away from
the magnificent stone
doors of the tomb.
Every inch of their
massive frame is
covered with

intricately carved
design work - 'tis
truly a sight to see.
I've spent the day
sketching and
cataloging what I can
of them while my
companions set up our

camp and make
preparations for
tomorrow's work.
Though the stonework
symbols inspire me to
new flights of fancy,
some of the workers
seem strangely

fearful of them.  I
cannot wait 'til the
morrow when those
ancient works of stone
shall swing open and
deliver unto me
everything I have
dreamed of for the

last ten years of my
life."""
item_template = "readable_book"
item_id = 0x0FF1
[translations]
[translations.cze]
title = "Deník: Objevení hrobky"
content = """Den první:

Dělníci neúnavně
pokračují ve vykládání
zásob, i když světlo
slábne. Cítím, že bych
jim měla podat pomocnou

ruku, a přece nedokážu
odtrhnout pozornost od
nádherných kamenných
vrat hrobky. Každý
palec jejich mohutného
rámu pokrývá

složitě vytesaná
výzdoba – je to opravdu
pohled hodný obdivu.
Celý den jsem ji podle
možností kreslila a
zapisovala, zatímco
moji společníci
budovali

tábor a chystali se na
zítřejší práci. Ačkoli
mě symboly v kameni
podněcují k novým
rozletům fantazie,
někteří dělníci se jich
podivně

bojí. Nemohu se dočkat
zítřka, kdy se ta dávná
kamenná díla otevřou a
vydají mi vše, o čem
jsem snila posledních

deset let svého života."""
[translations.fre]
title = "Journal : découverte du tombeau"
content = """Premier jour :

Les ouvriers
poursuivent sans
relâche leurs efforts
pour décharger nos
provisions, alors même
que la lumière baisse.
Je sens que je devrais
prêter main-forte à
cette

tâche, et pourtant je
ne puis détourner mon
attention des
magnifiques portes de
pierre du tombeau.
Chaque pouce de leur
cadre massif est
couvert de

motifs sculptés avec
finesse : c’est
vraiment un spectacle
splendide. J’ai passé
la journée à en
dessiner et à en
répertorier ce que je
pouvais, tandis que mes
compagnons installaient
notre

camp et préparaient le
travail du lendemain.
Si les symboles de
pierre m’inspirent de
nouveaux élans
d’imagination, certains
ouvriers semblent
étrangement

les craindre. J’ai hâte
d’être à demain,
lorsque ces antiques
ouvrages de pierre
s’ouvriront et me
livreront tout ce dont
j’ai rêvé durant les

dix dernières années de
ma vie."""
[translations.ger]
title = "Tagebuch: Entdeckung des Grabes"
content = """Erster Tag:

Die Arbeiter setzen
unermüdlich ihre
Bemühungen fort, unsere
Vorräte auszuladen,
selbst als das Licht
schwindet. Ich finde,
ich sollte bei der

Arbeit mithelfen, und
doch kann ich es nicht
ertragen, meine
Aufmerksamkeit von den
prächtigen Steintüren
des Grabes abzuwenden.
Jeder Zoll ihres
gewaltigen Rahmens ist
mit

kunstvoll gemeißelten
Mustern bedeckt –
wahrlich ein schöner
Anblick. Ich habe den
Tag damit verbracht, so
viel davon wie möglich
zu zeichnen und zu
verzeichnen, während
meine Gefährten unser

Lager aufschlagen und
Vorbereitungen für die
morgige Arbeit treffen.
Zwar regen die Symbole
im Stein meine
Phantasie zu neuen
Höhenflügen an, doch
manche Arbeiter
scheinen sich
seltsamerweise

vor ihnen zu fürchten.
Ich kann den morgigen
Tag kaum erwarten, wenn
diese uralten Werke aus
Stein aufschwingen und
mir alles schenken
werden, wovon ich
während der

letzten zehn Jahre
meines Lebens geträumt
habe."""
[translations.ita]
title = "Diario: scoperta della Tomba"
content = """Giorno Uno:

Gli operai continuano
instancabilmente a
scaricare le nostre
provviste anche mentre
la luce svanisce. Sento
che dovrei dare una
mano a questo

lavoro, eppure non
sopporto di distogliere
l'attenzione dalle
magnifiche porte di
pietra della tomba.
Ogni pollice della loro
massiccia cornice è
coperto di

motivi scolpiti con
grande complessità: è
davvero uno spettacolo
da vedere. Ho passato
il giorno a disegnarli
e catalogarli per
quanto potevo, mentre i
miei compagni montavano
il nostro

accampamento e facevano
i preparativi per il
lavoro di domani.
Sebbene i simboli nella
pietra mi ispirino
nuovi voli di fantasia,
alcuni operai sembrano
stranamente

spaventati da essi. Non
vedo l'ora che arrivi
domani, quando quelle
antiche opere di pietra
si spalancheranno e mi
consegneranno tutto ciò
che ho sognato negli

ultimi dieci anni della
mia vita."""
[translations.pol]
title = "Dziennik: odkrycie Grobowca"
content = """Dzień pierwszy:

Robotnicy niestrudzenie
wyładowują nasze
zapasy, nawet gdy
światło już gaśnie.
Czuję, że powinnam
pomóc w tym

wysiłku, lecz nie
potrafię oderwać uwagi
od wspaniałych
kamiennych drzwi
grobowca. Każdy cal ich
olbrzymiego obramowania
pokrywają

misternie wyrzeźbione
wzory — to naprawdę
widok godny ujrzenia.
Spędziłam dzień,
szkicując i katalogując
wszystko, co mogłam,
podczas gdy towarzysze
rozbijali

obóz i przygotowywali
jutrzejszą pracę. Choć
symbole w kamieniu
inspirują nowe wzloty
mej wyobraźni,
niektórzy robotnicy
zdają się dziwnie

ich obawiać. Nie mogę
doczekać się jutra, gdy
te pradawne kamienne
dzieła rozewrą się i
ofiarują mi wszystko, o
czym marzyłam przez

ostatnich dziesięć lat
życia."""
[translations.por]
title = "Diário: descoberta da tumba"
content = """Primeiro dia:

Os trabalhadores
continuam incansáveis
em seus esforços para
descarregar nossos
suprimentos, mesmo
enquanto a luz
desaparece. Sinto que
deveria ajudar nesse

esforço, mas não
consigo desviar minha
atenção das magníficas
portas de pedra da
tumba. Cada centímetro
de sua estrutura maciça
está coberto de

desenhos entalhados com
requinte: é realmente
uma visão admirável.
Passei o dia desenhando
e catalogando o que
pude delas enquanto
meus companheiros
montavam nosso

acampamento e faziam
preparativos para o
trabalho de amanhã.
Embora os símbolos na
pedra me inspirem novos
voos de imaginação,
alguns dos
trabalhadores parecem
estranhamente

amedrontados por eles.
Mal posso esperar até
amanhã, quando aquelas
antigas obras de pedra
se abrirão e me
entregarão tudo com que
sonhei nos

últimos dez anos de
minha vida."""
[translations.spa]
title = "Diario: descubrimiento de la tumba"
content = """Día uno:

Los trabajadores siguen
descargando nuestros
suministros sin
descanso, incluso
mientras se desvanece
la luz. Siento que
debería echar una mano
en la

tarea, pero no soporto
apartar la atención de
las magníficas puertas
de piedra de la tumba.
Cada centímetro de su
enorme marco está
cubierto de

diseños tallados de
gran complejidad: es
una visión
verdaderamente
admirable. He pasado el
día dibujando y
catalogando cuanto
puedo de ellas mientras
mis compañeros instalan
nuestro

campamento y preparan
el trabajo de mañana.
Aunque los símbolos de
la piedra inspiran
nuevos vuelos a mi
imaginación, algunos
trabajadores parecen
extrañamente

atemorizados por ellos.
No puedo esperar a
mañana, cuando esas
antiguas obras de
piedra se abran y me
entreguen todo aquello
con lo que he soñado
durante los

últimos diez años de mi
vida."""
