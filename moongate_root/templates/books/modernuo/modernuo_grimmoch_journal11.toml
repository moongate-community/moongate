title = "The daily journal of Grimmoch Drummel"
author = "Grimmoch"
content = """Day Eleven - Day
Thirteen :

Lysander is gone, and
two more workers
with him.  Good
riddance to the first.
He knows something.

He heard them too, I
know he did - and yet
he scowled at me
when I mentioned
them.  I cannot stop
the noise in my head,
the scratching, the
clawing tears at my

senses.  What is it?
What does Lysander
seek that I can only
turn from?  Where
has he gone?  The
only answer to my
questions comes as
laughter from behind

the stones."""
item_template = "readable_scroll"

[translations.cze]
title = "Denní zápisky Grimmoch Drummel"
content = """
Den jedenáctý až třináctý:

Lysander zmizel a s ním další dva dělníci. Toho prvního je dobře, že jsme se zbavili. Něco ví.

Také je slyšel, vím, že slyšel – a přesto se na mě mračil, když jsem se o nich zmínil. Nemohu zastavit hluk ve své hlavě, to škrábání, to drásání mi trhá

smysly. Co je to? Co Lysander hledá v tom, od čeho se já mohu jen odvracet? Kam odešel? Jediná odpověď na mé otázky přichází jako smích zpoza

kamenů."""

[translations.fre]
title = "Le journal quotidien de Grimmoch Drummel"
content = """
Du onzième au treizième jour :

Lysander est parti, avec deux autres ouvriers. Bon débarras pour le premier. Il sait quelque chose.

Il les a entendus lui aussi, je le sais, et pourtant il m’a regardé de travers quand je les ai mentionnés. Je n’arrive pas à faire cesser le bruit dans ma tête, les grattements, les coups de griffes déchirent mes

sens. Qu’est-ce donc ? Que cherche Lysander, que je ne puis que fuir ? Où est-il allé ? La seule réponse à mes questions est un rire qui vient de derrière

les pierres."""

[translations.ger]
title = "Grimmoch Drummels tägliches Tagebuch"
content = """
Elfter bis dreizehnter Tag:

Lysander ist fort und zwei weitere Arbeiter mit ihm. Den Ersten sind wir zum Glück los. Er weiß etwas.

Er hat sie auch gehört, ich weiß, dass er sie gehört hat – und doch sah er mich finster an, als ich sie erwähnte. Ich kann den Lärm in meinem Kopf nicht zum Schweigen bringen, das Kratzen, das Krallen zerrt an meinen

Sinnen. Was ist es? Was sucht Lysander, wovon ich mich nur abwenden kann? Wohin ist er gegangen? Die einzige Antwort auf meine Fragen kommt als Gelächter hinter

den Steinen hervor."""

[translations.ita]
title = "Il diario quotidiano di Grimmoch Drummel"
content = """
Giorno Undici - Giorno Tredici :

Lysander è scomparso, e con lui altri due operai. Tanto meglio per il primo. Sa qualcosa.

Li ha sentiti anche lui, so che li ha sentiti; eppure mi ha guardato torvo quando li ho nominati. Non riesco a fermare il rumore nella testa, il graffiare, lo strappare con gli artigli lacera i miei

sensi. Che cos'è? Che cosa cerca Lysander, da cui io posso soltanto distogliere lo sguardo? Dove è andato? L'unica risposta alle mie domande giunge come una risata da dietro

le pietre."""

[translations.pol]
title = "Dziennik codzienny Grimmoch Drummel"
content = """
Dzień jedenasty — dzień trzynasty:

Lysander odszedł, a z nim jeszcze dwóch robotników. Pierwszego żegnam bez żalu. On coś wie.

On też ich słyszał, wiem, że słyszał — a jednak skrzywił się, gdy o nich wspomniałem. Nie mogę uciszyć hałasu w głowie; drapanie, szarpanie pazurów rozdziera moje

zmysły. Co to jest? Czego szuka Lysander, od czego ja potrafię tylko się odwrócić? Dokąd odszedł? Jedyną odpowiedzią na moje pytania jest śmiech zza

kamieni."""

[translations.por]
title = "O diário de Grimmoch Drummel"
content = """
Décimo primeiro dia - Décimo terceiro dia:

Lysander desapareceu, e mais dois trabalhadores com ele. Já vai tarde, no caso do primeiro. Ele sabe de alguma coisa.

Ele também os ouviu, sei que ouviu; e, no entanto, me olhou feio quando os mencionei. Não consigo parar o ruído na minha cabeça, os arranhões, as garras dilacerando meus

sentidos. O que é isso? O que Lysander procura, diante do qual só posso me afastar? Para onde ele foi? A única resposta às minhas perguntas vem como risadas por trás

das pedras."""

[translations.spa]
title = "El diario de Grimmoch Drummel"
content = """
Día once - Día trece:

Lysander se ha marchado, y con él otros dos trabajadores. Del primero me alegro de librarme. Sabe algo.

Él también los oyó, sé que los oyó, y aun así me miró con el ceño fruncido cuando los mencioné. No puedo detener el ruido en mi cabeza; el rascar, el arañar desgarra mis

sentidos. ¿Qué es? ¿Qué busca Lysander en aquello de lo que yo solo puedo apartarme? ¿Adónde ha ido? La única respuesta a mis preguntas llega en forma de risas desde detrás

de las piedras."""
