title = "Ethical Hedonism: An Introduction"
author = "Richard Garriott"
content = """  Societies oft have
common codes of
conduct which it
expects all its people
to abide by. Now,
while 'tis true that
this can offer some
advantages, most of

the codes I see today
around Britannia have
fatal flaws. Let us
examine them.
  First, there is
Blackthorn's code of
Chaos or basically
Anarchy. Whereas

this affords the
individual maximum
opportunity for
individuality and even
pursuit of personal
happiness, it does not
offer even basic
interpersonal conduct

codes to prevent
people from killing
each other.
  Without such basic
tenets, all the people
will need to spend a
significant portion of
their time and effort

towards personal
protection and thus
less time towards
other more beneficial
pursuits.
  Then there are the
moral codes that are
so popular today.

These codes are built
largely on historical
tradition rather than
current logic and thus
are also antiquated.
For example many
moral codes we see
today include

statements about not
eating certain foods
that once were often
poisonous, but today
can be prepared
safely.
  Many forbid contact
between young people

of the opposite
gender, which can in
fact be hazardous; but
the codes often have
lost the context as to
why this is done,
instead merely calling
it amoral. In this day

and age to call that a
necessary moral
would need a new
reasoning. I put forth
that tradition is not
enough
  Then there are
Lord British's

Virtues. It strikes me
that while a system
of virtues is
wonderful as a
touchstone to guide a
society to good
behavior, these are
but shades of the

underlying truth as to
why one may wish to
live a life according to
certain rules of
conduct.
  On the other hand,
clearly the Virtues
that I have heard

Lord British speak of
are clearly positive
codes of conduct, far
better than the world
of anarchy that Lord
Blackthorn suggests.
Yet, are not these
Virtues still derived

from a set of
principles which
though they sound
good, are difficult to
pin down as actual,
undeniable, rational
truths?
  Worse yet though

imagine a society
who's code of
conduct was based on
pure survival of the
strongest. While this
society may function
and even accomplish
much, it can be

fairly argued that
personal happiness
would suffer greatly,
except for those at
the top. To rule that
out, however, we
must first believe
that people have a

right to pursue
happiness.
  I hope is a safe
assumption that all
beings wish to be
happy; I will broadly
describe this as
Hedonism. Yet, if all

people did is live a
life of hedonism,
their hedonism might
be in conflict with
those near them, so I
will use the term
Ethics to describe
limits one might put

on one's hedonistic
tendencies to allow
others to pursue their
happiness as well.
  Allow me to give
this example: If one
were to live alone on a
desert isle, one could

live a life of pure
hedonism, for no
action one might take
could interfere with
another's right to
pursue their
happiness. Poison the
lake if you like, there

is no one to blame but
yourself!
  Now suppose two
of you live on that
island. Thou dost not
want thy neighbor to
feel free to poison the
lake. Would it not be

better to consider it
unethical to poison the
lake without first
thinking of those
whose pursuit of
happiness might be
affected by this
action?

  I put forth that it is
the fact that we as a
people choose to live in
groups known as a
society that causes us
to compromise our
pure hedonism with
logical ethics.

Likewise we accept
not being able to kill
others without
reason, because our
own pursuit of
happiness would be
greatly interfered
with if we feared

others would do the
same to us. From
this basis of logic can
be formed the Tenets
of Ethical Hedonism.
  For more on this
subject, see The
Tenants of Ethical

Hedonism, by
Richard Garriott and
Herman Miller."""
item_template = "readable_scroll"

[translations.cze]
title = "Etický hédonismus: Úvod"
content = """
Společnosti často mají
společná pravidla
chování, jejichž
dodržování očekávají od
všech svých lidí. Ačkoli
to jistě může přinést
některé výhody, většina

pravidel, která dnes
vidím v zemi Britannia,
má osudové nedostatky.
Prozkoumejme je.
Nejprve je tu
Blackthornův řád Chaosu,
neboli v zásadě
anarchie. Ačkoli

poskytuje jednotlivci
největší možnost
osobitosti i hledání
vlastního štěstí,
nenabízí ani základní
pravidla mezilidského
chování,

která by lidem bránila
vzájemně se zabíjet.
Bez takových základních
zásad budou všichni lidé
muset vynakládat značnou
část času a úsilí

na osobní ochranu, a
tedy méně času na jiné,
prospěšnější činnosti.
Pak jsou tu mravní
kodexy, které jsou dnes
tak oblíbené.

Tyto kodexy se zakládají
převážně na historické
tradici místo na
současné logice, a jsou
tudíž také zastaralé.
Například mnohé dnešní
mravní kodexy obsahují

přikázání nejíst určité
potraviny, které byly
kdysi často jedovaté,
dnes je však lze
připravit bezpečně.
Mnohé zakazují styk mezi
mladými lidmi

opačného pohlaví, který
opravdu může být
nebezpečný; z kodexů se
však často vytratil
důvod tohoto jednání a
místo něj takový styk
prostě nazývají
nemravným. V dnešní

době by označení takové
zásady za nezbytnou
součást mravnosti
vyžadovalo nové
zdůvodnění. Tvrdím, že
tradice nestačí.
Potom jsou tu Ctnosti,
které hlásá Lord
British.

Zdá se mi, že ačkoli je
soustava ctností skvělým
měřítkem, které vede
společnost k dobrému
chování, jsou jen
odstíny

hlubší pravdy o tom,
proč by člověk mohl
chtít žít podle určitých
pravidel chování.
Na druhou stranu jsou
Ctnosti, o nichž jsem
slyšel

mluvit Lord British,
zjevně kladnými pravidly
chování, mnohem lepšími
než svět anarchie
navrhovaný Lord
Blackthorn. Nejsou však
tyto Ctnosti stále
odvozeny

od souboru zásad, které
sice dobře znějí, ale
těžko je lze určit jako
skutečné, nepopiratelné
a rozumové pravdy?
Ještě hůře:

představme si
společnost, jejíž
pravidla chování by se
zakládala na čistém
přežití nejsilnějšího.
Ačkoli by tato
společnost mohla
fungovat a dokonce mnoho
dokázat, lze

právem tvrdit, že osobní
štěstí by silně utrpělo,
vyjma těch na vrcholu.
Abychom to však
vyloučili, musíme
nejprve věřit, že lidé
mají

právo usilovat o štěstí.
Doufám, že lze bezpečně
předpokládat, že všechny
bytosti chtějí být
šťastné; široce to
označím jako hédonismus.
Pokud by však všichni

lidé pouze žili
hédonisticky, mohl by se
jejich hédonismus
střetávat s hédonismem
těch kolem nich; proto
budu slovem etika
označovat omezení, která
člověk může uvalit

na své hédonistické
sklony, aby umožnil i
ostatním usilovat o
štěstí.
Dovolte mi tento
příklad: Kdyby člověk
žil sám na pustém
ostrově, mohl by

žít čistě hédonisticky,
neboť žádný jeho čin by
nemohl narušit právo
druhého usilovat o
štěstí. Otrav jezero,
chceš-li;

nemáš koho vinit, leda
sebe!
Nyní předpokládejme, že
na tom ostrově žijete
dva. Nechceš, aby tvůj
soused měl volnost
otrávit jezero. Nebylo
by

lepší pokládat otrávení
jezera za neetické,
pokud by člověk nejprve
nezvážil ty, jejichž
usilování o štěstí by
tento čin mohl ovlivnit?

Tvrdím, že právě naše
rozhodnutí žít v
uskupeních zvaných
společnost nás vede ke
kompromisu mezi čistým
hédonismem a logickou
etikou.

Podobně přijímáme, že
nesmíme bezdůvodně
zabíjet druhé, protože
naše vlastní hledání
štěstí by bylo silně
narušeno, kdybychom se
báli,

že nám ostatní udělají
totéž. Na tomto logickém
základě lze vytvořit
Zásady etického
hédonismu.
Další informace o tomto
tématu naleznete v knize
Zásady etického

hédonismu, jejímiž
autory jsou Richard
Garriott a Herman
Miller."""

[translations.fre]
title = "L’hédonisme éthique : une introduction"
content = """
Les sociétés possèdent
souvent des codes de
conduite communs
qu’elles attendent de
tous leurs membres
qu’ils respectent. Or,
s’il est vrai que cela
peut offrir certains
avantages, la plupart

des codes que je vois
aujourd’hui en Britannia
ont des défauts
rédhibitoires.
Examinons-les. D’abord,
il y a le code du Chaos
de Blackthorn, ou,
fondamentalement,
l’anarchie. Si

celui-ci offre à
l’individu le maximum de
possibilités d’affirmer
son individualité et
même de poursuivre son
bonheur personnel, il ne
propose pas même de
codes élémentaires de
conduite entre personnes

pour empêcher les gens
de s’entretuer. Sans de
tels principes
fondamentaux, chacun
devra consacrer une part
importante de son temps
et de ses efforts

à sa protection
personnelle, et donc
moins de temps à
d’autres activités plus
profitables. Ensuite
viennent les codes
moraux si populaires
aujourd’hui.

Ces codes sont largement
fondés sur la tradition
historique plutôt que
sur la logique actuelle,
et sont donc également
surannés. Par exemple,
nombre des codes moraux
que nous voyons
aujourd’hui comportent

des prescriptions
interdisant de manger
certains aliments
autrefois souvent
toxiques, mais que l’on
peut aujourd’hui
préparer sans danger.
Beaucoup interdisent les
contacts entre jeunes
gens

de sexes opposés, qui
peuvent effectivement
être dangereux ; mais
ces codes ont souvent
perdu le contexte
expliquant cette
interdiction et se
contentent de qualifier
la chose d’amorale. En
notre

époque, pour y voir une
règle morale nécessaire,
il faudrait un nouveau
raisonnement. J’affirme
que la tradition ne
suffit pas
Puis viennent les

Vertus de Lord British.
Il me semble que, si un
système de vertus est
une merveilleuse pierre
de touche pour guider
une société vers une
bonne conduite,
celles-ci ne sont que
les ombres de la

vérité sous-jacente
expliquant pourquoi l’on
pourrait vouloir mener
sa vie selon certaines
règles de conduite. D’un
autre côté, les Vertus
dont j’ai entendu

parler Lord British sont
manifestement des codes
de conduite positifs,
bien supérieurs au monde
d’anarchie que suggère
Lord Blackthorn.
Pourtant, ces Vertus ne
sont-elles pas toujours
dérivées

d’un ensemble de
principes qui, bien
qu’ils paraissent bons,
sont difficiles à
définir comme des
vérités réelles,
indéniables et
rationnelles ? Pis
encore,

imaginez une société
dont le code de conduite
serait fondé sur la
seule survie du plus
fort. Si cette société
peut fonctionner et même
accomplir beaucoup de
choses, l’on peut

raisonnablement soutenir
que le bonheur personnel
en souffrirait
grandement, sauf pour
ceux qui sont au sommet.
Pour l’écarter,
cependant, nous devons
d’abord croire que les
gens ont le

droit de rechercher le
bonheur. J’espère
pouvoir supposer sans
risque que tous les
êtres souhaitent être
heureux ; je décrirai
cela, dans les grandes
lignes, comme
l’hédonisme. Pourtant,
si tous les

gens ne faisaient que
vivre une vie
d’hédonisme, celui-ci
pourrait entrer en
conflit avec celui de
leurs voisins ;
j’utiliserai donc le
terme d’éthique pour
décrire les limites que
l’on pourrait imposer

à ses tendances
hédonistes afin de
permettre aux autres de
rechercher eux aussi
leur bonheur.
Permettez-moi de donner
cet exemple : si l’on
vivait seul sur une île
déserte, on pourrait

mener une vie de pur
hédonisme, car aucune de
nos actions ne pourrait
empiéter sur le droit
d’autrui à rechercher
son bonheur. Empoisonnez
le lac si bon vous
semble, il n’y a

personne à blâmer que
vous-même ! Supposons
maintenant que vous
soyez deux à vivre sur
cette île. Vous ne
souhaitez pas que votre
voisin se sente libre
d’empoisonner le lac. Ne
vaudrait-il pas

mieux considérer comme
contraire à l’éthique le
fait d’empoisonner le
lac sans penser d’abord
à ceux dont la quête du
bonheur pourrait être
affectée par cette
action ?

J’affirme que c’est le
fait de choisir, en tant
que peuple, de vivre
dans des groupes appelés
sociétés qui nous amène
à tempérer notre pur
hédonisme par une
éthique logique.

De même, nous acceptons
de ne pas pouvoir tuer
autrui sans raison,
parce que notre propre
quête du bonheur serait
grandement entravée si
nous craignions

que les autres nous
fassent la même chose.
Sur cette base logique
peuvent être établis les
Principes de l’hédonisme
éthique. Pour en savoir
plus à ce sujet, voir
Les Principes de
l’hédonisme

éthique, par Richard
Garriott et Herman
Miller."""

[translations.ger]
title = "Ethischer Hedonismus: Eine Einführung"
content = """
Gesellschaften haben oft
gemeinsame
Verhaltensregeln, deren
Befolgung sie von all
ihren Menschen erwarten.
Nun kann dies zwar
einige Vorteile bieten,
doch die meisten

Regelwerke, die ich
heute in Britannia sehe,
haben verhängnisvolle
Schwächen. Untersuchen
wir sie.
Zunächst gibt es
Blackthorns Lehre des
Chaos, im Grunde der
Anarchie. Zwar

bietet diese dem
Einzelnen die
größtmögliche
Gelegenheit zur
Eigenständigkeit und
sogar zum Streben nach
persönlichem Glück, doch
bietet sie nicht einmal
grundlegende
zwischenmenschliche

Verhaltensregeln, die
verhindern, dass
Menschen einander töten.
Ohne solche
grundlegenden Lehrsätze
müssen alle Menschen
einen beträchtlichen
Teil ihrer Zeit und Mühe

für den eigenen Schutz
aufwenden und haben
dadurch weniger Zeit für
andere, nützlichere
Beschäftigungen.
Dann gibt es die
moralischen Regelwerke,
die heute so beliebt
sind.

Diese Regelwerke beruhen
weitgehend auf
geschichtlicher
Überlieferung statt auf
gegenwärtiger Vernunft
und sind daher ebenfalls
veraltet. Beispielsweise
enthalten viele
moralische Regelwerke,
die wir heute sehen,

Aussagen darüber,
gewisse Speisen nicht zu
essen, die einst oft
giftig waren, heute
jedoch gefahrlos
zubereitet werden
können.
Viele verbieten den
Umgang zwischen jungen
Menschen

verschiedenen
Geschlechts, der
tatsächlich gefährlich
sein kann; doch den
Regelwerken ist oft der
Zusammenhang
verlorengegangen, warum
dies geschieht, und sie
nennen es stattdessen
bloß unmoralisch. In der
heutigen

Zeit bedürfte es einer
neuen Begründung, um
dies als notwendige
Moralregel zu
bezeichnen. Ich
behaupte, Überlieferung
reicht nicht aus
Dann gibt es Lord
Britishs

Tugenden. Mir scheint,
ein System von Tugenden
ist zwar wunderbar als
Prüfstein, um eine
Gesellschaft zu gutem
Verhalten zu führen,
doch sind diese nur
Schatten der

zugrunde liegenden
Wahrheit darüber, warum
man sein Leben nach
bestimmten
Verhaltensregeln führen
möchte.
Andererseits sind die
Tugenden, von denen ich

Lord British habe
sprechen hören,
eindeutig positive
Verhaltensregeln, weit
besser als die Welt der
Anarchie, die Lord
Blackthorn vorschlägt.
Doch sind diese Tugenden
nicht weiterhin aus

einer Reihe von
Grundsätzen abgeleitet,
die zwar gut klingen,
sich aber schwer als
tatsächliche,
unleugbare, vernünftige
Wahrheiten festmachen
lassen?
Noch schlimmer wäre
jedoch,

sich eine Gesellschaft
vorzustellen, deren
Verhaltensregeln auf dem
bloßen Überleben des
Stärksten beruhen. Zwar
mag diese Gesellschaft
funktionieren und sogar
viel erreichen, doch
lässt sich

mit Recht behaupten,
dass das persönliche
Glück darunter sehr
leiden würde, außer bei
jenen an der Spitze. Um
dies auszuschließen,
müssen wir jedoch zuerst
glauben, dass Menschen
ein

Recht auf das Streben
nach Glück besitzen.
Ich hoffe, es ist eine
sichere Annahme, dass
alle Wesen glücklich
sein wollen; ich werde
dies allgemein als
Hedonismus bezeichnen.
Würden jedoch alle

Menschen nur ein
hedonistisches Leben
führen, könnte ihr
Hedonismus mit dem ihrer
Nachbarn in Widerstreit
geraten. Daher werde ich
den Begriff Ethik
verwenden, um Grenzen zu
beschreiben, die man

seinen hedonistischen
Neigungen setzen könnte,
damit auch andere nach
ihrem Glück streben
können.
Gestattet mir dieses
Beispiel: Lebte man
allein auf einer
einsamen Insel, so
könnte man

ein Leben in reinem
Hedonismus führen, denn
keine Handlung könnte
das Recht eines anderen
stören, nach seinem
Glück zu streben.
Vergiftet den See, wenn
Ihr wollt, es

gibt niemanden, dem Ihr
die Schuld geben könnt,
außer Euch selbst!
Nehmen wir nun an, Ihr
lebt zu zweit auf dieser
Insel. Ihr wollt nicht,
dass Euer Nachbar sich
frei fühlt, den See zu
vergiften. Wäre es nicht

besser, es für unethisch
zu halten, den See zu
vergiften, ohne zuerst
an jene zu denken, deren
Streben nach Glück von
dieser Handlung
betroffen sein könnte?

Ich behaupte, es ist die
Tatsache, dass wir als
Menschen uns
entscheiden, in Gruppen
zu leben, die
Gesellschaft genannt
werden, die uns dazu
bringt, unseren reinen
Hedonismus mit
vernünftiger Ethik in
Einklang zu bringen.

Ebenso akzeptieren wir,
andere nicht ohne Grund
töten zu dürfen, weil
unser eigenes Streben
nach Glück sehr
behindert würde, wenn
wir fürchteten,

andere würden uns
dasselbe antun. Aus
dieser Grundlage der
Vernunft können die
Lehrsätze des Ethischen
Hedonismus gebildet
werden.
Mehr zu diesem Thema
findet sich in „Die
Lehrsätze des Ethischen

Hedonismus“ von Richard
Garriott und Herman
Miller."""

[translations.ita]
title = "Edonismo etico: un’introduzione"
content = """
Le società hanno spesso
codici di condotta
comuni che si aspettano
tutti i loro membri
rispettino. Ora, sebbene
sia vero che ciò può
offrire alcuni vantaggi,
la maggior parte

dei codici che vedo oggi
in Britannia presenta
difetti fatali.
Esaminiamoli.
Anzitutto vi è il codice
del Caos, o
fondamentalmente
dell'Anarchia, di
Blackthorn. Sebbene

questo offra
all'individuo la massima
possibilità di esprimere
la propria individualità
e persino di perseguire
la felicità personale,
non offre neppure codici
basilari di condotta
interpersonale

per impedire alle
persone di uccidersi a
vicenda.
Senza tali princìpi
fondamentali, tutti
dovranno dedicare una
parte considerevole del
proprio tempo e delle
proprie energie

alla protezione
personale, e dunque meno
tempo ad altre attività
più benefiche.
Vi sono poi i codici
morali tanto popolari
oggi.

Questi codici si fondano
in gran parte sulla
tradizione storica
anziché sulla logica
attuale, e sono dunque
anch'essi antiquati. Per
esempio, molti codici
morali che vediamo oggi
includono

prescrizioni sul non
mangiare certi cibi che
un tempo erano spesso
velenosi, ma che oggi
possono essere preparati
senza pericolo.
Molti vietano il
contatto fra giovani

di sesso opposto, cosa
che può in effetti
essere rischiosa; ma i
codici hanno spesso
perso il contesto del
perché ciò venga fatto,
limitandosi invece a
definirlo amorale. Al
giorno

d'oggi, per considerarla
una norma morale
necessaria occorrerebbe
un nuovo ragionamento.
Sostengo che la
tradizione non basti
Vi sono poi le

Virtù di Lord British.
Mi colpisce che, sebbene
un sistema di virtù sia
meraviglioso come pietra
di paragone per guidare
una società alla buona
condotta, queste siano
soltanto sfumature della

verità sottostante sul
perché si possa
desiderare di vivere
secondo certe regole di
condotta.
D'altro canto,
chiaramente le Virtù di
cui ho sentito

parlare Lord British
sono codici di condotta
chiaramente positivi,
assai migliori del mondo
anarchico proposto da
Lord Blackthorn. Eppure
queste Virtù non
derivano ancora

da un insieme di
princìpi che, pur
suonando bene, sono
difficili da definire
come verità effettive,
innegabili e razionali?
Peggio ancora, tuttavia,

immaginate una società
il cui codice di
condotta si basi sulla
pura sopravvivenza del
più forte. Sebbene
questa società possa
funzionare e persino
realizzare molto, si può

ragionevolmente
sostenere che la
felicità personale ne
soffrirebbe molto, salvo
per chi è al vertice.
Per escluderlo,
tuttavia, dobbiamo prima
credere che le persone
abbiano il

diritto di perseguire la
felicità.
Spero sia lecito
presumere che tutti gli
esseri desiderino essere
felici; descriverò ciò,
in senso ampio, come
Edonismo. Eppure, se
tutto ciò

che le persone facessero
fosse vivere una vita di
edonismo, il loro
edonismo potrebbe
entrare in conflitto con
chi è loro vicino,
quindi userò il termine
Etica per descrivere i
limiti che si potrebbero
porre

alle proprie tendenze
edonistiche per
permettere anche agli
altri di perseguire la
felicità.
Consentitemi questo
esempio: se qualcuno
vivesse da solo su
un'isola deserta,
potrebbe

vivere una vita di puro
edonismo, poiché nessuna
azione potrebbe
interferire con il
diritto altrui di
perseguire la felicità.
Avvelenate pure il lago,
se vi va: non c'è

nessuno da biasimare se
non voi stessi!
Ora supponiamo che su
quell'isola viviate in
due. Non vorreste che il
vostro vicino si
sentisse libero di
avvelenare il lago. Non
sarebbe

meglio considerare non
etico avvelenare il lago
senza prima pensare a
coloro la cui ricerca
della felicità potrebbe
essere influenzata da
tale azione?

Sostengo che sia il
fatto che noi, come
popolo, scegliamo di
vivere in gruppi detti
società a farci
temperare il nostro puro
edonismo con un'etica
logica.

Allo stesso modo
accettiamo di non poter
uccidere gli altri senza
motivo, poiché la nostra
ricerca della felicità
sarebbe gravemente
ostacolata se temessimo

che gli altri facessero
lo stesso a noi. Da
questa base logica si
possono formulare i
Princìpi dell'Edonismo
Etico.
Per approfondire questo
argomento, si vedano I
Princìpi dell'Edonismo

Etico, di Richard
Garriott e Herman
Miller."""

[translations.pol]
title = "Hedonizm etyczny: wprowadzenie"
content = """
Społeczeństwa często
mają wspólne kodeksy
postępowania, których
przestrzegania oczekują
od wszystkich swych
członków. Choć prawdą
jest, że może to
przynosić pewne
korzyści, większość

kodeksów, jakie dziś
widzę w Britannia, ma
fatalne wady.
Przyjrzyjmy się im.
Po pierwsze, istnieje
kodeks Chaosu
Blackthorn, czyli
zasadniczo Anarchii.
Choć

daje on jednostce
największą możliwość
zachowania
indywidualności, a nawet
dążenia do osobistego
szczęścia, nie oferuje
choćby podstawowych
zasad stosunków między
ludźmi,

które powstrzymywałyby
ich od wzajemnego
zabijania.
Bez takich podstawowych
założeń wszyscy będą
musieli poświęcać
znaczną część czasu i
wysiłku

na własną ochronę, a
zatem mniej czasu na
inne, pożyteczniejsze
zajęcia.
Następnie mamy kodeksy
moralne, tak popularne
obecnie.

Kodeksy te opierają się
w znacznej mierze na
tradycji historycznej, a
nie współczesnej logice,
są więc również
przestarzałe. Na
przykład wiele
dzisiejszych kodeksów
moralnych zawiera

zakazy jedzenia pewnych
pokarmów, które dawniej
często bywały trujące,
ale dziś można
przyrządzać bezpiecznie.
Wiele zabrania kontaktów
między młodymi ludźmi

odmiennej płci, co
istotnie może być
niebezpieczne; lecz
kodeksy często utraciły
kontekst uzasadniający
ten zakaz, a jedynie
nazywają to niemoralnym.
W dzisiejszych

czasach uznanie tego za
konieczną zasadę moralną
wymagałoby nowego
uzasadnienia. Twierdzę,
że tradycja nie
wystarcza.
Są też Cnoty Lord
British.

Uważam, że choć system
cnót jest wspaniałym
punktem odniesienia,
który prowadzi
społeczeństwo ku dobremu
postępowaniu, są one
jedynie odcieniami

głębszej prawdy
wyjaśniającej, dlaczego
ktoś chciałby żyć według
pewnych zasad
postępowania.
Z drugiej strony Cnoty,
o których słyszałem, jak
mówi

Lord British, są
wyraźnie pozytywnymi
zasadami postępowania,
znacznie lepszymi od
świata anarchii
proponowanego przez Lord
Blackthorn. Czy jednak
te Cnoty nadal nie
wywodzą się

ze zbioru zasad, które,
choć brzmią dobrze,
trudno uznać za
rzeczywiste,
niezaprzeczalne,
racjonalne prawdy?
Co gorsza,

wyobraźmy sobie
społeczeństwo, którego
kodeks postępowania
oparto na samym
przetrwaniu
najsilniejszych. Choć
mogłoby ono
funkcjonować, a nawet
wiele osiągnąć, można

zasadnie twierdzić, że
osobiste szczęście
znacznie by ucierpiało,
z wyjątkiem tych na
szczycie. Aby jednak
wykluczyć ten model,
musimy najpierw wierzyć,
że ludzie mają

prawo dążyć do
szczęścia.
Mam nadzieję, że
założenie, iż wszystkie
istoty pragną być
szczęśliwe, jest
bezpieczne; nazwę to
szeroko hedonizmem.
Jednak gdyby wszyscy

ludzie jedynie wiedli
życie hedonistów, ich
hedonizm mógłby
kolidować z hedonizmem
sąsiadów, więc użyję
terminu „etyka”, by
opisać ograniczenia,
jakie można nałożyć

na swoje hedonistyczne
skłonności, by także
innym pozwolić dążyć do
szczęścia.
Podam przykład: gdyby
ktoś żył samotnie na
bezludnej wyspie, mógłby

wieść życie czystego
hedonizmu, gdyż żaden
jego czyn nie naruszałby
prawa drugiej osoby do
dążenia do szczęścia.
Zatruj jezioro, jeśli
chcesz: nie

ma kogo winić prócz
ciebie!
Załóżmy teraz, że na tej
wyspie mieszka was
dwoje. Nie chcesz, by
twój sąsiad czuł, że
może swobodnie zatruć
jezioro. Czy nie

lepiej byłoby uznać za
nieetyczne zatrucie
jeziora bez uprzedniego
pomyślenia o tych,
których dążenie do
szczęścia mogłoby
ucierpieć wskutek
takiego czynu?

Twierdzę, że właśnie
wybór życia w grupach
zwanych społeczeństwem
skłania nas, jako lud,
do pogodzenia czystego
hedonizmu z logiczną
etyką.

Podobnie godzimy się na
zakaz zabijania innych
bez powodu, ponieważ
nasze własne dążenie do
szczęścia zostałoby
poważnie utrudnione,
gdybyśmy obawiali się,

że inni uczynią nam to
samo. Z tej logicznej
podstawy można
wyprowadzić Zasady
Hedonizmu Etycznego.
Więcej na ten temat w
książce „Zasady
Hedonizmu

Etycznego” Richard
Garriott i Herman
Miller."""

[translations.por]
title = "Hedonismo ético: uma introdução"
content = """
As sociedades
frequentemente têm
códigos comuns de
conduta que esperam que
todo o seu povo siga.
Ora, embora seja verdade
que isso possa oferecer
algumas vantagens, a
maioria dos

códigos que vejo hoje
por Britannia tem falhas
fatais. Vamos
examiná-los.
Primeiro, há o código do
Caos de Blackthorn, ou
basicamente a Anarquia.
Embora

isso ofereça ao
indivíduo a máxima
oportunidade de
individualidade e até de
buscar a felicidade
pessoal, não oferece
sequer códigos básicos
de conduta interpessoal

que impeçam as pessoas
de matarem umas às
outras.
Sem tais princípios
básicos, todas as
pessoas precisarão
dedicar uma parcela
significativa de seu
tempo e esforço

à proteção pessoal e,
portanto, menos tempo a
outras atividades mais
benéficas.
Depois há os códigos
morais tão populares
hoje.

Esses códigos se baseiam
em grande parte na
tradição histórica, em
vez da lógica atual, e,
portanto, também são
antiquados. Por exemplo,
muitos códigos morais
que vemos hoje incluem

afirmações sobre não
comer certos alimentos
que antes eram
frequentemente
venenosos, mas que hoje
podem ser preparados com
segurança.
Muitos proíbem o contato
entre jovens

de sexos opostos, o que
de fato pode ser
perigoso; mas os códigos
muitas vezes perderam o
contexto do motivo pelo
qual isso é feito,
limitando-se a chamá-lo
de imoral. Nos dias

atuais, chamar isso de
uma regra moral
necessária exigiria um
novo raciocínio.
Sustento que a tradição
não basta.
Depois há as

Virtudes de Lord
British. Parece-me que,
embora um sistema de
virtudes seja
maravilhoso como
referência para guiar
uma sociedade ao bom
comportamento, elas são
apenas sombras da

verdade subjacente sobre
por que alguém pode
desejar viver segundo
certas regras de
conduta.
Por outro lado, as
Virtudes de que ouvi

Lord British falar são
claramente códigos
positivos de conduta,
muito melhores do que o
mundo de anarquia
sugerido por Lord
Blackthorn. Ainda assim,
essas Virtudes não
derivam de

um conjunto de
princípios que, embora
soem bem, são difíceis
de definir como verdades
efetivas, inegáveis e
racionais?
Pior ainda, imagine

uma sociedade cujo
código de conduta se
baseasse na pura
sobrevivência dos mais
fortes. Embora essa
sociedade possa
funcionar e até realizar
muito, pode-se

argumentar com justiça
que a felicidade pessoal
sofreria muito, exceto
para os que estão no
topo. Para descartar
isso, porém, primeiro
precisamos acreditar que
as pessoas têm o

direito de buscar a
felicidade.
Espero que seja seguro
supor que todos os seres
desejam ser felizes; vou
descrever isso, em
termos gerais, como
Hedonismo. Contudo, se
tudo o que

as pessoas fizessem
fosse viver uma vida de
hedonismo, seu hedonismo
poderia entrar em
conflito com o daqueles
ao seu redor; por isso,
usarei o termo Ética
para descrever os
limites que alguém pode
impor

às próprias tendências
hedonistas para permitir
que os outros também
busquem sua felicidade.
Permita-me dar este
exemplo: se alguém
vivesse sozinho numa
ilha deserta, poderia

viver uma vida de puro
hedonismo, pois nenhuma
ação que pudesse tomar
interferiria no direito
de outra pessoa de
buscar sua felicidade.
Envenene o lago, se
quiser; não

há ninguém a quem culpar
além de você mesmo!
Agora suponha que dois
de vocês vivam naquela
ilha. Você não quer que
seu vizinho se sinta
livre para envenenar o
lago. Não seria

melhor considerar
antiético envenenar o
lago sem antes pensar
naqueles cuja busca da
felicidade poderia ser
afetada por essa ação?

Sustento que é o fato de
nós, como povo,
escolhermos viver em
grupos conhecidos como
sociedade que nos leva a
moderar nosso puro
hedonismo com uma ética
lógica.

Da mesma forma,
aceitamos não poder
matar os outros sem
motivo, porque nossa
própria busca da
felicidade seria muito
prejudicada se
temêssemos que

os outros fizessem o
mesmo conosco. Dessa
base lógica podem ser
formados os Princípios
do Hedonismo Ético.
Para saber mais sobre
este assunto, veja Os
Princípios do Hedonismo

Ético, de Richard
Garriott e Herman
Miller."""

[translations.spa]
title = "Hedonismo ético: una introducción"
content = """
  Las sociedades suelen
tener códigos comunes de
conducta que esperan que
todos sus miembros
cumplan. Aunque es
cierto que esto puede
ofrecer algunas
ventajas, la mayoría de

los códigos que hoy veo
en Britannia tienen
fallas fatales.
Examinémoslos. En primer
lugar está el código de
Caos de Blackthorn, que
es, en esencia,
Anarquía. Si bien

concede al individuo la
máxima oportunidad para
expresar su
individualidad e incluso
buscar su felicidad
personal, no ofrece ni
siquiera unas normas
básicas de trato entre
personas

que impidan que se maten
unas a otras. Sin esos
principios elementales,
todos tendrán que
dedicar una parte
considerable de su
tiempo y esfuerzo

a protegerse, y por
tanto menos tiempo a
otras ocupaciones más
beneficiosas. Luego
están los códigos
morales, tan populares
hoy en día.

Estos códigos se apoyan
en gran medida en la
tradición histórica y no
en la lógica actual, por
lo que también han
quedado anticuados. Por
ejemplo, muchos de los
códigos morales de hoy
incluyen

prohibiciones de comer
ciertos alimentos que
antaño solían ser
venenosos, pero que hoy
pueden prepararse de
forma segura. Muchos
prohíben el contacto
entre jóvenes

de distinto sexo, que en
efecto puede ser
peligroso; sin embargo,
esos códigos a menudo
han perdido el contexto
que explicaba el motivo
y se limitan a llamarlo
inmoral. En estos

tiempos, afirmar que se
trata de un precepto
moral necesario exigiría
un razonamiento nuevo.
Sostengo que la
tradición no basta.
Luego están las

Virtudes de Lord
British. Me parece que,
aunque un sistema de
virtudes es una
admirable referencia
para guiar a una
sociedad hacia la buena
conducta, tales virtudes
no son sino matices de
la

verdad subyacente que
explica por qué alguien
podría querer vivir
conforme a ciertas
reglas de conducta. Por
otra parte, las Virtudes
de las que he oído

hablar a Lord British
son claramente códigos
positivos de conducta,
mucho mejores que el
mundo de anarquía que
propone Lord Blackthorn.
Pero ¿no siguen
derivándose esas
Virtudes

de un conjunto de
principios que, aunque
suenan bien, son
difíciles de concretar
como verdades
racionales, reales e
indiscutibles? Peor aún
sería

imaginar una sociedad
cuyo código de conducta
se basara en la mera
supervivencia de los más
fuertes. Aunque esa
sociedad podría
funcionar e incluso
lograr mucho, puede

sostenerse con razón que
la felicidad personal
sufriría enormemente,
salvo para quienes
ocuparan la cima. Pero,
para descartar eso,
primero debemos creer
que las personas tienen

derecho a buscar la
felicidad. Espero que
sea seguro suponer que
todos los seres desean
ser felices; llamaré a
esto, de forma general,
Hedonismo. Pero, si todo
lo que hiciera la

gente fuera vivir una
vida de hedonismo, este
podría entrar en
conflicto con el de
quienes la rodean. Por
ello utilizaré el
término Ética para
describir los límites
que uno podría imponer

a sus tendencias
hedonistas para permitir
que los demás también
busquen su felicidad.
Permitidme este ejemplo:
si uno viviera solo en
una isla desierta,
podría

llevar una vida de
hedonismo puro, pues
ninguna acción suya
interferiría en el
derecho de otro a buscar
la felicidad. ¡Envenena
el lago si quieres: no
hay

nadie a quien culpar
salvo a ti mismo!
Supongamos ahora que dos
personas viven en esa
isla. No quieres que tu
vecino se crea libre de
envenenar el lago. ¿No
sería

mejor considerar poco
ético envenenarlo sin
pensar primero en
quienes podrían ver
afectada su búsqueda de
la felicidad por ese
acto?

  Sostengo que es el
hecho de que, como
pueblo, elegimos vivir
en grupos llamados
sociedades lo que nos
lleva a moderar nuestro
hedonismo puro con una
ética lógica.

Del mismo modo,
aceptamos no poder matar
a otros sin motivo,
porque nuestra propia
búsqueda de la felicidad
se vería seriamente
obstaculizada si
temiéramos

que los demás nos
hicieran lo mismo. De
esta base lógica pueden
nacer los Principios del
Hedonismo Ético. Para
saber más sobre este
tema, véase «Los
principios del hedonismo

ético», de Richard
Garriott y Herman
Miller."""
