title = "My Story"
author = "Sherry the Mouse"
content = """  'Twas on a chill
night, when the moon
shone pasty-faced
above the horizon,
balanced on the
towers of Lord
British's castle, that
the events I am about

to relate took place,
some years ago now. I
witnessed them all
from my tiny
mousehole.
  Milords British and
Blackthorn are
accustomed to a game

of chess 'pon an
evening, over which
they argue the issues
that affect the course
of the realm. Lord
Blackthorn was on his
way to Lord British's
chambers, and Lord

British stood by a
window casement,
just having finished
setting the pieces
upon the board.
  Suddenly the
shutters blew open,
and Lord British fell

to the ground, one
hand shielding his
eyes. A chill wind
entered the room, and
it seemed a gash was
torn in the very air.
Through the gash I
could see stars and

swirling clouds of
stellar dust, and a
coldness sucked all
the warmth from the
air. A terrible wind
tossed books and
blankets across the
room, and furniture

toppled.
  From within this
gash issued a great
voice, unlike any I
have ever heard. And
these are the words it
spoke (for I
memorized them most

carefully):
  \"Greetings, Lord
British. I am the
Time Lord, a being
from beyond your
dimension, as thou
art from a world
other than Sosaria. I

am here to bring thee
warning. Dost thou
recall how long ago a
mysterious Stranger
came to Sosaria and
saved the world from
the evil wizard
Mondain? He

shattered the Gem of
Immortality, within
which dwelled a
perfect likeness of
this world.\"
  Lord British slowly
stood and faced the
hole in the air. \"I

remember,\" he said.
\"Oft have I wished
that stranger would
return.\"
  \"He hath returned,\"
spoke the voice. \"But
not to here. When the
Gem was shattered, a

thousand shards were
scattered across the
dimensions, and in
each shard there is a
perfect likeness of
this world. And thou
dost live upon one
such shard, for thou

art not of the true
world-thou art
merely a reflection.\"
  Lord British looked
shaken by this, and I
did not know what to
think! Was I merely a
shadow of the real

me, which lives still
somewhere else
across uncounted
universes?
  \"My task is to heal
this shattered world,
Lord British,\" said
the voice. \"And I seek

to enlist thee in my
cause. Be warned that
in this case, healing
carries with it a
terrible price.\"
  Concern warred
with curiosity on my
liege's face, but ever

one to shoulder a
burden, he
straightened and
faced the gash in the
air bravely. \"Name
thy price.\"
  \"A shard of a
universe is a

powerful thing, and a
universe shattered is
always in danger
from the powers of
darkness. Already
three shards were
turned to evil, and
sent to plague the

original universe in
the form of
Shadowlords. Many
times have I brought
the Stranger back to
Britannia, to preserve
it from its own folly
or from outside

dangers. Yet as long
as the world
remaineth in pieces,
it remaineth
vulnerable. We must
bring the shards into
harmony, so that they
resonate in such a

manner that matches
the original universe.
Then the two
universes shall
merge, and be again
as one.\"
  \"But if we are only
shadows...\" Lord

British said
wonderingly.
  The light from the
stars within the hole
seemed to dim.
\"Indeed, the
reflections shall
become one with the

original. Thou wouldst
cease to be as thou
art, and become part
of the larger you.
Thou shalt not die;
however, uncounted
generations have
passed and borne

children since that
day, and they have no
counterparts. They
would perish utterly.\"
  Lord British sagged
in shock, realizing
the terrible price that
would be paid to heal

the universe. \"All of
my people,\" he
breathed.
  \"'Tis for the greater
good.\"
  Lord British bowed
his head.
  'Twas then I saw

the movement by the
door, half-hid by the
heavy red curtains.
Lord Blackthorn stood
there, concealed from
the rest of the room,
his face white. How
long had he been

listening? I cannot
say, yet I suspect
that he had heard all
that the mysterious
voice had to say.
  \"How then, shall I
aid thee?\" Lord
British said,

weariness in his
voice.
  \"Aid the nobilty that
resideth in the
human heart. Protect
the Virtues that so
recently came to thee
in thought late at

night. They are the
Virtues of life, as
your counterpart
understands them to
be. For when thy
populace doth live and
breathe these Virtues,
shall it match the

true Britannia, and
thy shard shall
rejoin with it.\"
  The gash in the air
began to close, and
with it warmth stole
back into the room.
  \"I was going to

discuss my idea with
Blackthorn tonight,\"
Lord British
breathed. \"Have I no
thoughts that are my
own? Is my life but
a reflection of
another me?\"

  \"Nay,\" said the
voice, smaller through
the diminished
opening. \"Say, rather,
that you are parallel,
for there is no
guarantee that thou
shalt accomplish what

I have set thee to. I
speak tonight to a
thousand of thee, and
ask the same of all.
Perhaps not all shall
seek to aid me.\" And
with that, the gash
closed, and the voice

was gone, leaving a
room that appeare
tossed by a mighty
storm.
  \"Destroy the world
to save the universe,\"
Lord British said
bitterly. \"I do not

wonder that some
may balk.\"
  Lord Blackthorn
collected himself, and
strode into the room,
a decent mimicry of
surprise on his face.
\"My liege! What has

happened here?\" he
exclaimed, feigning
dismay well. But not
well enough to fool
his old friend, whose
eyes narrowed at
seeing him there.
  \"How much didst

thou hear?\" demanded
Lord British.
  \"Why, nothing,\"
managed Blackthorn,
his head ducked away
from his friend, as
he bent to retrieve the
fallen chess pieces. \"I

merely came for our
game of chess.\"
  Together they
righted the pedestal
table, and set the
pieces upon the black
and white squares.
\"Such simplicity to

the game, Blackthorn,\"
mused Lord British,
idly brushing one
finger against the
board. \"Black and
white, each to its own
color, as if life were
so simple. What think

you?\"
  Blackthorn sat
heavily on a hassock
beside the chess table.
\"I think that matters
are never so simple,
my liege. And that I
would regret it deeply

if someone, such as a
friend, saw it thus.\"
  Lord British's eyes
met his. \"Yet
sometimes one must
sacrifice a pawn to
save a king.\"
  Lord Blackthorn met

his gaze squarely.
\"Even pawns have
lives and loves at
home, my lord.\" Then
he reached out for a
pawn, and firmly
moved it forward two
squares. \"Shall we

play a game?\" he
asked.
  The chess game that
night was a draw,
and they played
grimly.
  And the next day,
Lord British gathered

the nobles to proclaim
the idea of a new
system of Virtues,
and declared that
shrines should be
built across the land.
  Lord Blackthorn
opposed it bitterly,

and many thought
him strange for doing
so, for ever had he
been a noble and
upright man, and
ever had he and Lord
British been in
accord. Declaring that

he should start his
own shrine, he
departed the castle
that day to live in a
tower in a lake on the
north side of the
city.
  They are still the

best of friends, yet a
sadness hangs
between them, as if
they were forced into
making choices that
appealed not to them.
And at night, when I
creep softly from one

corner of my liege's
bedchamber to
another, I sometimes
see him take a pawn
from his night table,
and hold it in his
hand, and quietly
weep.

  But I am but a
mouse, and none hear
me. This tale goes
unknown, save for
my writing these
enormous letters with
mine ink-stained tiny
paws for thee to

read, for I fear
indeed for our world
and for our people in
these perilous times."""
item_template = "readable_scroll"

[translations.cze]
title = "Můj příběh"
content = """
Byla chladná noc, měsíc svítil bledou tváří nad obzorem, usazen na věžích hradu Lord British, když se před několika lety odehrály události, jež

hodlám vyprávět. Všechny jsem je viděl ze své maličké myší díry.
Pánové British a Blackthorn mají ve zvyku večer hrát

šachy a přitom se přít o otázky ovlivňující chod říše. Lord Blackthorn byl na cestě do komnat Lord British a Lord

British stál u okenního rámu, právě dokončiv rozmístění figurek na šachovnici.
Náhle se okenice rozletěly a Lord British padl

na zem, jednou rukou si chráně oči. Do pokoje vstoupil ledový vítr a zdálo se, že v samotném vzduchu vznikla trhlina. Skrze ni jsem viděl hvězdy a

vířící oblaka hvězdného prachu a chlad vysál ze vzduchu všechno teplo. Strašlivý vítr rozhazoval knihy a přikrývky po místnosti a nábytek

se převracel.
Z trhliny se ozval mohutný hlas, nepodobný žádnému, jaký jsem kdy slyšel. A toto jsou slova, která pronesl (neboť jsem si je

velmi pečlivě zapamatoval):
„Buď zdráv, Lord British. Jsem Time Lord, bytost zpoza tvé dimenze, tak jako ty pocházíš ze světa jiného než Sosaria. Já

přicházím, abych tě varoval. Pamatuješ, jak před dávnou dobou přišel do Sosaria tajemný Cizinec a zachránil svět před zlým čarodějem Mondain?

Roztříštil Drahokam nesmrtelnosti, v němž přebývala dokonalá podoba tohoto světa.“
Lord British pomalu vstal a pohlédl do otvoru ve vzduchu. „Já

si pamatuji,“ řekl. „Často jsem si přál, aby se ten cizinec vrátil.“
„Vrátil se,“ pravil hlas. „Ale ne sem. Když byl Drahokam roztříštěn,

tisíc střepů se rozptýlilo po dimenzích a v každém střepu je dokonalá podoba tohoto světa. A ty žiješ na jednom takovém střepu, neboť

nepatříš do pravého světa – jsi pouhý odraz.“
Lord British tím vypadal otřesen a já nevěděl, co si myslet! Byl jsem snad jen stínem skutečného

sebe sama, který stále žije kdesi jinde, napříč nesčetnými vesmíry?
„Mým úkolem je uzdravit tento roztříštěný svět, Lord British,“ pravil hlas. „A snažím se

získat tě pro svou věc. Věz, že v tomto případě s sebou uzdravení nese strašlivou cenu.“
V tváři mého lenního pána zápasila starost se zvědavostí, ale jelikož

vždy dokázal vzít břemeno na svá bedra, napřímil se a statečně pohlédl na trhlinu ve vzduchu. „Pověz svou cenu.“
„Střep vesmíru je

mocná věc a roztříštěný vesmír je vždy v nebezpečí před mocnostmi temnoty. Již tři střepy byly obráceny ke zlu a vyslány sužovat

původní vesmír v podobě Shadowlords. Mnohokrát jsem přivedl Cizince zpět do země Britannia, abych ji zachránil před její vlastní pošetilostí nebo před vnějšími

hrozbami. Dokud však svět zůstává v kusech, zůstává zranitelný. Musíme střepy uvést do souladu, aby rezonovaly způsobem,

který odpovídá původnímu vesmíru. Potom oba vesmíry splynou a budou znovu jedním.“
„Ale jestli jsme pouhé stíny...“ Lord

British pravil udiveně.
Světlo hvězd uvnitř otvoru jako by pohaslo. „Vskutku, odrazy splynou s

originálem. Přestal bys být tím, kým nyní jsi, a stal by ses součástí svého většího já. Nezemřeš; od toho dne však prošlo a zplodilo

děti nespočet generací a ty nemají své protějšky. Zahynuly by úplně.“
Lord British se otřeseně sesul, když si uvědomil strašlivou cenu, již by bylo třeba zaplatit za uzdravení

vesmíru. „Všechen můj lid,“ vydechl.
„Je to pro vyšší dobro.“
Lord British sklonil hlavu.
Tehdy jsem spatřil

pohyb u dveří, napůl zakrytých těžkými červenými závěsy. Stál tam Lord Blackthorn, skryt ostatním v místnosti, s bílou tváří. Jak dlouho

naslouchal? Nedovedu říci, ale domnívám se, že slyšel vše, co tajemný hlas pověděl.
„Jak ti tedy mohu pomoci?“ řekl Lord British

unaveným hlasem.
„Podporuj ušlechtilost přebývající v lidském srdci. Ochraňuj Ctnosti, které k tobě tak nedávno přišly v myšlenkách pozdě

v noci. Jsou to Ctnosti života, jak jim rozumí tvůj protějšek. Neboť až tvůj lid bude těmito Ctnostmi žít a dýchat, bude odpovídat

pravé zemi Britannia a tvůj střep se s ní znovu spojí.“
Trhlina ve vzduchu se začala zavírat a s tím se do místnosti vkrádalo teplo.
„Chtěl jsem

dnes večer o svém nápadu rozmlouvat s Blackthorn,“ vydechl Lord British. „Nemám žádné vlastní myšlenky? Je můj život jen odrazem jiného já?“

„Ne,“ pravil hlas, stále slabší ze zmenšujícího se otvoru. „Řekni spíše, že jste souběžní, neboť není zaručeno, že dokážeš,

co jsem ti uložil. Dnes v noci mluvím k tisíci tvým podobám a žádám všechny o totéž. Snad se ne všechny rozhodnou mi pomoci.“ A s tím se trhlina uzavřela a hlas

zmizel, zanechávaje místnost, jež vypadala, jako by jí prošla mohutná bouře.
„Zničit svět, aby se zachránil vesmír,“ řekl Lord British hořce. „Já se

nedivím, že někteří mohou zaváhat.“
Lord Blackthorn se vzpamatoval a vykročil do místnosti s celkem zdařilým předstíraným překvapením ve tváři. „Můj pane! Co se tu

stalo?“ zvolal a dobře předstíral zděšení. Ne však dost dobře, aby oklamal svého starého přítele, jehož oči se při pohledu na něj zúžily.
„Kolik jsi toho

slyšel?“ dožadoval se Lord British.
„Ale nic,“ vypravil ze sebe Blackthorn, skláněje hlavu od přítele, když se shýbal pro spadlé šachové figurky. „Já

přišel jen na naši partii šachů.“
Společně narovnali stolek na podstavci a rozmístili figurky na černá a bílá políčka. „Tak jednoduchá je tahle

hra, Blackthorn,“ přemítal Lord British, bezmyšlenkovitě přejížděje prstem po desce. „Černá a bílá, každá na své barvě, jako by život byl tak prostý. Co si

myslíš?“
Blackthorn ztěžka usedl na podušku vedle šachového stolku. „Myslím, že věci nikdy nejsou tak jednoduché, můj pane. A hluboce bych litoval,

kdyby to někdo, třeba přítel, takto viděl.“
Oči Lord British se setkaly s jeho. „Přesto je někdy třeba obětovat pěšce, aby byl zachráněn král.“
Lord Blackthorn opětoval

jeho pohled zpříma. „I pěšci mají doma své životy a své milované, můj pane.“ Potom vztáhl ruku k pěšci a pevně jej posunul o dvě políčka vpřed. „Zahrajeme si

partii?“ zeptal se.
Šachová partie té noci skončila remízou a hráli ji pochmurně.
A příštího dne Lord British shromáždil

šlechtice, aby vyhlásil myšlenku nové soustavy Ctností, a prohlásil, že po celé zemi mají být postaveny svatyně.
Lord Blackthorn se tomu hořce postavil,

a mnozí to u něj pokládali za podivné, neboť vždy býval ušlechtilým a čestným mužem a vždy býval s Lord British zajedno. Prohlásil,

že si založí vlastní svatyni, a toho dne opustil hrad, aby žil ve věži v jezeře na severní straně města.
Stále jsou

nejlepšími přáteli, ale visí mezi nimi smutek, jako by byli nuceni činit rozhodnutí, která jim nejsou milá. A v noci, když se tiše plížím z jednoho

koutu ložnice svého lenního pána do druhého, někdy ho vidím vzít z nočního stolku pěšce, držet ho v ruce a tiše plakat.

Já však jsem pouhá myš a nikdo mě neslyší. Tento příběh zůstává neznámý, vyjma toho, že píši tato ohromná písmena svými maličkými tlapkami potřísněnými inkoustem, abys je mohl

číst, neboť se v těchto nebezpečných časech vskutku obávám o náš svět a náš lid."""

[translations.fre]
title = "Mon histoire"
content = """
Ce fut par une nuit froide, alors que la lune au visage blafard brillait au-dessus de l’horizon, en équilibre sur les tours du château de Lord British, que les événements que je m’apprête

à raconter se produisirent, il y a maintenant quelques années. Je fus témoin de tout depuis mon minuscule trou de souris. Messeigneurs British et Blackthorn ont coutume de faire une partie

d’échecs le soir, pendant laquelle ils débattent des questions qui touchent à la marche du royaume. Lord Blackthorn se rendait dans les appartements de Lord British, et Lord

British se tenait près du battant d’une fenêtre, venant de finir de disposer les pièces sur l’échiquier. Soudain, les volets s’ouvrirent sous un souffle violent, et Lord British tomba

à terre, une main protégeant ses yeux. Un vent glacé entra dans la pièce, et il sembla qu’une déchirure s’ouvrait dans l’air même. À travers cette déchirure, je pouvais voir des étoiles et

des nuages tournoyants de poussière stellaire ; un froid aspirait toute chaleur de l’air. Un vent terrible projetait livres et couvertures à travers la pièce, et les meubles

se renversaient. De cette déchirure sortit une grande voix, différente de toutes celles que j’aie jamais entendues. Et voici les paroles qu’elle prononça (car je les appris très

soigneusement par cœur) : « Salutations, Lord British. Je suis le Seigneur du Temps, un être venu d’au-delà de votre dimension, comme vous venez d’un monde autre que Sosaria. Je

suis ici pour vous apporter un avertissement. Vous rappelez-vous comment, il y a longtemps, un mystérieux Étranger vint à Sosaria et sauva le monde du sorcier maléfique Mondain ? Il

brisa la Gemme d’Immortalité, au sein de laquelle demeurait une parfaite image de ce monde. » Lord British se releva lentement et fit face au trou dans l’air. « Je

m’en souviens, dit-il. Souvent j’ai souhaité que cet étranger revienne. » « Il est revenu, dit la voix. Mais pas ici. Lorsque la Gemme fut brisée, un

millier d’éclats furent dispersés à travers les dimensions, et dans chaque éclat existe une parfaite image de ce monde. Et vous vivez sur l’un de ces éclats, car vous

n’êtes point du véritable monde : vous n’êtes qu’un reflet. » Lord British en parut bouleversé, et je ne savais que penser ! N’étais-je que l’ombre de mon véritable

moi, qui vit encore quelque part ailleurs parmi d’innombrables univers ? « Ma tâche est de guérir ce monde brisé, Lord British, dit la voix. Et je cherche

à vous rallier à ma cause. Sachez qu’en ce cas, la guérison entraîne un prix terrible. » L’inquiétude le disputait à la curiosité sur le visage de mon suzerain, mais, toujours

prêt à prendre un fardeau sur ses épaules, il se redressa et fit bravement face à la déchirure dans l’air. « Dites votre prix. » « Un éclat d’univers est une

chose puissante, et un univers brisé est toujours menacé par les puissances des ténèbres. Déjà, trois éclats ont été tournés vers le mal et envoyés pour tourmenter

l’univers d’origine sous la forme des Seigneurs de l’Ombre. À maintes reprises j’ai ramené l’Étranger en Britannia, pour la préserver de sa propre folie ou des dangers

extérieurs. Pourtant, tant que le monde demeure en morceaux, il demeure vulnérable. Nous devons harmoniser les éclats, afin qu’ils résonnent d’une façon

qui corresponde à l’univers d’origine. Alors les deux univers fusionneront et ne feront de nouveau qu’un. » « Mais si nous ne sommes que des ombres... » dit Lord

British, songeur. La lumière des étoiles dans le trou parut s’atténuer. « En effet, les reflets ne feront qu’un avec

l’original. Vous cesserez d’être ce que vous êtes et deviendrez une part d’un vous plus grand. Vous ne mourrez point ; cependant, d’innombrables générations se sont succédé et ont engendré

des enfants depuis ce jour, et ceux-ci n’ont aucun équivalent. Ils périraient entièrement. » Lord British s’affaissa, sous le choc, comprenant le terrible prix à payer pour guérir

l’univers. « Tout mon peuple », souffla-t-il. « C’est pour le bien supérieur. » Lord British baissa la tête. Ce fut alors que je vis

un mouvement près de la porte, à moitié cachée par les lourds rideaux rouges. Lord Blackthorn se tenait là, dissimulé au reste de la pièce, le visage blanc. Depuis combien de temps

écoutait-il ? Je ne puis le dire, mais je soupçonne qu’il avait entendu tout ce que cette voix mystérieuse avait à dire. « Comment donc vous aiderai-je ? » dit Lord British,

la lassitude dans la voix. « Soutenez la noblesse qui réside dans le cœur humain. Protégez les Vertus qui vous sont venues en pensée si récemment, tard dans la

nuit. Ce sont les Vertus de la vie, telles que votre équivalent les comprend. Car lorsque votre population vivra et respirera ces Vertus, elle correspondra à la

véritable Britannia, et votre éclat la rejoindra. » La déchirure dans l’air commença à se refermer, et la chaleur revint peu à peu dans la pièce. « J’allais

discuter de mon idée avec Blackthorn ce soir, souffla Lord British. N’ai-je donc aucune pensée qui m’appartienne ? Ma vie n’est-elle que le reflet d’un autre moi ? »

« Non, dit la voix, plus faible à travers l’ouverture rétrécie. Dites plutôt que vous êtes parallèles, car rien ne garantit que vous accomplirez ce

que je vous ai demandé. Ce soir je parle à un millier d’entre vous, et je demande la même chose à tous. Peut-être tous ne chercheront-ils pas à m’aider. » Sur ce, la déchirure se referma et la voix

disparut, laissant une pièce qui semblait avoir été ravagée par une violente tempête. « Détruire le monde pour sauver l’univers, dit amèrement Lord British. Je ne

m’étonne pas que certains puissent reculer. » Lord Blackthorn se ressaisit et entra à grands pas dans la pièce, arborant une imitation convenable de surprise. « Mon suzerain ! Que s’est-il

passé ici ? » s’exclama-t-il, feignant bien le désarroi. Mais pas assez bien pour tromper son vieil ami, dont les yeux se plissèrent en le voyant là. « Qu’avez-vous

entendu ? » demanda Lord British. « Mais, rien », parvint à dire Blackthorn, détournant la tête de son ami tandis qu’il se penchait pour ramasser les pièces d’échecs tombées. « Je

venais simplement pour notre partie d’échecs. » Ensemble, ils redressèrent le guéridon et disposèrent les pièces sur les cases noires et blanches. « Quelle simplicité dans

ce jeu, Blackthorn, songea Lord British, effleurant distraitement l’échiquier d’un doigt. Noir et blanc, chacun sa couleur, comme si la vie était aussi simple. Qu’en

pensez-vous ? » Blackthorn s’assit lourdement sur un coussin près de la table d’échecs. « Je pense que les choses ne sont jamais aussi simples, mon suzerain. Et que je le regretterais profondément

si quelqu’un, par exemple un ami, les voyait ainsi. » Les yeux de Lord British rencontrèrent les siens. « Pourtant, il faut parfois sacrifier un pion pour sauver un roi. » Lord Blackthorn soutint

franchement son regard. « Même les pions ont une vie et des amours chez eux, mon seigneur. » Puis il tendit la main vers un pion et l’avança fermement de deux cases. « Faisons-nous

une partie ? » demanda-t-il. La partie d’échecs de cette nuit-là fut nulle, et ils jouèrent d’un air sombre. Et le lendemain, Lord British réunit

les nobles pour proclamer l’idée d’un nouveau système de Vertus et déclara que des sanctuaires devaient être bâtis à travers le pays. Lord Blackthorn s’y opposa vivement,

et beaucoup trouvèrent cette conduite étrange, car il avait toujours été un homme noble et droit, et lui et Lord British avaient toujours été d’accord. Déclarant qu’

il devait fonder son propre sanctuaire, il quitta le château ce jour-là pour vivre dans une tour au milieu d’un lac, au nord de la ville. Ils sont toujours les

meilleurs amis du monde, mais une tristesse demeure entre eux, comme s’ils avaient été forcés de faire des choix qui ne leur plaisaient pas. Et la nuit, lorsque je me glisse doucement d’un

coin à l’autre de la chambre de mon suzerain, il m’arrive de le voir prendre un pion sur sa table de nuit, le tenir dans sa main et pleurer en silence.

Mais je ne suis qu’une souris, et personne ne m’entend. Ce récit demeure inconnu, sauf par ces énormes lettres que j’écris avec mes petites pattes tachées d’encre pour que vous puissiez les

lire, car je crains vraiment pour notre monde et notre peuple en ces temps périlleux."""

[translations.ger]
title = "Meine Geschichte"
content = """
In einer kühlen Nacht, als der Mond mit teigbleichem Gesicht über dem Horizont schien, auf den Türmen von Lord Britishs Schloss balancierend, fanden die Ereignisse statt, die ich

nun erzählen werde, vor einigen Jahren inzwischen. Ich beobachtete sie alle aus meinem winzigen Mauseloch.
Die Herren British und Blackthorn pflegen am Abend eine Partie

Schach zu spielen, bei der sie die Fragen erörtern, die den Lauf des Reiches beeinflussen. Lord Blackthorn war auf dem Weg zu Lord Britishs Gemächern, und Lord

British stand an einem Fensterrahmen, nachdem er gerade die Figuren auf dem Brett aufgestellt hatte.
Plötzlich flogen die Fensterläden auf, und Lord British fiel

zu Boden, eine Hand schützend vor den Augen. Ein eisiger Wind drang ins Zimmer, und es schien, als würde ein Riss in die Luft selbst gerissen. Durch den Riss konnte ich Sterne und

wirbelnde Wolken von Sternenstaub sehen, und eine Kälte sog alle Wärme aus der Luft. Ein schrecklicher Wind schleuderte Bücher und Decken durch das Zimmer, und Möbel

kippten um.
Aus diesem Riss ertönte eine gewaltige Stimme, wie ich noch nie eine gehört hatte. Und dies sind die Worte, die sie sprach (denn ich prägte sie mir höchst

sorgfältig ein):
„Sei gegrüßt, Lord British. Ich bin der Herr der Zeit, ein Wesen jenseits deiner Dimension, so wie du aus einer anderen Welt als Sosaria stammst. Ich

bin hier, um dich zu warnen. Erinnerst du dich, wie vor langer Zeit ein geheimnisvoller Fremder nach Sosaria kam und die Welt vor dem bösen Zauberer Mondain rettete? Er

zerschmetterte den Edelstein der Unsterblichkeit, in dem ein vollkommenes Abbild dieser Welt wohnte.“
Lord British erhob sich langsam und wandte sich dem Loch in der Luft zu. „Ich

erinnere mich“, sagte er. „Oft habe ich mir gewünscht, dieser Fremde würde zurückkehren.“
„Er ist zurückgekehrt“, sprach die Stimme. „Doch nicht hierher. Als der Edelstein zerbrach, wurden

tausend Splitter über die Dimensionen verstreut, und in jedem Splitter befindet sich ein vollkommenes Abbild dieser Welt. Und du lebst auf einem solchen Splitter, denn du

gehörst nicht der wahren Welt an – du bist lediglich ein Spiegelbild.“
Lord British wirkte davon erschüttert, und ich wusste nicht, was ich denken sollte! War ich bloß ein Schatten meines wahren

Selbst, das noch immer irgendwo anders in ungezählten Universen lebt?
„Meine Aufgabe ist es, diese zersplitterte Welt zu heilen, Lord British“, sagte die Stimme. „Und ich suche

dich für meine Sache zu gewinnen. Sei gewarnt, dass Heilung in diesem Fall einen schrecklichen Preis mit sich bringt.“
Sorge rang mit Neugier auf dem Gesicht meines Lehnsherrn, doch war er stets

bereit, eine Last auf sich zu nehmen; er richtete sich auf und trat dem Riss in der Luft tapfer entgegen. „Nenne deinen Preis.“
„Ein Splitter eines Universums ist etwas

Mächtiges, und ein zerbrochenes Universum ist immer durch die Kräfte der Finsternis gefährdet. Schon wurden drei Splitter dem Bösen zugewandt und ausgeschickt, das

ursprüngliche Universum in Gestalt von Schattenfürsten zu plagen. Viele Male habe ich den Fremden nach Britannia zurückgebracht, um es vor seiner eigenen Torheit oder vor äußeren

Gefahren zu bewahren. Doch solange die Welt in Stücken bleibt, bleibt sie verwundbar. Wir müssen die Splitter in Einklang bringen, sodass sie auf eine Weise schwingen,

die dem ursprünglichen Universum entspricht. Dann werden die beiden Universen verschmelzen und wieder eins sein.“
„Aber wenn wir nur Schatten sind ...“, sagte Lord

British verwundert.
Das Licht der Sterne in dem Loch schien zu verblassen. „In der Tat werden die Spiegelbilder eins mit dem

Original werden. Du würdest aufhören, so zu sein, wie du bist, und Teil deines größeren Selbst werden. Du wirst nicht sterben; doch ungezählte Generationen sind vergangen und haben

seit jenem Tag Kinder geboren, und diese haben keine Gegenstücke. Sie würden gänzlich zugrunde gehen.“
Lord British sackte erschüttert zusammen, als er den schrecklichen Preis erkannte, der bezahlt werden müsste, um

das Universum zu heilen. „Mein ganzes Volk“, hauchte er.
„Es dient dem höheren Wohl.“
Lord British senkte den Kopf.
Da sah ich

die Bewegung an der Tür, halb verborgen von den schweren roten Vorhängen. Lord Blackthorn stand dort, vor dem übrigen Zimmer verborgen, sein Gesicht weiß. Wie lange hatte er

zugehört? Ich kann es nicht sagen, doch vermute ich, dass er alles gehört hatte, was die geheimnisvolle Stimme zu sagen hatte.
„Wie soll ich dir also helfen?“, sagte Lord British,

Müdigkeit in seiner Stimme.
„Fördere den Edelmut, der im menschlichen Herzen wohnt. Schütze die Tugenden, die dir erst kürzlich spät in der

Nacht in den Sinn kamen. Es sind die Tugenden des Lebens, wie dein Gegenstück sie versteht. Denn wenn dein Volk diese Tugenden lebt und atmet, wird es dem

wahren Britannia entsprechen, und dein Splitter wird sich wieder mit ihm vereinen.“
Der Riss in der Luft begann sich zu schließen, und mit ihm kehrte die Wärme ins Zimmer zurück.
„Ich wollte

meine Idee heute Abend mit Blackthorn besprechen“, hauchte Lord British. „Habe ich keine Gedanken, die mir selbst gehören? Ist mein Leben nur ein Spiegelbild eines anderen Selbst?“

„Nein“, sagte die Stimme, durch die kleinere Öffnung nun leiser. „Sage lieber, dass ihr parallel seid, denn es gibt keine Gewähr, dass du vollbringen wirst, was

ich dir aufgetragen habe. Ich spreche heute Abend zu tausend von euch und bitte alle um dasselbe. Vielleicht werden nicht alle versuchen, mir zu helfen.“ Und damit schloss sich der Riss, und die Stimme

war fort und ließ ein Zimmer zurück, das aussah, als habe ein mächtiger Sturm darin gewütet.
„Die Welt zerstören, um das Universum zu retten“, sagte Lord British bitter. „Es

wundert mich nicht, dass manche zurückschrecken könnten.“
Lord Blackthorn fasste sich und schritt ins Zimmer, eine brauchbare Nachahmung von Überraschung auf dem Gesicht. „Mein Lehnsherr! Was ist

hier geschehen?“, rief er und heuchelte geschickt Bestürzung. Doch nicht geschickt genug, um seinen alten Freund zu täuschen, dessen Augen sich bei seinem Anblick verengten.
„Wie viel hast

du gehört?“, verlangte Lord British zu wissen.
„Nun, nichts“, brachte Blackthorn hervor, den Kopf von seinem Freund abgewandt, als er sich bückte, um die gefallenen Schachfiguren aufzuheben. „Ich

kam nur für unsere Schachpartie.“
Gemeinsam richteten sie den Säulentisch auf und stellten die Figuren auf die schwarzen und weißen Felder. „Wie einfach dieses

Spiel doch ist, Blackthorn“, sinnierte Lord British und strich gedankenverloren mit einem Finger über das Brett. „Schwarz und weiß, jeder bei seiner eigenen Farbe, als wäre das Leben so einfach. Was meinst

du?“
Blackthorn ließ sich schwer auf einen Schemel neben dem Schachtisch sinken. „Ich glaube, die Dinge sind nie so einfach, mein Lehnsherr. Und ich würde es zutiefst bedauern,

wenn jemand, etwa ein Freund, es so sähe.“
Lord Britishs Augen begegneten den seinen. „Doch manchmal muss man einen Bauern opfern, um einen König zu retten.“
Lord Blackthorn erwiderte

seinen Blick fest. „Auch Bauern haben daheim ein Leben und Menschen, die sie lieben, mein Herr.“ Dann griff er nach einem Bauern und zog ihn entschieden zwei Felder vor. „Wollen wir

eine Partie spielen?“, fragte er.
Die Schachpartie jener Nacht endete unentschieden, und sie spielten verbissen.
Und am nächsten Tag versammelte Lord British

die Edelleute, um die Idee eines neuen Tugendsystems zu verkünden, und erklärte, im ganzen Land sollten Schreine gebaut werden.
Lord Blackthorn widersetzte sich erbittert,

und viele fanden sein Verhalten seltsam, denn er war stets ein edler und rechtschaffener Mann gewesen, und er und Lord British waren stets einer Meinung gewesen. Er erklärte,

er werde seinen eigenen Schrein errichten, und verließ an jenem Tag das Schloss, um in einem Turm in einem See auf der Nordseite der Stadt zu leben.
Noch immer sind sie die

besten Freunde, doch eine Traurigkeit liegt zwischen ihnen, als seien sie gezwungen worden, Entscheidungen zu treffen, die ihnen nicht zusagten. Und nachts, wenn ich leise von einer

Ecke des Schlafgemachs meines Lehnsherrn in eine andere husche, sehe ich manchmal, wie er einen Bauern vom Nachttisch nimmt, ihn in seiner Hand hält und leise weint.

Doch ich bin nur eine Maus, und niemand hört mich. Diese Geschichte bleibt unbekannt, außer dass ich diese gewaltigen Buchstaben mit meinen tintenbefleckten winzigen Pfoten schreibe, damit Ihr sie

lest, denn ich fürchte in diesen gefährlichen Zeiten wahrlich um unsere Welt und um unser Volk."""

[translations.ita]
title = "La mia storia"
content = """
Fu in una notte fredda, quando la luna splendeva dal volto pallido sopra l'orizzonte, in equilibrio sulle torri del castello di Lord British, che gli eventi che sto per

raccontare ebbero luogo, ormai alcuni anni fa. Li vidi tutti dal mio minuscolo buco di topo.
I miei signori British e Blackthorn sono soliti giocare una partita

a scacchi la sera, durante la quale discutono delle questioni che influiscono sul corso del regno. Lord Blackthorn si stava recando nelle stanze di Lord British, e Lord

British stava accanto a una finestra, avendo appena finito di disporre i pezzi sulla scacchiera.
D'un tratto le imposte si spalancarono e Lord British cadde

a terra, proteggendosi gli occhi con una mano. Un vento gelido entrò nella stanza e parve che uno squarcio si aprisse nell'aria stessa. Attraverso lo squarcio potevo vedere stelle e

nubi vorticanti di polvere stellare, e un gelo risucchiò tutto il calore dall'aria. Un vento terribile scagliò libri e coperte per la stanza, e i mobili

si rovesciarono.
Da quello squarcio uscì una voce possente, diversa da qualunque altra io abbia mai udito. E queste sono le parole che pronunciò (poiché le imparai a memoria con molta

cura):
«Salute, Lord British. Sono il Time Lord, un essere proveniente da oltre la vostra dimensione, così come tu provieni da un mondo diverso da Sosaria. Sono

qui per portarti un avvertimento. Ricordi come, molto tempo fa, un misterioso Straniero venne a Sosaria e salvò il mondo dal malvagio mago Mondain? Egli

frantumò la Gemma dell'Immortalità, dentro cui dimorava una perfetta immagine di questo mondo.»
Lord British si alzò lentamente e affrontò il buco nell'aria. «Lo

ricordo», disse. «Spesso ho desiderato che quello straniero tornasse.»
«È tornato», disse la voce. «Ma non qui. Quando la Gemma fu frantumata, un

migliaio di frammenti fu disperso fra le dimensioni, e in ogni frammento c'è una perfetta immagine di questo mondo. E tu vivi su uno di questi frammenti, poiché tu

non appartieni al vero mondo: sei soltanto un riflesso.»
Lord British ne parve scosso, e io non sapevo cosa pensare! Ero soltanto un'ombra del vero

me, che vive ancora da qualche altra parte, attraverso innumerevoli universi?
«Il mio compito è sanare questo mondo frantumato, Lord British», disse la voce. «E cerco

di arruolarti nella mia causa. Sappi che, in questo caso, la guarigione porta con sé un prezzo terribile.»
La preoccupazione lottava con la curiosità sul volto del mio sovrano, ma essendo sempre

pronto a farsi carico di un fardello, si raddrizzò e affrontò coraggiosamente lo squarcio nell'aria. «Dì il tuo prezzo.»
«Un frammento di un universo è una

cosa potente, e un universo frantumato è sempre in pericolo a causa delle potenze dell'oscurità. Già tre frammenti sono stati volti al male e inviati a tormentare l'

universo originario sotto forma di Signori dell'Ombra. Molte volte ho riportato lo Straniero a Britannia, per preservarla dalla propria follia o dai pericoli

esterni. Eppure, finché il mondo rimane in pezzi, rimane vulnerabile. Dobbiamo portare i frammenti in armonia, affinché risuonino in un

modo che corrisponda all'universo originario. Allora i due universi si fonderanno e saranno di nuovo uno.»
«Ma se siamo soltanto ombre...» Lord

British disse meravigliato.
La luce delle stelle dentro il buco parve affievolirsi. «Proprio così, i riflessi diverranno tutt'uno con l'

originale. Cesseresti di essere come sei e diverresti parte del te più grande. Non morirai; tuttavia, da quel giorno, innumerevoli generazioni sono trascorse e hanno generato

figli, e questi non hanno controparti. Perirebbero del tutto.»
Lord British si afflosciò per lo sgomento, comprendendo il terribile prezzo che sarebbe stato pagato per sanare

l'universo. «Tutta la mia gente», mormorò.
«È per il bene superiore.»
Lord British chinò la testa.
Fu allora che vidi

il movimento presso la porta, mezzo nascosto dalle pesanti tende rosse. Lord Blackthorn era lì, nascosto al resto della stanza, col viso bianco. Da quanto tempo stava

ascoltando? Non posso dirlo, eppure sospetto che avesse udito tutto ciò che la voce misteriosa aveva da dire.
«Come dovrò dunque aiutarti?» disse Lord British,

con stanchezza nella voce.
«Favorisci la nobiltà che risiede nel cuore umano. Proteggi le Virtù che così recentemente ti sono venute in mente a tarda

notte. Sono le Virtù della vita, così come le comprende la tua controparte. Poiché, quando il tuo popolo vivrà e respirerà queste Virtù, corrisponderà alla

vera Britannia, e il tuo frammento si ricongiungerà a essa.»
Lo squarcio nell'aria cominciò a chiudersi, e con esso il calore tornò furtivamente nella stanza.
«Stasera avrei

discusso la mia idea con Blackthorn», mormorò Lord British. «Non ho pensieri che siano miei? La mia vita è solo il riflesso di un altro me?»

«No», disse la voce, più piccola attraverso l'apertura ridotta. «Di' piuttosto che siete paralleli, poiché non vi è garanzia che tu compia ciò che

ti ho assegnato. Stanotte parlo a un migliaio di te e chiedo a tutti la stessa cosa. Forse non tutti cercheranno di aiutarmi.» E con ciò lo squarcio si chiuse e la voce

scomparve, lasciando una stanza che pareva sconvolta da una potente tempesta.
«Distruggere il mondo per salvare l'universo», disse Lord British amaramente. «Non mi

stupisce che alcuni possano esitare.»
Lord Blackthorn si ricompose ed entrò a grandi passi nella stanza, una discreta imitazione della sorpresa sul volto. «Mio sovrano! Che cosa è

successo qui?» esclamò, fingendo bene lo sgomento. Ma non abbastanza bene da ingannare il suo vecchio amico, i cui occhi si socchiusero vedendolo lì.
«Quanto

hai sentito?» pretese di sapere Lord British.
«Ma nulla», riuscì a dire Blackthorn, distogliendo il capo dall'amico mentre si chinava a raccogliere i pezzi degli scacchi caduti. «Sono

venuto solo per la nostra partita a scacchi.»
Insieme raddrizzarono il tavolino a piedistallo e disposero i pezzi sulle caselle bianche e nere. «Che semplicità in

questo gioco, Blackthorn», meditò Lord British, sfiorando distrattamente la scacchiera con un dito. «Bianco e nero, ciascuno nel proprio colore, come se la vita fosse così semplice. Che cosa ne

pensi?»
Blackthorn si sedette pesantemente su un cuscino accanto al tavolo degli scacchi. «Penso che le cose non siano mai così semplici, mio sovrano. E che mi dispiacerebbe profondamente

se qualcuno, per esempio un amico, le vedesse così.»
Gli occhi di Lord British incontrarono i suoi. «Eppure a volte si deve sacrificare un pedone per salvare un re.»
Lord Blackthorn ricambiò

francamente il suo sguardo. «Anche i pedoni hanno vite e amori a casa, mio signore.» Poi allungò la mano verso un pedone e lo avanzò con decisione di due caselle. «Giochiamo

una partita?» chiese.
La partita a scacchi quella sera terminò in patta, e giocarono cupamente.
E il giorno seguente Lord British riunì

i nobili per proclamare l'idea di un nuovo sistema di Virtù, e dichiarò che si sarebbero dovuti costruire santuari in tutto il paese.
Lord Blackthorn vi si oppose aspramente,

e molti lo giudicarono strano per questo, poiché era sempre stato un uomo nobile e retto, e lui e Lord British erano sempre stati d'accordo. Dichiarando che

avrebbe fondato il proprio santuario, lasciò il castello quel giorno per vivere in una torre in un lago nella parte settentrionale della città.
Sono ancora

ottimi amici, eppure una tristezza aleggia fra loro, come se fossero costretti a compiere scelte che non gradivano. E di notte, quando mi sposto furtivamente e piano da un

angolo della camera del mio sovrano a un altro, a volte lo vedo prendere un pedone dal comodino, tenerlo nella mano e piangere in silenzio.

Ma io sono solo un topo, e nessuno mi sente. Questo racconto resta ignoto, salvo per il fatto che scrivo queste enormi lettere con le mie minuscole zampe macchiate d'inchiostro affinché tu le

legga, poiché temo davvero per il nostro mondo e per la nostra gente in questi tempi pericolosi."""

[translations.pol]
title = "Moja opowieść"
content = """
Była chłodna noc. Księżyc świecił bladą twarzą nad horyzontem, zawieszony na wieżach zamku Lord British, gdy kilka lat temu wydarzyło się to, o czym zaraz

opowiem. Widziałem wszystko ze swej maleńkiej mysiej norki.
Moi panowie British i Blackthorn mają zwyczaj rozgrywać partię

szachów wieczorem i przy niej spierać się o sprawy wpływające na losy królestwa. Lord Blackthorn zmierzał do komnat Lord British, a Lord

British stał przy oknie, właśnie skończywszy ustawiać figury na szachownicy.
Nagle okiennice rozwarły się od podmuchu, a Lord British upadł

na ziemię, osłaniając oczy ręką. Do pokoju wtargnął zimny wiatr i jakby w samym powietrzu powstała rozcięta rana. Przez nią widziałem gwiazdy i

wirujące chmury gwiezdnego pyłu, a chłód wysysał z powietrza całe ciepło. Straszliwy wiatr miotał książkami i kocami po pokoju, a meble

się przewracały.
Z wnętrza tej rany rozległ się potężny głos, niepodobny do żadnego, jaki kiedykolwiek słyszałem. Oto słowa, które wypowiedział (gdyż zapamiętałem je nader

starannie):
„Witaj, Lord British. Jestem Time Lord, istotą spoza twego wymiaru, tak jak ty pochodzisz ze świata innego niż Sosaria. Jestem

tu, by przynieść ci ostrzeżenie. Czy pamiętasz, jak dawno temu tajemniczy Nieznajomy przybył do Sosaria i ocalił świat przed złym czarodziejem Mondain? On

roztrzaskał Klejnot Nieśmiertelności, w którym mieszkało doskonałe podobieństwo tego świata”.
Lord British powoli wstał i zwrócił się ku dziurze w powietrzu. „Ja

pamiętam” — powiedział. „Często pragnąłem powrotu tego nieznajomego”.
„Powrócił” — rzekł głos. „Lecz nie tutaj. Gdy Klejnot rozbito,

tysiąc odłamków rozproszyło się po wymiarach, a w każdym jest doskonałe podobieństwo tego świata. I ty żyjesz na jednym takim odłamku, gdyż

nie należysz do prawdziwego świata — jesteś jedynie odbiciem”.
Lord British wydawał się tym wstrząśnięty, a ja nie wiedziałem, co myśleć! Czy byłem tylko cieniem prawdziwego

siebie, który nadal żyje gdzieś indziej, pośród niezliczonych wszechświatów?
„Moim zadaniem jest uzdrowienie tego rozbitego świata, Lord British” — powiedział głos. „I pragnę

pozyskać cię dla mej sprawy. Wiedz jednak, że w tym przypadku uzdrowienie niesie straszliwą cenę”.
Na twarzy mego seniora troska ścierała się z ciekawością, lecz zawsze

gotów wziąć ciężar na barki, wyprostował się i odważnie stanął naprzeciw rany w powietrzu. „Podaj swą cenę”.
„Odłamek wszechświata jest

potężną rzeczą, a rozbity wszechświat zawsze zagrożony jest przez moce ciemności. Już trzy odłamki obrócono ku złu i zesłano, by nękały

pierwotny wszechświat w postaci Shadowlords. Wiele razy sprowadzałem Nieznajomego z powrotem do Britannia, aby chronił ją przed jej własną głupotą albo zewnętrznymi

niebezpieczeństwami. Lecz dopóki świat pozostaje w kawałkach, jest podatny na zranienie. Musimy zestroić odłamki, aby rezonowały w

sposób odpowiadający pierwotnemu wszechświatowi. Wtedy oba wszechświaty połączą się i znów będą jednym”.
„Lecz jeśli jesteśmy tylko cieniami...” — Lord

British odezwał się z niedowierzaniem.
Światło gwiazd w otworze jakby przygasło. „Istotnie, odbicia staną się jednym z

oryginałem. Przestaniesz istnieć w obecnej postaci i staniesz się częścią większego siebie. Nie umrzesz; jednak od owego dnia minęły niezliczone pokolenia, które wydały na świat

dzieci, a te nie mają odpowiedników. One zginęłyby całkowicie”.
Lord British ugiął się ze wstrząsu, pojmując straszliwą cenę za uzdrowienie

wszechświata. „Cały mój lud” — wyszeptał.
„To dla większego dobra”.
Lord British pochylił głowę.
Wtedy ujrzałem

ruch przy drzwiach, na wpół ukrytych ciężkimi czerwonymi zasłonami. Stał tam Lord Blackthorn, niewidoczny z reszty pokoju, z pobielałą twarzą. Jak długo

słuchał? Nie potrafię powiedzieć, lecz podejrzewam, że usłyszał wszystko, co tajemniczy głos miał do powiedzenia.
„Jak więc mam ci pomóc?” — spytał Lord British,

ze znużeniem w głosie.
„Wspomagaj szlachetność tkwiącą w ludzkim sercu. Chroń Cnoty, które tak niedawno przyszły ci na myśl późną

nocą. To Cnoty życia, tak jak pojmuje je twój odpowiednik. Gdy twój lud będzie żył i oddychał tymi Cnotami, upodobni się do

prawdziwej Britannia, a twój odłamek znów się z nią połączy”.
Rana w powietrzu zaczęła się zamykać, a wraz z tym do pokoju powracało ciepło.
„Zamierzałem

omówić dziś wieczorem mój pomysł z Blackthorn” — wyszeptał Lord British. „Czy nie mam żadnych własnych myśli? Czy moje życie jest jedynie odbiciem innego mnie?”

„Nie” — powiedział głos, cichszy przez malejący otwór. „Powiedz raczej, że jesteście równolegli, gdyż nie ma gwarancji, że wypełnisz to,

co ci wyznaczyłem. Mówię tej nocy do tysiąca ciebie i wszystkich proszę o to samo. Być może nie wszyscy zechcą mi pomóc”. I wtedy rana się zamknęła, a głos

zniknął, pozostawiając pokój, który wyglądał na spustoszony przez potężną burzę.
„Zniszczyć świat, by ocalić wszechświat” — powiedział gorzko Lord British. „Nie

dziwię się, że niektórzy mogą się wzdragać”.
Lord Blackthorn opanował się i wkroczył do pokoju, z całkiem dobrym pozorem zdziwienia na twarzy. „Mój seniorze! Co się tu

stało?” — zawołał, dobrze udając przerażenie. Lecz nie dość dobrze, by oszukać starego przyjaciela, którego oczy zwęziły się na jego widok.
„Ile

usłyszałeś?” — zażądał Lord British.
„Jak to, nic” — wykrztusił Blackthorn, odwracając głowę od przyjaciela, gdy pochylił się po przewrócone figury szachowe. „Ja

przyszedłem tylko na naszą partię”.
Razem postawili stolik na nodze i ustawili figury na czarnych i białych polach. „Jaka prostota

tej gry, Blackthorn” — zadumał się Lord British, przesuwając leniwie palcem po szachownicy. „Czerń i biel, każde przy swoim kolorze, jakby życie było tak proste. Co

myślisz?”
Blackthorn ciężko opadł na poduszkę przy stoliku szachowym. „Sądzę, że sprawy nigdy nie są tak proste, mój seniorze. I głęboko bym żałował,

gdyby ktoś, na przykład przyjaciel, tak je postrzegał”.
Oczy Lord British spotkały jego spojrzenie. „Lecz czasem trzeba poświęcić pionka, by ocalić króla”.
Lord Blackthorn odwzajemnił

spojrzenie bez wahania. „Nawet pionki mają w domu życie i ukochanych, mój panie”. Potem sięgnął po pionka i zdecydowanie przesunął go o dwa pola. „Czy

zagramy partię?” — spytał.
Tamtej nocy partia szachów zakończyła się remisem; grali ponuro.
Nazajutrz Lord British zgromadził

szlachtę, aby ogłosić pomysł nowego systemu Cnót, i oznajmił, że w całej krainie należy wybudować kaplice.
Lord Blackthorn gorzko się sprzeciwił,

a wielu uważało go przez to za dziwaka, gdyż zawsze był człowiekiem szlachetnym i prawym, i zawsze zgadzał się z Lord British. Oznajmiwszy, że

powinien założyć własną kaplicę, opuścił tego dnia zamek, by zamieszkać w wieży na jeziorze po północnej stronie miasta.
Nadal są

najlepszymi przyjaciółmi, lecz wisi między nimi smutek, jakby zmuszono ich do wyborów, których nie pragnęli. A nocą, gdy cicho przemykam z jednego

kąta sypialni mego seniora do drugiego, czasem widzę, jak bierze pionka z nocnego stolika, trzyma go w dłoni i cicho płacze.

Lecz jestem tylko myszą i nikt mnie nie słyszy. Ta opowieść pozostaje nieznana, poza tym, że piszę dla was te ogromne litery swymi maleńkimi łapkami poplamionymi atramentem, byście mogli

je przeczytać, gdyż w tych niebezpiecznych czasach naprawdę boję się o nasz świat i nasz lud."""

[translations.por]
title = "Minha história"
content = """
Foi numa noite fria, quando a lua brilhava com seu rosto pálido acima do horizonte, equilibrada nas torres do castelo de Lord British, que os acontecimentos que estou prestes a

relatar se passaram, há alguns anos. Testemunhei tudo de minha minúscula toca de rato.
Meus senhores British e Blackthorn costumam jogar uma partida

de xadrez à noite, durante a qual debatem as questões que afetam os rumos do reino. Lord Blackthorn estava a caminho dos aposentos de Lord British, e Lord

British estava junto a uma janela, tendo acabado de colocar as peças sobre o tabuleiro.
De repente, as venezianas se abriram com uma rajada, e Lord British caiu

no chão, protegendo os olhos com uma das mãos. Um vento gelado entrou no quarto, e pareceu que um rasgo fora aberto no próprio ar. Pelo rasgo eu podia ver estrelas e

nuvens rodopiantes de poeira estelar, e uma friagem sugou todo o calor do ar. Um vento terrível lançou livros e cobertores pelo quarto, e os móveis

tombaram.
De dentro desse rasgo veio uma voz poderosa, diferente de qualquer outra que eu já ouvira. E estas são as palavras que disse (pois as memorizei com o maior

cuidado):
\"Saudações, Lord British. Sou o Senhor do Tempo, um ser de além de sua dimensão, assim como você vem de um mundo que não é Sosaria. Eu

estou aqui para trazer um aviso. Você se lembra de como, há muito tempo, um misterioso Estranho veio a Sosaria e salvou o mundo do feiticeiro maligno Mondain? Ele

estilhaçou a Gema da Imortalidade, dentro da qual habitava uma cópia perfeita deste mundo.\"
Lord British se levantou lentamente e encarou o buraco no ar. \"Eu

me lembro\", disse ele. \"Muitas vezes desejei que aquele estranho voltasse.\"
\"Ele voltou\", disse a voz. \"Mas não para cá. Quando a Gema foi estilhaçada, mil

fragmentos se espalharam pelas dimensões, e em cada fragmento há uma cópia perfeita deste mundo. E você vive sobre um desses fragmentos, pois você

não pertence ao mundo verdadeiro: você é apenas um reflexo.\"
Lord British pareceu abalado por isso, e eu não sabia o que pensar! Eu seria apenas uma sombra de meu verdadeiro

eu, que ainda vive em algum outro lugar, além de incontáveis universos?
\"Minha tarefa é curar este mundo estilhaçado, Lord British\", disse a voz. \"E busco

recrutar você para minha causa. Saiba que, neste caso, a cura traz consigo um preço terrível.\"
A preocupação lutava com a curiosidade no rosto de meu soberano, mas, sempre

disposto a assumir um fardo, ele se endireitou e encarou corajosamente o rasgo no ar. \"Diga seu preço.\"
\"Um fragmento de um universo é algo

poderoso, e um universo estilhaçado está sempre em perigo diante dos poderes das trevas. Três fragmentos já foram convertidos ao mal e enviados para atormentar o

universo original na forma de Senhores das Sombras. Muitas vezes trouxe o Estranho de volta a Britannia, para preservá-la de sua própria insensatez ou de perigos

externos. Contudo, enquanto o mundo permanecer em pedaços, continuará vulnerável. Precisamos colocar os fragmentos em harmonia, para que ressoem de uma

maneira que corresponda ao universo original. Então os dois universos se fundirão e serão novamente um só.\"
\"Mas, se somos apenas sombras...\", disse Lord

British, admirado.
A luz das estrelas dentro do buraco pareceu enfraquecer. \"De fato, os reflexos se tornarão um só com o

original. Você deixaria de ser como é e se tornaria parte de seu eu maior. Você não morrerá; porém, incontáveis gerações se passaram e tiveram

filhos desde aquele dia, e eles não têm equivalentes. Pereceriam por completo.\"
Lord British se curvou em choque, percebendo o preço terrível que seria pago para curar

o universo. \"Todo o meu povo\", sussurrou.
\"É pelo bem maior.\"
Lord British abaixou a cabeça.
Foi então que vi

o movimento junto à porta, meio escondido pelas pesadas cortinas vermelhas. Lord Blackthorn estava ali, oculto do restante do quarto, com o rosto branco. Há quanto tempo vinha

ouvindo? Não posso dizer, mas suspeito que ouviu tudo o que a voz misteriosa tinha a dizer.
\"Como, então, devo ajudá-lo?\", disse Lord British,

com cansaço na voz.
\"Ajude a nobreza que reside no coração humano. Proteja as Virtudes que tão recentemente lhe vieram à mente, tarde da

noite. Elas são as Virtudes da vida, conforme seu equivalente as entende. Pois, quando sua população viver e respirar essas Virtudes, corresponderá à

verdadeira Britannia, e seu fragmento se reunirá a ela.\"
O rasgo no ar começou a se fechar e, com isso, o calor voltou sorrateiro ao quarto.
\"Eu ia

discutir minha ideia com Blackthorn esta noite\", murmurou Lord British. \"Não tenho nenhum pensamento que seja meu? Minha vida é apenas um reflexo de outro eu?\"

\"Não\", disse a voz, mais fraca através da abertura reduzida. \"Diga, antes, que vocês são paralelos, pois não há garantia de que você realizará o que

lhe pedi. Esta noite falo com mil versões de você e peço o mesmo a todas. Talvez nem todas procurem me ajudar.\" E, com isso, o rasgo se fechou e a voz

desapareceu, deixando um quarto que parecia revirado por uma poderosa tempestade.
\"Destruir o mundo para salvar o universo\", disse Lord British com amargura. \"Não

me surpreende que alguns possam hesitar.\"
Lord Blackthorn se recompôs e entrou a passos largos no quarto, com uma imitação razoável de surpresa no rosto. \"Meu soberano! O que

aconteceu aqui?\", exclamou, fingindo consternação com habilidade. Mas não com habilidade suficiente para enganar seu velho amigo, cujos olhos se estreitaram ao vê-lo ali.
\"Quanto você

ouviu?\", exigiu Lord British.
\"Ora, nada\", conseguiu dizer Blackthorn, virando a cabeça para longe do amigo enquanto se curvava para recolher as peças de xadrez caídas. \"Eu

apenas vim para nossa partida de xadrez.\"
Juntos, colocaram de pé a mesa de pedestal e puseram as peças sobre os quadrados pretos e brancos. \"Que simplicidade tem

o jogo, Blackthorn\", refletiu Lord British, passando distraidamente um dedo pelo tabuleiro. \"Preto e branco, cada um com sua cor, como se a vida fosse tão simples. O que você

acha?\"
Blackthorn se sentou pesadamente num pufe ao lado da mesa de xadrez. \"Acho que as coisas nunca são tão simples, meu soberano. E que lamentaria profundamente

se alguém, como um amigo, as visse assim.\"
Os olhos de Lord British encontraram os seus. \"Mas às vezes é preciso sacrificar um peão para salvar um rei.\"
Lord Blackthorn enfrentou

seu olhar diretamente. \"Até os peões têm vidas e amores em casa, meu senhor.\" Então estendeu a mão para um peão e o moveu firmemente duas casas à frente. \"Vamos

jogar uma partida?\", perguntou.
A partida de xadrez daquela noite terminou empatada, e eles jogaram com gravidade.
E, no dia seguinte, Lord British reuniu

os nobres para proclamar a ideia de um novo sistema de Virtudes e declarou que santuários deveriam ser construídos por toda a terra.
Lord Blackthorn se opôs amargamente,

e muitos o acharam estranho por isso, pois sempre fora um homem nobre e íntegro, e ele e Lord British sempre estiveram de acordo. Declarando que

criaria seu próprio santuário, deixou o castelo naquele dia para viver numa torre em um lago no lado norte da cidade.
Eles ainda são os

melhores amigos, mas uma tristeza paira entre ambos, como se fossem obrigados a fazer escolhas que não lhes agradavam. E à noite, quando saio silenciosamente de um

canto do quarto de meu soberano para outro, às vezes o vejo pegar um peão da mesa de cabeceira, segurá-lo na mão e chorar baixinho.

Mas sou apenas uma ratinha, e ninguém me ouve. Esta história permanece desconhecida, exceto por eu escrever estas enormes letras com minhas patinhas manchadas de tinta para você

ler, pois realmente temo por nosso mundo e por nosso povo nestes tempos perigosos."""

[translations.spa]
title = "Mi historia"
content = """
Fue en una noche fría, cuando la luna brillaba pálida sobre el horizonte, posada sobre las torres del castillo de Lord British, cuando ocurrieron los sucesos que voy

a relatar, hace ya algunos años. Los presencié todos desde mi pequeña ratonera. Mis señores British y Blackthorn acostumbran a jugar una partida

de ajedrez por la noche, durante la cual debaten las cuestiones que afectan al rumbo del reino. Lord Blackthorn se dirigía a los aposentos de Lord British, y Lord

British estaba junto al marco de una ventana, recién terminada la colocación de las piezas sobre el tablero. De pronto las contraventanas se abrieron de golpe y Lord British cayó

al suelo, cubriéndose los ojos con una mano. Un viento helado entró en la habitación y pareció abrirse una brecha en el propio aire. A través de ella podía ver estrellas y

nubes arremolinadas de polvo estelar, y un frío absorbió todo el calor del aire. Un viento terrible arrojó libros y mantas por la habitación, y los muebles

volcaron. De aquella brecha surgió una gran voz, distinta de cualquiera que hubiera oído. Y estas son las palabras que pronunció, pues las memoricé con sumo

cuidado: «Saludos, Lord British. Soy Time Lord, un ser de más allá de vuestra dimensión, como vos procedéis de un mundo distinto de Sosaria. Estoy

aquí para traeros una advertencia. ¿Recordáis cómo, hace mucho tiempo, un misterioso Forastero vino a Sosaria y salvó el mundo del malvado hechicero Mondain? Él

hizo añicos la Gema de la Inmortalidad, dentro de la cual habitaba una imagen perfecta de este mundo». Lord British se levantó lentamente y se volvió hacia el agujero en el aire. «Lo

recuerdo», dijo. «A menudo he deseado que aquel forastero regresara». «Ha regresado», dijo la voz. «Pero no aquí. Cuando la Gema se rompió, mil

fragmentos se dispersaron por las dimensiones, y en cada fragmento hay una imagen perfecta de este mundo. Y vos vivís en uno de esos fragmentos, pues no

pertenecéis al mundo verdadero: sois tan solo un reflejo». Lord British pareció conmocionado, ¡y yo no sabía qué pensar! ¿Era yo solo la sombra de mi verdadero

yo, que aún vive en algún otro lugar entre incontables universos? «Mi tarea es sanar este mundo roto, Lord British», dijo la voz. «Y busco

reclutaros para mi causa. Os advierto que, en este caso, sanar conlleva un precio terrible». La preocupación luchó con la curiosidad en el rostro de mi señor, pero, siempre

dispuesto a asumir una carga, se irguió y miró valerosamente la brecha del aire. «Decid vuestro precio». «Un fragmento de un universo es algo

poderoso, y un universo hecho añicos siempre corre peligro ante los poderes de la oscuridad. Ya tres fragmentos fueron corrompidos y enviados a atormentar al

universo original en forma de Shadowlords. Muchas veces he traído al Forastero de vuelta a Britannia para preservarla de su propia insensatez o de peligros

externos. Sin embargo, mientras el mundo permanezca dividido, seguirá siendo vulnerable. Debemos armonizar los fragmentos para que resuenen de una

manera que concuerde con el universo original. Entonces los dos universos se fusionarán y volverán a ser uno». «Pero si solo somos sombras...», dijo Lord

British, asombrado. La luz de las estrellas dentro del agujero pareció atenuarse. «En efecto, los reflejos se unirán con el

original. Dejaríais de ser como sois y pasaríais a formar parte de vuestro yo mayor. No moriréis; sin embargo, desde aquel día han pasado incontables generaciones y han tenido

hijos que no tienen equivalentes. Perecerían por completo». Lord British se desplomó de espanto, al comprender el precio terrible que habría que pagar para sanar

el universo. «Todo mi pueblo», susurró. «Es por el bien mayor». Lord British inclinó la cabeza. Fue entonces cuando vi

movimiento junto a la puerta, medio oculto por las pesadas cortinas rojas. Lord Blackthorn estaba allí, escondido del resto de la habitación, con el rostro blanco. ¿Cuánto tiempo llevaba

escuchando? No sabría decirlo, pero sospecho que había oído todo cuanto aquella voz misteriosa tenía que decir. «¿Cómo debo ayudaros, entonces?», preguntó Lord British,

con cansancio en la voz. «Ayudad a la nobleza que reside en el corazón humano. Proteged las Virtudes que hace tan poco acudieron a vuestro pensamiento a altas horas de la

noche. Son las Virtudes de la vida, tal como las entiende vuestro equivalente. Porque cuando vuestro pueblo viva y respire esas Virtudes, concordará con la

verdadera Britannia, y vuestro fragmento volverá a unirse a ella». La brecha en el aire empezó a cerrarse, y con ello el calor regresó furtivamente a la habitación. «Iba a

comentar mi idea con Blackthorn esta noche», susurró Lord British. «¿No tengo ningún pensamiento propio? ¿Es mi vida solo un reflejo de otro yo?»

«No», dijo la voz, más débil a través de la abertura menguante. «Decid, más bien, que sois paralelos, pues no hay garantía de que logréis lo que

os he encomendado. Esta noche hablo con mil versiones de vos y pido lo mismo a todas. Quizá no todas quieran ayudarme». Y entonces la brecha se cerró y la voz

desapareció, dejando una habitación que parecía sacudida por una poderosa tormenta. «Destruir el mundo para salvar el universo», dijo Lord British con amargura. «No me

extraña que algunos vacilen». Lord Blackthorn se recompuso y entró a grandes pasos, con una aceptable imitación de sorpresa en el rostro. «¡Mi señor! ¿Qué ha

ocurrido aquí?», exclamó, fingiendo bien el espanto. Pero no lo bastante bien como para engañar a su viejo amigo, que entrecerró los ojos al verlo allí. «¿Cuánto

habéis oído?», exigió Lord British. «Pues nada», logró decir Blackthorn, apartando la cabeza de su amigo mientras se agachaba a recoger las piezas caídas. «Solo

venía a jugar nuestra partida de ajedrez». Juntos enderezaron la mesa de pedestal y colocaron las piezas sobre los cuadros blancos y negros. «Qué sencillez tiene

el juego, Blackthorn», meditó Lord British, rozando distraídamente el tablero con un dedo. «Blanco y negro, cada uno con su color, como si la vida fuera tan simple. ¿Qué

opináis?» Blackthorn se dejó caer pesadamente en un cojín junto a la mesa de ajedrez. «Creo que las cosas nunca son tan simples, mi señor. Y que lamentaría profundamente

que alguien, por ejemplo un amigo, las viera así». Los ojos de Lord British se encontraron con los suyos. «Pero a veces hay que sacrificar un peón para salvar a un rey». Lord Blackthorn sostuvo

su mirada de frente. «Incluso los peones tienen vidas y amores en casa, mi señor». Entonces tomó un peón y lo adelantó con firmeza dos cuadros. «¿Jugamos

una partida?», preguntó. Aquella noche la partida de ajedrez terminó en tablas, y jugaron con sombría determinación. Al día siguiente, Lord British reunió

a los nobles para proclamar la idea de un nuevo sistema de Virtudes y declaró que debían construirse santuarios por toda la tierra. Lord Blackthorn se opuso con amargura,

y muchos lo consideraron extraño por ello, pues siempre había sido un hombre noble y recto, y siempre él y Lord British habían estado de acuerdo. Declarando que

fundaría su propio santuario, dejó el castillo aquel día para vivir en una torre en un lago al norte de la ciudad. Siguen siendo los

mejores amigos, pero una tristeza se interpone entre ellos, como si se vieran obligados a tomar decisiones que no les agradan. Y por la noche, cuando me deslizo suavemente de un

rincón a otro de los aposentos de mi señor, a veces lo veo tomar un peón de la mesilla, sostenerlo en la mano y llorar en silencio.

Pero yo solo soy un ratón y nadie me escucha. Esta historia sigue siendo desconocida, salvo por estas enormes letras que escribo con mis diminutas patas manchadas de tinta para que las

leáis, pues temo de verdad por nuestro mundo y por nuestro pueblo en estos tiempos peligrosos."""
