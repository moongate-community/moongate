title = "Lysander's Notebook"
author = "L. Gathenwale"
content = """Day Three - Day Six:

What are these Beasts
that dare to defy our
presence here?  Hast
Thou sent them,
Master?  To tear
apart these foolish

ones that accompany
me?  That repugnant
pustule, Drummel, put
forth his absurd little
theories as to the
nature of the Beasts
that attacked our
camp, but I'll have

none of his words.  He
asks too many
questions.  He is a
taint upon the grounds
of Thy Sanctum,
Master - I will deal
with him after the
Sewel woman.

Speaking of Sewel, I
have convinced that
empty-headed harlot
that we should move
our encampment
within the
antechamber.  She
thinks I worry for

her safety.  I come
for thee, Master.  I
make my camp in Thy
chambers.  I sleep
under Thy roof.  I can
feel Thine presence
even now.  Soon,
Master.  Soon."""
item_template = "readable_scroll"

[translations.cze]
title = "Lysanderův zápisník"
content = """
Den třetí až šestý:

Co jsou zač ty bestie,
které se odvažují
vzdorovat naší
přítomnosti zde? Poslal
jsi je Ty, Mistře? Aby
roztrhaly ty bláhové

lidi, kteří mě
doprovázejí? Ten
odporný vřed Drummel
předkládal své směšné
teorijky o povaze
bestií, které napadly
náš tábor, ale nestrpím

jeho řeči. Klade příliš
mnoho otázek. Je
poskvrnou na půdě Tvé
svatyně, Mistře –
vypořádám se s ním po
té ženské Sewel.

Když už mluvím o Sewel,
přesvědčil jsem tu
hloupou nevěstku, že
bychom měli přestěhovat
tábor do předsíně.
Myslí si, že se obávám
o

její bezpečí. Přicházím
pro Tebe, Mistře.
Rozbíjím svůj tábor ve
Tvých komnatách. Spím
pod Tvou střechou.
Cítím Tvou přítomnost
už teď. Brzy, Mistře.
Brzy."""

[translations.fre]
title = "Le carnet de Lysander"
content = """
Du troisième au sixième
jour :

Que sont ces Bêtes qui
osent défier notre
présence ici ? Les
as-Tu envoyées, Maître
? Pour déchiqueter ces
imbéciles

qui m’accompagnent ?
Cette pustule
répugnante, Drummel, a
proposé ses absurdes
petites théories sur la
nature des Bêtes qui
ont attaqué notre camp,
mais je ne veux

rien entendre de ses
paroles. Il pose trop
de questions. Il
souille le sol de Ton
Sanctuaire, Maître ; je
m’occuperai de lui
après la femme Sewel.

À propos de Sewel, j’ai
convaincu cette catin
sans cervelle que nous
devions déplacer notre
campement dans
l’antichambre. Elle
croit que je m’inquiète
pour

sa sécurité. Je viens à
Toi, Maître. J’établis
mon camp dans Tes
salles. Je dors sous
Ton toit. Je peux
sentir Ta présence dès
maintenant. Bientôt,
Maître. Bientôt."""

[translations.ger]
title = "Lysanders Notizbuch"
content = """
Dritter bis sechster
Tag:

Was sind dies für
Bestien, die es wagen,
unserer Anwesenheit
hier zu trotzen? Hast
Du sie geschickt,
Meister? Um jene Narren
zu zerreißen,

die mich begleiten?
Diese widerwärtige
Pustel Drummel trug
seine albernen kleinen
Theorien über das Wesen
der Bestien vor, die
unser Lager angriffen,
doch ich will

keines seiner Worte
hören. Er stellt zu
viele Fragen. Er ist
ein Makel auf dem Boden
Deines Heiligtums,
Meister – nach dem Weib
Sewel werde ich mich
seiner annehmen.

Apropos Sewel: Ich habe
diese hirnlose Dirne
überzeugt, dass wir
unser Lager in die
Vorhalle verlegen
sollten. Sie glaubt,
ich sorge mich um

ihre Sicherheit. Ich
komme zu Dir, Meister.
Ich schlage mein Lager
in Deinen Gemächern
auf. Ich schlafe unter
Deinem Dach. Ich kann
Deine Gegenwart schon
jetzt fühlen. Bald,
Meister. Bald."""

[translations.ita]
title = "Il taccuino di Lysander"
content = """
Giorno Tre - Giorno
Sei:

Che cosa sono queste
Bestie che osano
sfidare la nostra
presenza qui? Le hai
mandate Tu, Padrone?
Per fare a pezzi questi
stolti

che mi accompagnano?
Quella pustola
ripugnante, Drummel, ha
esposto le sue assurde
piccole teorie sulla
natura delle Bestie che
hanno attaccato il
nostro accampamento, ma
non voglio

sentire una parola da
lui. Fa troppe domande.
È una macchia sui
terreni del Tuo
Santuario, Padrone: mi
occuperò di lui dopo la
donna Sewel.

A proposito di Sewel,
ho convinto quella
sgualdrina senza
cervello che dovremmo
spostare l'accampamento
dentro l'anticamera.
Pensa che io tema per

la sua sicurezza. Vengo
a te, Padrone. Mi
accampo nelle Tue
stanze. Dormo sotto il
Tuo tetto. Posso
sentire la Tua presenza
anche ora. Presto,
Padrone. Presto."""

[translations.pol]
title = "Notatnik Lysander"
content = """
Dzień trzeci — dzień
szósty:

Cóż to za Bestie, które
ośmielają się
sprzeciwiać naszej
obecności tutaj? Czy Ty
je zesłałeś, Mistrzu?
By rozszarpały tych
głupców,

którzy mi towarzyszą?
Ten odrażający wrzód,
Drummel, przedstawił
swe niedorzeczne
teoryjki o naturze
Bestii atakujących nasz
obóz, lecz nie
zamierzam

słuchać jego słów.
Zadaje zbyt wiele
pytań. Jest skazą na
ziemiach Twego
Sanktuarium, Mistrzu —
zajmę się nim po
kobiecie Sewel.

Skoro mowa o Sewel,
przekonałem tę
pustogłową ladacznicę,
że powinniśmy przenieść
obóz do przedsionka.
Myśli, że martwię się o

jej bezpieczeństwo.
Przybywam do Ciebie,
Mistrzu. Rozbijam obóz
w Twych komnatach. Śpię
pod Twym dachem. Już
teraz czuję Twą
obecność. Wkrótce,
Mistrzu. Wkrótce."""

[translations.por]
title = "Caderno de Lysander"
content = """
Terceiro dia - Sexto
dia:

Que são estas Feras que
ousam desafiar nossa
presença aqui? Foi Você
quem as enviou, Mestre?
Para dilacerar esses
tolos

que me acompanham?
Aquela pústula
repugnante, Drummel,
apresentou suas
absurdas teorias sobre
a natureza das Feras
que atacaram nosso
acampamento, mas não
quero ouvir

nenhuma palavra dele.
Ele faz perguntas
demais. É uma mancha
nos terrenos de Seu
Santuário, Mestre;
cuidarei dele depois da
mulher Sewel.

Falando em Sewel,
convenci aquela
meretriz sem cérebro de
que devemos transferir
nosso acampamento para
a antecâmara. Ela acha
que me preocupo com

a segurança dela. Venho
buscar Você, Mestre.
Faço meu acampamento em
Suas câmaras. Durmo sob
Seu teto. Posso sentir
Sua presença mesmo
agora. Em breve,
Mestre. Em breve."""

[translations.spa]
title = "Cuaderno de Lysander"
content = """
Día tres - Día seis:

¿Qué son estas Bestias
que se atreven a
desafiar nuestra
presencia aquí? ¿Las
has enviado Tú,
Maestro? ¿Para
despedazar a estos
necios

que me acompañan? Esa
pústula repugnante,
Drummel, expuso sus
absurdas teorías sobre
la naturaleza de las
Bestias que atacaron
nuestro campamento,
pero no quiero

oír ni una de sus
palabras. Hace
demasiadas preguntas.
Es una mancha sobre los
terrenos de Tu
Santuario, Maestro: me
ocuparé de él después
de la mujer Sewel.

Hablando de Sewel, he
convencido a esa ramera
sin seso de que debemos
trasladar nuestro
campamento a la
antecámara. Cree que me
preocupa

su seguridad. Vengo por
Ti, Maestro. Establezco
mi campamento en Tus
cámaras. Duermo bajo Tu
techo. Incluso ahora
puedo sentir Tu
presencia. Pronto,
Maestro. Pronto."""
