title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day Three - Day Five:

I do not understand
this place... not as I
once thought I did.
Something palatable
seems to hinder our
every attempt to

investigate this
ancient site.
Excavation work on
the first major
hallway finished only
yesterday - the
amount of stone and
rubble blocking the

egress was
astounding, it stands
in immense piles
outside the Tomb's
entrance, as if we
were digging the
tunnels of this
abhorred place

ourselves!  The
satisfaction of
completing our efforts
was quickly thwarted,
however, as we
discovered the end of
the hallway we had
just revealed was

blocked by yet another
colossal pile of stone.
I've had a few of the
workers set up
primitive scaffolding
in the main
antechamber so that I
can spend my time

pouring over the detail
work on the stone
carvings while the
rest of our crew
continue excavating
the inner halls."""
item_template = "readable_scroll"

[translations.cze]
title = "Deník: Objevení hrobky"
content = """
Den třetí až pátý:

Nerozumím tomuto místu... ne tak, jak jsem si kdysi myslela. Zdá se, že něco hmatatelného maří každý náš pokus

prozkoumat toto dávné naleziště. Odkrytí první hlavní chodby skončilo teprve včera – množství kamene a suti blokující

východ bylo ohromující, stojí v obrovských hromadách před vstupem do hrobky, jako bychom tunely tohoto odporného místa kopali

sami! Uspokojení z dokončené námahy však rychle pominulo, když jsme zjistili, že konec právě odhalené chodby je

blokován další kolosální hromadou kamene. Nechala jsem několik dělníků postavit jednoduché lešení v hlavní předsíni, abych mohla věnovat čas

podrobnému studiu kamenických řezeb, zatímco zbytek našich pracovníků pokračuje v odkrývání vnitřních síní."""

[translations.fre]
title = "Journal : découverte du tombeau"
content = """
Du troisième au cinquième jour :

Je ne comprends pas cet endroit... pas comme je croyais jadis le comprendre. Quelque chose de palpable semble entraver chacune de nos tentatives d’

examiner ce site ancien. Les travaux de déblaiement du premier grand couloir n’ont pris fin qu’hier ; la quantité de pierres et de gravats qui bloquaient l’

issue était stupéfiante. Ils s’élèvent en immenses tas à l’extérieur de l’entrée du Tombeau, comme si nous creusions nous-mêmes les tunnels de cet endroit

abhorré ! Cependant, la satisfaction d’avoir terminé nos efforts fut vite contrariée lorsque nous découvrîmes que le bout du couloir que nous venions de mettre au jour était

bloqué par un autre amas colossal de pierres. J’ai demandé à quelques ouvriers d’installer un échafaudage rudimentaire dans l’antichambre principale, afin que je puisse consacrer mon temps

à étudier les détails des sculptures de pierre pendant que le reste de notre équipe poursuit le déblaiement des couloirs intérieurs."""

[translations.ger]
title = "Tagebuch: Entdeckung des Grabes"
content = """
Dritter bis fünfter Tag:

Ich verstehe diesen Ort nicht ... nicht so, wie ich einst dachte. Etwas Spürbares scheint jeden unserer Versuche zu behindern,

diese uralte Stätte zu untersuchen. Die Grabungsarbeiten am ersten großen Gang wurden erst gestern beendet – die Menge an Steinen und Trümmern, die den

Ausgang versperrten, war verblüffend; sie liegen in gewaltigen Haufen vor dem Grabeingang, als würden wir die Tunnel dieses verhassten Ortes

selbst graben! Die Befriedigung über den Abschluss unserer Bemühungen wurde jedoch rasch vereitelt, als wir entdeckten, dass das Ende des gerade freigelegten Ganges

von einem weiteren riesigen Steinhaufen versperrt war. Ich habe einige Arbeiter einfache Gerüste in der Hauptvorhalle aufstellen lassen, damit ich meine Zeit damit verbringen kann,

die Einzelheiten der Steinmetzarbeiten eingehend zu betrachten, während der Rest unserer Mannschaft die inneren Hallen weiter freilegt."""

[translations.ita]
title = "Diario: scoperta della Tomba"
content = """
Giorno Tre - Giorno Cinque:

Non capisco questo luogo... non come un tempo pensavo di capirlo. Qualcosa di palpabile sembra ostacolare ogni nostro tentativo di

indagare questo antico sito. I lavori di scavo nel primo grande corridoio sono terminati solo ieri: la quantità di pietre e macerie che bloccava l'

uscita era stupefacente; si trova in mucchi immensi fuori dall'ingresso della Tomba, come se stessimo scavando noi stessi i cunicoli di questo luogo

aborrito! La soddisfazione di aver completato il lavoro è stata però presto frustrata quando abbiamo scoperto che il fondo del corridoio appena rivelato era

bloccato da un altro colossale mucchio di pietre. Ho fatto montare ad alcuni operai un'impalcatura rudimentale nell'anticamera principale, così da poter trascorrere il mio tempo

a studiare i dettagli delle incisioni nella pietra mentre il resto della squadra continua a scavare le sale interne."""

[translations.pol]
title = "Dziennik: odkrycie Grobowca"
content = """
Dzień trzeci — dzień piąty:

Nie rozumiem tego miejsca... nie tak, jak niegdyś sądziłam. Coś namacalnego zdaje się utrudniać każdą próbę

zbadania tego pradawnego miejsca. Prace przy odsłanianiu pierwszego głównego korytarza zakończono dopiero wczoraj — ilość kamieni i gruzu blokujących

wyjście była zdumiewająca; stoją w ogromnych stosach przed wejściem do Grobowca, jakbyśmy sami drążyli tunele tego znienawidzonego miejsca!

Satysfakcja z ukończenia prac szybko jednak prysła, gdy odkryliśmy, że koniec dopiero odsłoniętego korytarza

blokuje kolejna kolosalna sterta kamieni. Kazałam kilku robotnikom ustawić prymitywne rusztowanie w głównym przedsionku, bym mogła spędzać czas

na studiowaniu szczegółów kamiennych rzeźbień, podczas gdy reszta załogi nadal odsłania wewnętrzne sale."""

[translations.por]
title = "Diário: descoberta da tumba"
content = """
Terceiro dia - Quinto dia:

Não entendo este lugar... não como antes pensava entender. Algo palpável parece dificultar todas as nossas tentativas de

investigar este sítio antigo. O trabalho de escavação do primeiro grande corredor só terminou ontem; a quantidade de pedra e entulho que bloqueava a

saída era espantosa. Agora fica em imensas pilhas fora da entrada da Tumba, como se estivéssemos escavando nós mesmos os túneis deste lugar

abominável! A satisfação de concluir nossos esforços, porém, logo foi frustrada, pois descobrimos que a extremidade do corredor que acabávamos de revelar estava

bloqueada por mais uma colossal pilha de pedra. Pedi a alguns trabalhadores que montassem andaimes rudimentares na antecâmara principal para que eu possa passar meu tempo

estudando os detalhes das esculturas de pedra enquanto o restante de nossa equipe continua escavando os salões internos."""

[translations.spa]
title = "Diario: descubrimiento de la tumba"
content = """
Día tres - Día cinco:

No comprendo este lugar... no como creía comprenderlo. Algo palpable parece obstaculizar cada intento nuestro de

investigar este antiguo lugar. La excavación del primer corredor principal terminó apenas ayer: la cantidad de piedra y escombros que bloqueaba la

salida era asombrosa; ahora se alza en pilas inmensas fuera de la entrada de la Tumba, ¡como si estuviéramos excavando nosotros mismos los túneles de este lugar

aborrecido! Sin embargo, la satisfacción de completar nuestro esfuerzo se frustró enseguida al descubrir que el extremo del corredor recién despejado estaba

bloqueado por otra colosal pila de piedra. He hecho que algunos trabajadores levanten andamios primitivos en la antecámara principal para poder dedicar mi tiempo

a estudiar los detalles de las tallas en piedra mientras el resto de la cuadrilla sigue excavando los corredores interiores."""
