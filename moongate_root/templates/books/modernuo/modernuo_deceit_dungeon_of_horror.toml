title = "Deceit: A Dungeon of Horrors"
author = "Mercenary Justin"
content = """  My employers have
oft taken me into this
den of hideous
creatures, and I
thought that it
behooved me to write
down what I know of
it, now that I am

retired from the life
of an adventurer for
hire.
  Deceit was once a
temple to forgotten
powers of old. It was
taken over by mages
who eventually were

driven out by the
depredations of their
own evil lackeys.
However, many of
the magical traps and
devices that they
placed for their
defenses remain,

particularly those the
wizards used to
protect their
treasures.
  The dungeon is
mystically linked by
crystal balls placed in
different locations.

These magical orbs do
transmit speech, and
even have memory of
things that have been
said near them. No
doubt they once
served as a warning
system

  Be wary of a
brazier that giveth
warning when
approached; thou canst
use it to summon
deadly creatures.
  There be a
tantalizing chest,

undoubtedly full of
treasure, that cannot
be reached save past a
complex set of
pressure plates that
trigger deadly spikes.
As I never had
sufficient folk with

me to unlock the
puzzle, I never
obtained the riches
that awaited there.
  Do not investigate
iron maidens too
closely, for they may
suck you within

them!
  There is one place
where a deadly trap
can only be disarmed
by making use of a
statue that cleverly
conceals a lever.
  Oft one encounters

the deadly exploding
toadstool; the ones in
Deceit are deadlier
than most, as they
explode continually.
Likewise, the very
pools of water and
slime on the floor

may poison thee.
  The most magical
device in the dungeon
is a mystical bridge
that can only be
triggered by a level
embedded in the floor.
Be wary however,

for the bridge thus
created doth burst
into flame when one
passeth across it!"""
item_template = "readable_scroll"

[translations.cze]
title = "Deceit: Kobka hrůz"
content = """
Moji zaměstnavatelé mě často vodili do tohoto doupěte ohavných tvorů a usoudil jsem, že by bylo náležité sepsat, co o něm vím, nyní, když jsem

zanechal života námezdného dobrodruha.
Deceit býval chrámem dávných zapomenutých mocností. Ovládli jej mágové, které nakonec

vyhnalo řádění jejich vlastních zlých přisluhovačů. Mnoho kouzelných pastí a zařízení, které tam na svou obranu umístili, však zůstává,

zejména těch, jimiž čarodějové chránili své poklady.
Kobku mysticky propojují křišťálové koule umístěné na různých místech.

Tyto kouzelné koule přenášejí řeč a dokonce si pamatují věci vyřčené v jejich blízkosti. Nepochybně kdysi sloužily jako výstražný systém.

Měj se na pozoru před žárovištěm, které při přiblížení vydává varování; můžeš jím přivolat smrtící tvory.
Je tam lákavá truhla,

nepochybně plná pokladu, k níž se lze dostat jen přes složitou soustavu nášlapných desek spouštějících smrtící bodce. Jelikož jsem s sebou nikdy neměl dost lidí,

abych hlavolam rozřešil, nikdy jsem nezískal bohatství, jež tam čekalo.
Nezkoumej železné panny příliš zblízka, neboť tě mohou vtáhnout do

svého nitra!
Na jednom místě lze smrtící past zneškodnit jen použitím sochy, která důmyslně ukrývá páku.
Často se tu setkáš

se smrtící vybuchující muchomůrkou; ty v Deceit jsou nebezpečnější než většina ostatních, neboť vybuchují ustavičně. Také samotné kaluže vody a slizu na podlaze

tě mohou otrávit.
Nejkouzelnějším zařízením v kobce je mystický most, který lze spustit pouze pákou zasazenou do podlahy. Měj se však na pozoru,

neboť takto vytvořený most vzplane, když po něm někdo přechází!"""

[translations.fre]
title = "Deceit : un donjon d’horreurs"
content = """
Mes employeurs m’ont souvent conduit dans ce repaire de créatures hideuses, et j’ai pensé qu’il me revenait de consigner ce que j’en sais, maintenant que je me suis

retiré de la vie d’aventurier à louer. Deceit était autrefois un temple consacré à d’anciennes puissances oubliées. Des mages s’en emparèrent, avant d’être finalement

chassés par les déprédations de leurs propres laquais maléfiques. Cependant, nombre des pièges et dispositifs magiques qu’ils avaient installés pour se défendre demeurent,

en particulier ceux dont les sorciers se servaient pour protéger leurs trésors. Le donjon est relié mystiquement par des boules de cristal placées à différents endroits.

Ces orbes magiques transmettent la parole et gardent même le souvenir des choses dites près d’eux. Sans doute servaient-ils jadis de système d’alarme

Méfiez-vous d’un brasero qui donne un avertissement lorsqu’on s’en approche ; vous pouvez l’utiliser pour invoquer des créatures meurtrières. Il existe un coffre tentant,

sans aucun doute plein de trésors, que l’on ne peut atteindre qu’en franchissant un ensemble complexe de plaques de pression déclenchant des pointes mortelles. Comme je n’ai jamais eu assez de compagnons

avec moi pour résoudre l’énigme, je n’ai jamais obtenu les richesses qui y attendaient. N’examinez pas les vierges de fer de trop près, car elles pourraient vous aspirer à l’intérieur

d’elles-mêmes ! En un endroit, un piège mortel ne peut être désarmé qu’en utilisant une statue qui dissimule ingénieusement un levier. On rencontre souvent

le mortel champignon explosif ; ceux de Deceit sont plus meurtriers que la plupart, car ils explosent continuellement. De même, les mares d’eau et de vase qui se trouvent sur le sol

peuvent vous empoisonner. Le dispositif le plus magique du donjon est un pont mystique que seul un levier encastré dans le sol permet d’activer. Mais prenez garde,

car le pont ainsi créé s’embrase lorsque l’on le traverse !"""

[translations.ger]
title = "Deceit: Ein Verlies des Schreckens"
content = """
Meine Auftraggeber haben mich oft in diesen Hort abscheulicher Kreaturen geführt, und ich dachte, es gezieme sich, mein Wissen darüber niederzuschreiben, nun da ich mich

vom Leben eines Abenteurers gegen Bezahlung zurückgezogen habe.
Deceit war einst ein Tempel vergessener Mächte aus alter Zeit. Er wurde von Magiern übernommen, die schließlich

durch die Verwüstungen ihrer eigenen bösen Handlanger vertrieben wurden. Viele der magischen Fallen und Vorrichtungen, die sie zu ihrer Verteidigung aufgestellt hatten, sind jedoch geblieben,

besonders jene, mit denen die Zauberer ihre Schätze schützten.
Das Verlies ist durch Kristallkugeln an verschiedenen Stellen auf mystische Weise verbunden.

Diese magischen Kugeln übertragen Sprache und erinnern sich sogar an Dinge, die in ihrer Nähe gesagt wurden. Ohne Zweifel dienten sie einst als Warnanlage

Hütet Euch vor einer Feuerschale, die bei Annäherung eine Warnung ausspricht; Ihr könnt sie benutzen, um tödliche Kreaturen herbeizurufen.
Es gibt eine verlockende Truhe,

die zweifellos voller Schätze ist und nur über eine verwickelte Reihe von Druckplatten erreicht werden kann, die tödliche Stacheln auslösen. Da ich nie genügend Leute bei

mir hatte, um das Rätsel zu lösen, habe ich die dort wartenden Reichtümer nie erlangt.
Untersucht eiserne Jungfrauen nicht zu genau, denn sie können Euch in

ihr Inneres saugen!
An einer Stelle kann eine tödliche Falle nur entschärft werden, indem man eine Statue benutzt, die geschickt einen Hebel verbirgt.
Oft begegnet man

dem tödlichen explodierenden Giftpilz; jene in Deceit sind tödlicher als die meisten, da sie unablässig explodieren. Ebenso können Euch sogar die Wasser- und Schleimpfützen auf dem Boden

vergiften.
Die magischste Vorrichtung im Verlies ist eine mystische Brücke, die nur durch einen in den Boden eingelassenen Hebel ausgelöst werden kann. Doch seid vorsichtig,

denn die so erschaffene Brücke geht in Flammen auf, wenn man sie überquert!"""

[translations.ita]
title = "Deceit: un sotterraneo degli orrori"
content = """
I miei datori di lavoro mi hanno condotto spesso in questo covo di creature orribili, e ho pensato fosse mio dovere mettere per iscritto ciò che ne so, ora che mi sono

ritirato dalla vita di avventuriero a pagamento.
Deceit era un tempo un tempio dedicato a dimenticate potenze antiche. Fu occupato da maghi che alla fine furono

scacciati dalle devastazioni dei loro stessi malvagi servi. Tuttavia molte delle trappole e dei congegni magici che posero per difendersi rimangono,

in particolare quelli che i maghi usavano per proteggere i loro tesori.
Il sotterraneo è collegato misticamente da sfere di cristallo poste in luoghi diversi.

Queste sfere magiche trasmettono la parola e conservano persino memoria di cose dette vicino a esse. Senza dubbio un tempo fungevano da sistema d'allarme

Guardatevi da un braciere che dà un avvertimento quando ci si avvicina; potete usarlo per evocare creature mortali.
Vi è un allettante forziere,

senza dubbio pieno di tesori, che non si può raggiungere se non oltrepassando una complessa serie di piastre a pressione che azionano punte mortali. Poiché non ebbi mai abbastanza persone con

me per risolvere l'enigma, non ottenni mai le ricchezze che vi attendevano.
Non esaminate troppo da vicino le vergini di ferro, poiché potrebbero risucchiarvi al loro

interno!
Vi è un luogo dove una trappola mortale può essere disarmata soltanto usando una statua che nasconde ingegnosamente una leva.
Spesso si incontrano

i mortali funghi esplosivi; quelli di Deceit sono più letali della maggior parte, poiché esplodono continuamente. Allo stesso modo, persino le pozze d'acqua e di melma sul pavimento

possono avvelenarvi.
Il congegno più magico del sotterraneo è un ponte mistico che può essere azionato solo da una leva incassata nel pavimento. Fate attenzione, tuttavia,

poiché il ponte così creato prende fuoco quando lo si attraversa!"""

[translations.pol]
title = "Deceit: loch grozy"
content = """
Moi pracodawcy często zabierali mnie do tego siedliska ohydnych stworzeń, więc pomyślałem, że wypada spisać to, co o nim wiem, teraz gdy

wycofałem się z życia najemnego poszukiwacza przygód.
Deceit było niegdyś świątynią zapomnianych pradawnych mocy. Przejęli ją magowie, których w końcu

wypędziły grabieże ich własnych złych sług. Wiele magicznych pułapek i urządzeń, które ustawili dla obrony, jednak pozostało,

szczególnie tych, którymi czarodzieje chronili swe skarby.
Loch jest mistycznie połączony kryształowymi kulami rozmieszczonymi w różnych miejscach.

Te magiczne kule przekazują mowę, a nawet pamiętają rzeczy powiedziane w ich pobliżu. Bez wątpienia służyły niegdyś jako system ostrzegawczy.

Strzeż się paleniska, które ostrzega, gdy się do niego zbliżysz; możesz użyć go do przywołania śmiercionośnych stworzeń.
Jest tam kusząca skrzynia,

niewątpliwie pełna skarbów, do której można dotrzeć jedynie przez skomplikowany układ płyt naciskowych uruchamiających zabójcze kolce. Ponieważ nigdy nie miałem ze sobą dość ludzi,

by rozwiązać zagadkę, nigdy nie zdobyłem czekających tam bogactw.
Nie przyglądaj się zbyt blisko żelaznym dziewicom, bo mogą wciągnąć cię

do środka!
Jest jedno miejsce, gdzie śmiercionośną pułapkę można rozbroić tylko za pomocą posągu, który sprytnie ukrywa dźwignię.
Często spotyka się

zabójczy wybuchający muchomor; te w Deceit są groźniejsze niż większość, gdyż wybuchają nieustannie. Podobnie nawet kałuże wody i szlamu na podłodze

mogą cię zatruć.
Najbardziej magicznym urządzeniem w lochu jest mistyczny most, który można uruchomić tylko dźwignią osadzoną w podłodze. Miej się jednak na baczności,

gdyż powstały w ten sposób most staje w płomieniach, gdy ktoś po nim przechodzi!"""

[translations.por]
title = "Deceit: uma masmorra de horrores"
content = """
Meus empregadores muitas vezes me levaram a esse covil de criaturas horrendas, e achei que me cabia registrar o que sei sobre ele, agora que estou

aposentado da vida de aventureiro de aluguel.
Deceit já foi um templo dedicado a antigos poderes esquecidos. Foi tomado por magos que acabaram

expulsos pelas depredações de seus próprios lacaios malignos. Contudo, muitas das armadilhas e dos dispositivos mágicos que instalaram para sua defesa permanecem,

especialmente os que os feiticeiros usavam para proteger seus tesouros.
A masmorra está misticamente interligada por bolas de cristal colocadas em diferentes locais.

Esses orbes mágicos transmitem a fala e até guardam memória de coisas ditas perto deles. Sem dúvida, já serviram como sistema de alerta.

Tome cuidado com um braseiro que dá um aviso quando alguém se aproxima; você pode usá-lo para invocar criaturas mortais.
Há um baú tentador,

sem dúvida cheio de tesouros, que só pode ser alcançado passando por um complexo conjunto de placas de pressão que acionam espinhos mortais. Como nunca tive gente suficiente

comigo para resolver o enigma, jamais obtive as riquezas que aguardavam ali.
Não examine donzelas de ferro de perto demais, pois elas podem sugá-lo para dentro

delas!
Há um lugar onde uma armadilha mortal só pode ser desarmada usando uma estátua que esconde engenhosamente uma alavanca.
Frequentemente se encontra

o mortal cogumelo explosivo; os de Deceit são mais mortais do que a maioria, pois explodem continuamente. Da mesma forma, as próprias poças de água e limo no chão

podem envenená-lo.
O dispositivo mais mágico da masmorra é uma ponte mística que só pode ser acionada por uma alavanca embutida no chão. Tome cuidado, porém,

pois a ponte assim criada se incendeia quando alguém passa por ela!"""

[translations.spa]
title = "Deceit: una mazmorra de horrores"
content = """
  Mis patrones me han llevado muchas veces a esta guarida de criaturas horrendas, y me pareció conveniente poner por escrito cuanto sé de ella, ahora que me he

retirado de la vida de aventurero a sueldo. Deceit fue antaño un templo dedicado a olvidados poderes antiguos. Lo ocuparon unos magos que acabaron

expulsados por las depredaciones de sus propios y malvados servidores. Sin embargo, permanecen muchas de las trampas y dispositivos mágicos que instalaron para defenderse,

en particular los que aquellos hechiceros utilizaban para proteger sus tesoros. La mazmorra está unida místicamente mediante bolas de cristal situadas en distintos lugares.

Estas esferas mágicas transmiten la voz e incluso recuerdan cosas que se han dicho cerca de ellas. Sin duda sirvieron en otro tiempo como sistema de alarma.

  Desconfía de un brasero que emite una advertencia al acercarse: puedes utilizarlo para invocar criaturas mortíferas. Hay un cofre tentador,

indudablemente lleno de tesoros, al que solo se puede llegar superando un complejo conjunto de placas de presión que activan pinchos mortales. Como nunca dispuse de suficientes compañeros

para resolver el enigma, jamás conseguí las riquezas que allí aguardaban. ¡No examines demasiado de cerca las doncellas de hierro, pues pueden absorberte

en su interior! En cierto lugar, una trampa mortal solo puede desarmarse mediante una estatua que oculta ingeniosamente una palanca. A menudo se encuentran

las mortíferas setas explosivas; las de Deceit son más peligrosas que la mayoría, pues explotan continuamente. Del mismo modo, los propios charcos de agua y baba del suelo

pueden envenenarte. El dispositivo más mágico de la mazmorra es un puente místico que solo se activa mediante una palanca incrustada en el suelo. Pero ten cuidado,

¡pues el puente así creado estalla en llamas cuando alguien lo cruza!"""
