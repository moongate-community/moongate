title = "The daily journal of Grimmoch Drummel"
author = "Grimmoch"
content = """Day Three - Day Five:

I might have
written too hastily in
my first entry - this
place doesn't seem too
bent on giving up any
secrets.   Though the

main antechamber is
open to us, the main
exit hall is blocked by
yet another pile of
rubble.  Doesn't look a
bit like anything
caused by a quake or
instability in the

stonework... I swear it
looks as if someone
actually piled the
stones up themselves,
some time after the
tomb was built.  The
stones aren't of the
same set nor quality

of the carved work
that surrounds them
- if anything, they
resemble the grade of
common rock we saw
in great quantities on
the trip here.  Which
makes it feel all the

more like someone
hauled them in and
deliberately covered
this passage.  But then
why not decorate them
in the same ornate
manner as the rest of
the stone in this

place?  Lysander
wouldn't hear a word
of what I had to say -
to him, it was a quake
some time in the
history of the tomb,
and that was it, shut
up and move on.  So I

shut up, and got back
to work."""
item_template = "readable_scroll"

[translations.cze]
title = "Denní zápisky Grimmoch Drummel"
content = """
Den třetí až pátý:

Možná jsem první zápis napsal příliš ukvapeně – zdá se, že tohle místo nemá chuť vydat žádná tajemství. Ačkoli

hlavní předsíň je nám otevřena, hlavní výstupní chodbu blokuje další hromada suti. Ani trochu to nevypadá jako následek zemětřesení nebo nestability

zdiva... přísahám, že to vypadá, jako by někdo kameny vlastnoručně navršil nějakou dobu po postavení hrobky. Kameny nejsou stejného druhu ani jakosti

jako vytesané dílo kolem nich – spíše připomínají obyčejnou horninu, které jsme cestou sem viděli veliké množství. A proto mám o to silnější dojem,

že je někdo přinesl a tuhle chodbu úmyslně zatarasil. Proč je ale potom neozdobil stejně bohatě jako zbytek kamene na tomto

místě? Lysander nechtěl slyšet ani slovo z toho, co jsem říkal – podle něj to bylo zemětřesení někdy v dějinách hrobky, a tím to končilo, mlč a pokračuj. Tak jsem

zmlkl a vrátil se k práci."""

[translations.fre]
title = "Le journal quotidien de Grimmoch Drummel"
content = """
Du troisième au cinquième jour :

J’ai peut-être écrit trop vite dans ma première entrée : cet endroit ne paraît guère disposé à livrer ses secrets. Bien que la

principale antichambre nous soit ouverte, le couloir de sortie principal est bloqué par un autre tas de gravats. Cela ne ressemble en rien aux conséquences d’un séisme ou d’une instabilité de la

maçonnerie... Je jure qu’on dirait que quelqu’un a réellement entassé les pierres lui-même, quelque temps après la construction du tombeau. Les pierres ne sont ni de la même série ni de la même qualité

que l’ouvrage sculpté qui les entoure ; elles ressemblent plutôt à la roche ordinaire que nous avons vue en grande quantité en venant ici. Ce qui donne d’autant plus l’impression

que quelqu’un les a transportées à l’intérieur et a délibérément bouché ce passage. Mais alors, pourquoi ne pas les orner de la même façon ouvragée que le reste des pierres de cet

endroit ? Lysander n’a rien voulu entendre de ce que je disais : pour lui, c’était un séisme à quelque moment de l’histoire du tombeau, et voilà, tais-toi et passe à autre chose. Alors je me suis

tu et j’ai repris le travail."""

[translations.ger]
title = "Grimmoch Drummels tägliches Tagebuch"
content = """
Dritter bis fünfter Tag:

Vielleicht habe ich bei meinem ersten Eintrag zu voreilig geschrieben – dieser Ort scheint seine Geheimnisse nicht bereitwillig preiszugeben. Zwar steht die

Hauptvorhalle uns offen, doch der Hauptausgang ist durch einen weiteren Trümmerhaufen versperrt. Es sieht kein bisschen nach etwas aus, das von einem Beben oder einer Schwäche im

Mauerwerk verursacht worden wäre ... Ich schwöre, es sieht aus, als hätte jemand die Steine tatsächlich selbst aufgeschichtet, einige Zeit nachdem das Grab gebaut worden war. Die Steine gehören weder zur gleichen Art noch haben sie die gleiche Güte

wie die Steinmetzarbeit um sie herum – eher ähneln sie dem gewöhnlichen Gestein, das wir auf der Reise hierher in großen Mengen sahen. Dadurch wirkt es nur umso

mehr, als hätte jemand sie hereingeschafft und diesen Gang absichtlich verdeckt. Aber warum wurden sie dann nicht auf dieselbe kunstvolle Weise verziert wie der übrige Stein an diesem

Ort? Lysander wollte kein Wort davon hören, was ich zu sagen hatte – für ihn war es ein Beben irgendwann in der Geschichte des Grabes, und damit Schluss, schweigen und weitermachen. Also

schwieg ich und ging wieder an die Arbeit."""

[translations.ita]
title = "Il diario quotidiano di Grimmoch Drummel"
content = """
Giorno Tre - Giorno Cinque:

Forse ho scritto troppo in fretta nella mia prima annotazione: questo posto non sembra troppo intenzionato a svelare segreti. Sebbene l'

anticamera principale sia aperta per noi, il corridoio d'uscita principale è bloccato da un altro mucchio di macerie. Non sembra affatto qualcosa causato da un terremoto o dall'instabilità della

muratura... giuro che sembra che qualcuno abbia ammucchiato le pietre di persona, qualche tempo dopo la costruzione della tomba. Le pietre non sono dello stesso tipo né della stessa qualità

di quelle scolpite che le circondano; semmai somigliano alla comune roccia che abbiamo visto in grandi quantità durante il viaggio fin qui. Il che fa pensare ancor

di più che qualcuno le abbia trasportate qui dentro e abbia deliberatamente coperto questo passaggio. Ma allora perché non decorarle con gli stessi ornamenti del resto della pietra in questo

luogo? Lysander non ha voluto sentire una parola di ciò che avevo da dire: per lui era stato un terremoto in qualche momento della storia della tomba, punto e basta, zitto e avanti. Così ho

taciuto e sono tornato al lavoro."""

[translations.pol]
title = "Dziennik codzienny Grimmoch Drummel"
content = """
Dzień trzeci — dzień piąty:

Może zbyt pospiesznie napisałem pierwszy wpis — to miejsce niezbyt chce zdradzać tajemnice. Choć

główny przedsionek stoi przed nami otworem, główny korytarz wyjściowy blokuje kolejna sterta gruzu. Wcale nie wygląda to na skutek trzęsienia ziemi ani niestabilności

kamiennych konstrukcji... Przysięgam, wygląda, jakby ktoś sam ułożył kamienie w stos jakiś czas po zbudowaniu grobowca. Kamienie nie należą do tego samego rodzaju ani nie mają tej samej jakości

co otaczające je rzeźbione elementy — raczej przypominają zwykłą skałę, której wielkie ilości widzieliśmy w drodze tutaj. Tym mocniej sprawia to

wrażenie, że ktoś przywlókł je tu i celowo zasłonił przejście. Ale czemu nie ozdobił ich równie bogato jak reszty kamienia w tym

miejscu? Lysander nie chciał słuchać ani słowa z tego, co mówiłem — dla niego było to trzęsienie ziemi w którymś momencie dziejów grobowca i koniec, zamknij się i pracuj dalej. Więc

zamknąłem się i wróciłem do pracy."""

[translations.por]
title = "O diário de Grimmoch Drummel"
content = """
Terceiro dia - Quinto dia:

Talvez eu tenha escrito depressa demais em minha primeira anotação: este lugar não parece muito disposto a revelar seus segredos. Embora a

antecâmara principal esteja aberta para nós, o salão principal de saída está bloqueado por mais uma pilha de entulho. Não parece nem um pouco algo causado por um terremoto ou pela instabilidade da

alvenaria... Juro que parece que alguém realmente empilhou as pedras por conta própria, algum tempo depois de a tumba ser construída. As pedras não são do mesmo conjunto nem da mesma qualidade

das obras talhadas que as cercam; pelo contrário, parecem do tipo de rocha comum que vimos em grande quantidade na viagem até aqui. O que dá ainda

mais a impressão de que alguém as carregou para dentro e deliberadamente cobriu esta passagem. Mas, então, por que não as decorar com os mesmos ornamentos do restante da pedra neste

lugar? Lysander não quis ouvir uma palavra do que eu tinha a dizer: para ele, foi um terremoto em algum momento da história da tumba e pronto, cale a boca e siga em frente. Então eu

calei a boca e voltei ao trabalho."""

[translations.spa]
title = "El diario de Grimmoch Drummel"
content = """
Día tres - Día cinco:

Quizá me precipité al escribir mi primera entrada: este lugar no parece dispuesto a revelar ningún secreto. Aunque la

antecámara principal está abierta para nosotros, el corredor principal de salida está bloqueado por otra pila de escombros. No parece en absoluto el resultado de un terremoto ni de una inestabilidad en la

mampostería... juro que parece que alguien amontonó las piedras por su cuenta, algún tiempo después de que se construyera la tumba. Las piedras no son del mismo conjunto ni de la misma calidad

que la obra tallada que las rodea; más bien se parecen a la roca común que vimos en grandes cantidades durante el viaje hasta aquí. Eso da aún más

la impresión de que alguien las trajo y tapó deliberadamente este pasaje. Pero entonces, ¿por qué no decorarlas con los mismos adornos que el resto de la piedra de este

lugar? Lysander no quiso escuchar ni una palabra de lo que decía: para él, había sido un terremoto en algún momento de la historia de la tumba y punto; cállate y sigue. Así que me

callé y volví al trabajo."""
