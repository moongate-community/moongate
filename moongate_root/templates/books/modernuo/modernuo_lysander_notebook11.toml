title = "Lysander's Notebook"
author = "L. Gathenwale"
content = """Day Eleven - Day
Thirteen:

I come for Thee, my
Master.  I come!  The
way is clear, I have
found Thy path and
washed it in the blood

of the two workers
that caught sight of
me.  Ah, how sweet it
was to cut them open,
to see the blood pour
out in great torrents, to
stand in it, to revel in
it.  If only I had time

for the Sewel woman.
But there will be time
enough for her.  I
have learned Thy
Patience, Master.  I
come for Thee.  I walk
Thy halls in penance,
my last steps in this

repulsive living
frame.  I come for
Thee and Thy Gifts,
my Master.  Glory
Unto Thee, Khal
Ankur, Keeper of the
Seventh Death,
Master, Leader of the

Chosen, the Khaldun.
Praises in Thy
Name, Master of Life
and Death, Lord of All.
 Khal Ankur, Master,
Prophet, I join Thy
ranks this night, a
member of the

Khaldun at last!"""
