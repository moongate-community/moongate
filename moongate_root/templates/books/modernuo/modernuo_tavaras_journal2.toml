title = "Journal: Discovery of the Tomb"
author = "Tavara Sewel"
content = """Day Two:

Everything we'd
heard and read of the
tomb has proved
correct - and yet,
nothing could prepare
me for the sight of it

with my own eyes.
The Tomb of Khal
Ankur has given up
its secrets at last!  The
intricate stonework
that covered the tomb
doors seems to
continue throughout

the entirety of the
catacombs, each
hallway and room
yielding a seemingly
endless amount of
information for my
companions and I to
record.  It will take

years to catalogue the
entirety of the Tomb,
if those legends of its
massive size prove
true.  Sadly, a good
deal of the Tomb's
interior has been
damaged or utterly

destroyed, whether
by seismic activity in
the surrounding
mountainside or
merely the slow
efforts of Time
itself, I do not know.
A good deal of the

stonework has been
cracked or collapsed
entirely, especially
near the entrance
supports of the main
hall.  Our passage has
indeed already been
entirely blocked in the

first major room
we've discovered, a
massive pile of
boulders and stones
blocking any exit
from the
antechamber.  What
could have caused

such a localized
disruption of the
support structures,
one can only guess -
but it will surely take
an entire afternoon's
effort to remove even
a fraction of it.  I look

forward to more
progress tomorrow
once the workers have
set to excavating the
hall."""
item_template = "readable_scroll"
