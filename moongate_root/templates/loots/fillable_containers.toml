# ==============================================================================
# Moongate - templates/loots/fillable_containers.toml
#
# What it is for:
#   What the crates, boxes, chests, barrels and bookcases of the towns fill up
#   with (scripts/items/fillable.lua): one table per kind of place, as
#   ModernUO's FillableContent. A container takes the table its decoration
#   names in content_type, else that of the nearest vendor.
#
# Fields:
#   [[loot]]            one table; its id is fillable_<kind>, such as
#                       fillable_baker
#   [[loot.entries]]    one thing the table can give; a refill rolls the table
#                       once for each item it adds
#   weight              the share of the entry among those of its table
#   item_id             the item template it gives
#   loot_template_id    or another table rolled in its place
#   amount              how many: a number, or "min-max"
#   comment             what the entry is in ModernUO
# ==============================================================================

