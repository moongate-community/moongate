# ==============================================================================
# Moongate - templates/loots/treasure_chests.toml
#
# What it is for:
#   What the treasure chests of the dungeons roll (the loot of
#   treasure_chest_level_1 to 4 in templates/items/treasure_chests.toml), with
#   the amounts of ModernUO's TreasureChestLevel1 to 4: a pile of one gem, one
#   reagent or one scroll instead of single pieces. A table whose first entry
#   is empty gives something one time in two, so a chest that lists it twice
#   holds none to two of them. The scrolls are of the circles ModernUO
#   gives: the first five at level 2, the first six at levels 3 and 4.
#
# Fields:
#   [[loot]]            one table, named chest_<what>_<amount>
#   [[loot.entries]]    one outcome; the one without item_id or
#                       loot_template_id gives nothing
#   weight              the share of the outcome among those of its table
#   item_id             the item template it gives
#   loot_template_id    or another table rolled in its place
#   amount              how many in the pile: a number, or "min-max"
# ==============================================================================

