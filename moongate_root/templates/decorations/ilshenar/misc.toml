# ==============================================================================
# Moongate - templates/decorations/ilshenar/misc.toml
#
# What it is for:
#   World decoration placed on Ilshenar: doors, signs, lights, furniture and
#   the other items the client's map files do not hold. Each block is one kind
#   of item placed at every location it lists.
#
# Fields:
#   comment    what the block places, when the data names it
#   type       the kind of decoration, such as Static, MetalDoor or LocalizedSign
#   item_id    the graphic; unset for an addon built from several graphics
#   props      the kind's settings, such as hue, name, facing (DoorFacingType),
#              label_number or point_dest
#   args       settings given without a name
#   locations  [x, y, z] of every item of the block
#   extras     a setting per location, in the order of locations, when the kind has one
# ==============================================================================

