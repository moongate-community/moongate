# Fields:
#   type       LocalizedSign for a text of the client (label_number), Sign for a
#              written name
#   item_id    the graphic
#   props      label_number, the cliloc of the text, or name; hue when the sign
#              has one
#   locations  [x, y, z] of every sign of the block
# ==============================================================================

