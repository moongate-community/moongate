# ==============================================================================
# Moongate - templates/spawns/felucca/jail.toml
#
# What it is for:
#   The chests of rations of the jail: one region of items per cell of
#   data/jail.toml, each a single tile in the north-east corner of its cell,
#   away from where the prisoner arrives. The chest (item template jail_chest)
#   decays after an hour and the region puts a full one back a minute or two
#   later. A shard that adds a cell adds its region here.
#
# Fields:
#   see docs/spawns.md, "Regions of items"
# ==============================================================================

