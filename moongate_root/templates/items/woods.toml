# ==============================================================================
# Moongate - templates/items/woods.toml
#
# What it is for:
#   The wood the converted item files do not have: the logs and the boards of
#   the six kinds of wood a lumberjack finds beside plain wood (oak, ash, yew,
#   heartwood, bloodwood, frostwood), and the five rare things a master finds
#   with the logs. scripts/items/axe.lua gives them by these ids.
#
# Fields:
#   base_id     the plain log or board it is one of, or base_item
#   item_id     the graphic, for the rare finds
#   name        the name shown
#   hue         the colour of the kind
#   weight      in stones
#   stackable   piles in one item
# ==============================================================================

