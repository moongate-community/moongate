# ==============================================================================
# Moongate - templates/items/metals.toml
#
# What it is for:
#   The metals the converted item files do not have: the ore and the ingots of
#   the eight metals a miner finds beside iron (dull copper, shadow iron,
#   copper, bronze, gold, agapite, verite, valorite). scripts/items/pickaxe.lua
#   gives the ore and scripts/items/ore.lua smelts it into the ingots, by these
#   ids (scripts/common/metals.lua).
#
# Fields:
#   base_id     the large pile of iron ore or the iron ingot it is one of
#   name        the name shown
#   hue         the colour of the metal
# ==============================================================================

[[item]]
id = "ore_dull_copper"
base_id = "0x19b9_iron_ore"
name = "dull copper ore"
hue = 0x973

