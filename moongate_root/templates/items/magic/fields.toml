# ==============================================================================
# Moongate - templates/items/magic/fields.toml
#
# What it is for:
#   The pieces of the fields the spells of Magery raise: a wall of stone, and a
#   field of fire, of poison, of paralysis or of energy along the east-west or
#   the north-south line. scripts/spells/wall_of_stone.lua, fire_field.lua,
#   poison_field.lua, paralyze_field.lua and energy_field.lua put them down, five
#   or three at a time, and scripts/items/magic_field.lua takes them away when
#   their time is up, burns or poisons whoever stands in a field of fire or of
#   poison and paralyzes whoever steps onto a field of paralysis. magic_gate is
#   the gate Gate Travel opens at each end (scripts/items/moongate.lua takes the
#   traveller, and takes the gate away when its time is up).
#
# Fields:
#   id, base_id, item_id, name   as every item template
#   movable    false: nobody picks a piece up
#   script_id  magic_field: the script that ends the field and burns; moongate for the gate
#   decays     false: the script ends the field, not the decay service
# ==============================================================================

[[item]]
id = "magic_wall_of_stone"
base_id = "base_item"
item_id = 0x0082
name = "a wall of stone"
rarity = "common"
movable = false
decays = false
script_id = "magic_field"

