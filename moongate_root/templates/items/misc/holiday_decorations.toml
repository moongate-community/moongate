# ==============================================================================
# Moongate - templates/items/misc/holiday_decorations.toml
#
# What it is for:
#   The decorations the holiday events put in the towns while they are on
#   (scripts/common/holiday_decor.lua, called by scripts/events/halloween.lua
#   and christmas.lua). Each derives from a converted template of halloween.toml
#   or christmas.toml and only changes what a decoration needs: it cannot be
#   lifted and it never decays, so it stays until the event ends and removes it.
#
# Fields:
#   as every item template; base_id, movable = false, decays = false.
# ==============================================================================

