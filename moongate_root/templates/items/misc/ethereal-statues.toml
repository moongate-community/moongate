# ==============================================================================
# Moongate - templates/items/misc/ethereal-statues.toml
#
# What it is for:
#   The statuettes of the ethereal mounts: a player double clicks one in its
#   backpack and rides the mount item named by the tag mount_item (a template of
#   equippable-mounts.toml). The statuette is gone while the player rides and
#   comes back when it gets off. scripts/items/ethereal_mount.lua runs it.
#
# Fields:
#   item_id           the graphic of the statuette
#   script_id         ethereal_mount
#   tags.mount_item   the template of the mount item that is worn
# ==============================================================================

[[item]]
id = "ethereal_horse_statue"
item_id = 8413
name = "an ethereal horse statuette"
rarity = "rare"
loot_type = "newbied"
script_id = "ethereal_mount"
[item.tags]
mount_item = "etherealhorse"

