# ==============================================================================
# Moongate - harvest.toml
#
# What it is for:
#   What is gathered from the world and runs out: the fish of the sea, the wood
#   of the trees, the ore of the mountains. Each map is cut in square areas;
#   every cell of an area shares its amount. An area is full the first time someone gathers there
#   (a number between amount_min and amount_max), a catch takes one, and the
#   area is full again, all at once, between respawn_min_minutes and
#   respawn_max_minutes after the first take from it. An area of a resource
#   with veins is of one of them, drawn by weight each time the area fills:
#   the kind of wood of a place. Areas are kept in memory: after a restart
#   every place is full.
#   Without this file nothing is gathered: the fish never bite.
#
# Fields:
#   [[resource]]            one thing gathered
#     id                    the name scripts ask for it by (harvest.take("fish", ...))
#     area                  tiles on each side of an area, 1 to 256
#     amount_min            the least a full area holds, at least 1
#     amount_max            the most a full area holds
#     respawn_min_minutes   the least minutes before the area is full again
#     respawn_max_minutes   the most; the same as the least when left out
#     [[resource.vein]]     a kind an area of the resource may be of; leave them out for a resource of one kind
#       id                  the name scripts get it by (harvest.vein("wood", ...))
#       weight              how often an area is of this kind, against the weights of the others, 1 to 1000000
# ==============================================================================

# The fish: 5 to 15 in 8 by 8 tiles, back in 10 to 20 minutes.
[[resource]]
id = "fish"
area = 8
amount_min = 5
amount_max = 15
respawn_min_minutes = 10
respawn_max_minutes = 20

# The wood of the trees: 2 to 4 cuts in 4 by 4 tiles, back in 20 to 30 minutes. About half of the places are of
# plain wood; the rarer the kind, the more Lumberjacking scripts/items/axe.lua asks to get it.
[[resource]]
id = "wood"
area = 4
amount_min = 2
amount_max = 4
respawn_min_minutes = 20
respawn_max_minutes = 30

[[resource.vein]]
id = "plain"
weight = 490

[[resource.vein]]
id = "oak"
weight = 300

[[resource.vein]]
id = "ash"
weight = 100

[[resource.vein]]
id = "yew"
weight = 50

[[resource.vein]]
id = "heartwood"
weight = 30

[[resource.vein]]
id = "bloodwood"
weight = 20

[[resource.vein]]
id = "frostwood"
weight = 10

# The ore of the mountains and the caves: 10 to 34 in 8 by 8 tiles, back in 10 to 20 minutes. About half of the places
# are of iron; the rarer the metal, the more Mining scripts/items/pickaxe.lua asks to dig it.
[[resource]]
id = "ore"
