amount_min = 10
amount_max = 34
respawn_min_minutes = 10
respawn_max_minutes = 20

[[resource.vein]]
id = "iron"
weight = 496

[[resource.vein]]
id = "dull_copper"
weight = 112

[[resource.vein]]
id = "shadow_iron"
weight = 98

[[resource.vein]]
id = "copper"
