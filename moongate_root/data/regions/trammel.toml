# ==============================================================================
# Moongate - regions/trammel.toml
#
# What it is for:
#   The regions of Trammel: towns, dungeons and other named areas, with the
#   rules they apply. The map is the name of this file. Every rule is written out
#   and already includes the rules of the region's parents, so a region can be
#   read on its own. Where regions overlap, the highest priority applies.
#
# Fields:
#   name            the region name (leave out for areas that only apply rules)
#   type            base, town, dungeon, nohousing, guarded, jail or greenacres
#   priority        where regions overlap, the highest one applies
#   parent          the name of the region this one is part of, on this map
#   areas           the rectangles of the region: x1 and y1 are included, x2
#                   and y2 are not; z1 and z2 limit the height when present
#   go_location     where a "go to region" command takes a character, "(x, y, z)"
#   entrance        the entrance of the town or dungeon, "(x, y, z)"
#   music           the music played in the region (see the music list)
#   rune_name       the name of a rune marked here
#   guarded         whether guards protect the region
#   housing         whether players may place houses
#   instant_logout  whether a character with no fight in progress logs out at once
#   recall_in, recall_out, gate_in, gate_out, mark
#                   whether those travel spells work into, out of or in the region;
#                   a travel spell is blocked when any region covering the place
#                   blocks it, whatever its priority
# ==============================================================================

