# ==============================================================================
# Moongate - pet_food.toml
#
# What it is for:
#   The items a pet eats, by kind of food. A player feeds a pet by dragging one of these on it; the pet eats the whole
#   stack when its creature eats that kind (the food of each creature is in taming.toml) and its loyalty rises. Without
#   this file no pet eats.
#
# Fields:
#   [[food]]   one kind of food
#     kind     meat, fruit (fruit and vegetables), grain, fish or eggs
#     items    the ids of the item templates that are food of this kind
# ==============================================================================

