# ==============================================================================
# Moongate - containers.toml
#
# What it is for:
#   How the client shows each kind of container: the gump that opens, the area
#   of that gump where items can be placed and the sound of an item dropped in.
#   The server picks the entry whose item ids include the container's graphic;
#   a container not listed uses the entry marked as the default.
#
# Fields:
#   name        a label for people reading this file and for logs (optional)
#   gump        the id of the gump the client opens
#   bounds      the area where items can be placed, as "(x, y)+(width, height)"
#   drop_sound  the sound played when an item is dropped in (leave out: none)
#   items       the item ids (graphics) of the containers that use this entry
#   default     true on the one entry used for containers not listed
# ==============================================================================

[[container]]
name = "default"
gump = 0x003C
bounds = "(44, 65)+(142, 94)"
drop_sound = 0x0048
default = true
items = []

