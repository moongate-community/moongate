# ==============================================================================
# Moongate - starting_cities.toml
#
# What it is for:
#   The cities a new character can start in. The server sends this list to the
#   client with the character list (packet 0xA9); the client shows the cities on
#   the map during character creation and sends back the index of the one chosen,
#   so the order of the entries matters.
#
# Fields:
#   town         the city name shown by the client (at most 32 ASCII characters)
#   description  the place in the city, such as an inn (at most 32 ASCII characters)
#   location     where the character appears, as "(x, y, z)"
#   map          the map of the location: felucca, trammel, ilshenar, malas,
#                tokuno or termur
#   cliloc       the id of the localized description the client shows
# ==============================================================================

[[starting_city]]
town = "New Haven"
description = "The Bountiful Harvest Inn"
location = "(3503, 2574, 14)"
map = "trammel"
cliloc = 1150168

