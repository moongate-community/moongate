# ==============================================================================
# Moongate - skills.toml
#
# What it is for:
#   The skills of the shard and how they grow. The ids are the ones the client
#   uses (0-57), so the ids and their order must not change. The server uses this
#   file to validate the skills chosen at character creation and to decide which
#   stats rise when a skill is used.
#
# Fields:
#   id               the skill id used by the client
#   name             the skill name
#   title            the title of a character whose best skill is this one
#   profession_name  the name used by the profession files
#   primary_stat     the stat the skill depends on most: str, dex or int
#   secondary_stat   the stat the skill depends on next: str, dex or int
#   *_scale          the chance, in percent, that a skill gain also raises that stat
#   *_gain           how much a skill gain favours that stat when it rises
#   gain_factor      how fast the skill itself rises (1.0 is normal)
# ==============================================================================

