# ==============================================================================
# Moongate - maps.toml
#
# What it is for:
#   The facets (maps) of the shard. The server reads this file at startup to know
#   which maps exist, how big they are and which season the client shows on each.
#
# Fields:
#   map         the map id sent to the client: felucca, trammel, ilshenar, malas,
#               tokuno or termur
#   file_index  the number of the client map files to read (map0.mul -> 0)
#   name        the name shown in logs and commands
#   size        width and height in tiles, as "(width, height)"
#   rules       the rule set applied on the map
#   season      the season sent with packet 0xBC: spring, summer, fall, winter or
#               desolation
#   weather     the weather profile of weather.toml used where no region covers
#               a place
# ==============================================================================

[[map]]
map = "felucca"
file_index = 0
name = "Felucca"
size = "(7168, 4096)"
rules = "FeluccaRules"
season = "desolation"
weather = "temperate"

[[map]]
map = "trammel"
file_index = 1
name = "Trammel"
size = "(7168, 4096)"
rules = "TrammelRules"
season = "spring"
weather = "temperate"

[[map]]
map = "ilshenar"
file_index = 2
name = "Ilshenar"
size = "(2304, 1600)"
rules = "TrammelRules"
season = "summer"
weather = "none"

[[map]]
map = "malas"
file_index = 3
name = "Malas"
size = "(2560, 2048)"
rules = "TrammelRules"
season = "summer"
weather = "none"

[[map]]
map = "tokuno"
file_index = 4
name = "Tokuno"
size = "(1448, 1448)"
rules = "TrammelRules"
season = "summer"
weather = "none"

[[map]]
map = "termur"
file_index = 5
name = "TerMur"
size = "(1280, 4096)"
rules = "TrammelRules"
season = "summer"
weather = "none"
