# ==============================================================================
# Moongate - races.toml
#
# What it is for:
#   The races a player can pick at character creation and, for each gender, the
#   body the character gets and the hair and beard styles allowed. The client
#   sends the race, the gender and the chosen styles (packets 0xF8 and 0x8D); the
#   server keeps a style only if it is listed here for that race and gender, so a
#   modified client cannot pick a style it should not have. No hair or no beard
#   (style 0) is always allowed and is not listed. Hues outside the allowed ones
#   are moved to the nearest allowed hue.
#
# Fields:
#   race           the race: human, elf or gargoyle
#   name           the race name
#   skin_hues      the allowed skin hues, as values or "min-max" ranges; a hue
#                  outside them becomes the nearest allowed one (empty: any)
#   hair_hues      the allowed hair and beard hues, in the same form
#   [race.male] and [race.female], one section per gender:
#     body         the body id of a living character of this race and gender
#     hair         the item ids of the allowed hair styles
#     beard        the item ids of the allowed beard styles (empty: no beard)
# ==============================================================================

[[race]]
race = "human"
name = "Human"
skin_hues = ["0x03EA-0x0422"]
hair_hues = ["0x044E-0x047D"]

