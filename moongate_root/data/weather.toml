heat_chance = 10
heat_temperature = 30
rain_temperature_drop = 5
storm_temperature_drop = 10

# Cold, snows most of the time.
[[weather]]
name = "snowy"
rain_chance = 0
snow_chance = 90
storm_chance = 40
snow_threshold = 5
min_temperature = 4
max_temperature = 10
cold_chance = 90
