max_temperature = 30
cold_chance = 20
cold_temperature = 5
heat_chance = 20
heat_temperature = 35
rain_temperature_drop = 5
storm_temperature_drop = 10

# Often rainy, rarely snowy or stormy.
[[weather]]
name = "mild"
rain_chance = 40
snow_chance = 5
storm_chance = 5
snow_threshold = 10
min_temperature = 5
max_temperature = 25
cold_chance = 10
