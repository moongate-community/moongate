# ==============================================================================
# Moongate - messages/por/moongate.toml
#
# What it is for:
#   The Portuguese texts that are Moongate's own (numbers from 30000): tooltips,
#   command replies and command descriptions. The server merges this file
#   with messages/por.toml, which holds the standard texts.
#
# Format:
#   <number> = "text"
#   The number is the message id the code asks for, the same in every language.
#   {0}, {1}, ... are the values the code fills in, in order; {0,6} pads to 6
#   characters and {0:x} writes in hex. Write {{ and }} for a literal brace.
# ==============================================================================

[messages]

