# ==============================================================================
# Moongate - messages/eng/moongate.toml
#
# What it is for:
#   The English texts that are Moongate's own (numbers from 30000): tooltips,
#   command replies, command descriptions and texts of the item scripts. The
#   server merges this file with messages/eng.toml, which holds the standard
#   texts.
#
# Format:
#   <number> = "text"
#   The number is the message id the code asks for, the same in every language.
#   {0}, {1}, ... are the values the code fills in, in order; {0,6} pads to 6
#   characters and {0:x} writes in hex. Write {{ and }} for a literal brace.
# ==============================================================================

