# ==============================================================================
# Moongate - moongates.toml
#
# What it is for:
#   The public moongates: the gates between the cities of every map. ".decorate"
#   places a gate on each destination, and a player who walks onto one or double
#   clicks it picks where to go from a gump with one page per map. A map the
#   server does not load is left out, with its gates.
#
# Fields:
#   [[facet]]              one per map
#   map                    felucca, trammel, ilshenar, malas, tokuno or termur
#   cliloc                 the client text of the map's name in the gump
#   selected_cliloc        the same name as the gump shows it for the open page
#   [[facet.destination]]  the cities of the map, in the order the gump lists them
#   name                   the city, for the logs; players see the cliloc
#   cliloc                 the client text of the city's name
#   location               where the gate stands and travellers arrive, "(x, y, z)"
#   hue                    the hue of the gate; none when left out
#   average_z              true takes the height from the map instead of the z of
#                          the location, for a spot whose height differs between
#                          client versions
# ==============================================================================

