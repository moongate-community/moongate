# ==============================================================================
# Moongate - professions.toml
#
# What it is for:
#   The professions a player can pick at character creation. The client shows
#   them and sends back the id of the one chosen (packet 0xF8), leaving skills and
#   stats empty; the server then gives the character the skills and stats listed
#   here. Id 0 is the "Advanced" choice, where the player picks everything, so it
#   is not listed.
#
# Fields:
#   id                  the profession id the client sends
#   name                the profession name
#   name_cliloc         the id of the localized name the client shows
#   description_cliloc  the id of the localized description the client shows
#   gump                the id of the gump image the client shows
#   str, dex, int       the starting stats
#   skills              the starting skills: the skill name, such as "Tactics" or
#                       "SpiritSpeak" (no spaces), and its starting value; every
#                       skill must also be listed in skills.toml
# ==============================================================================

[[profession]]
id = 1
name = "Warrior"
name_cliloc = 1061180
description_cliloc = 1061230
gump = 5577
str = 45
dex = 35
int = 10
skills = [
    { skill = "Tactics", value = 30 },
    { skill = "Healing", value = 30 },
    { skill = "Swordsmanship", value = 30 },
    { skill = "Anatomy", value = 30 },
]

