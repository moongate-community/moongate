{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "moongate.fullname" .) -}}
{{- $gen := include "moongate.generatedName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "moongate.labels" . | nindent 4 }}
data:
  10-moongate.sh: |
    #!/usr/bin/env sh
    # Trial provisioning, run by the PostgreSQL image on the first start of an empty volume.
    # Realms added later need their roles and database created by hand.
    set -eu

    admin() { psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" "$@"; }

    provision_role() {
        admin --set=role_name="$1" --set=pw="$2" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN', :'role_name')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role_name') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'role_name', :'pw') \gexec
    SQL
    }

    provision_database() {
        admin --set=db="$1" --set=owner="$2" <<'SQL'
    SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'owner')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
    SQL
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$1" \
            --set=db="$1" --set=schema_role="$2" --set=runtime_role="$3" <<'SQL'
    SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'runtime_role') \gexec
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SELECT format('CREATE SCHEMA IF NOT EXISTS moongate_migrations AUTHORIZATION %I', :'schema_role') \gexec
    REVOKE ALL ON SCHEMA moongate_migrations FROM PUBLIC;
    SELECT format('GRANT USAGE ON SCHEMA moongate_migrations TO %I', :'runtime_role') \gexec
    SELECT format('GRANT SELECT ON ALL TABLES IN SCHEMA moongate_migrations TO %I', :'runtime_role') \gexec
    SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA moongate_migrations GRANT SELECT ON TABLES TO %I', :'schema_role', :'runtime_role') \gexec
    SQL
    }

    # provision_schema <database> <schema> <schema role> <runtime role>
    provision_schema() {
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$1" \
            --set=schema_name="$2" --set=schema_role="$3" --set=runtime_role="$4" <<'SQL'
    SELECT format('CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I', :'schema_name', :'schema_role') \gexec
    SELECT format('REVOKE ALL ON SCHEMA %I FROM PUBLIC', :'schema_name') \gexec
    SELECT format('GRANT USAGE ON SCHEMA %I TO %I', :'schema_name', :'runtime_role') \gexec
    SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', :'schema_name', :'runtime_role') \gexec
    SELECT format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', :'schema_name', :'runtime_role') \gexec
    SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', :'schema_role', :'schema_name', :'runtime_role') \gexec
    SELECT format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT ON SEQUENCES TO %I', :'schema_role', :'schema_name', :'runtime_role') \gexec
    SQL
    }

    provision_role moongate_accounts_schema "$PW_ACCOUNTS_SCHEMA"
    provision_role moongate_accounts_runtime "$PW_ACCOUNTS_RUNTIME"
    provision_database moongate_accounts moongate_accounts_schema moongate_accounts_runtime
    provision_schema moongate_accounts auth moongate_accounts_schema moongate_accounts_runtime
    {{- range .Values.realms }}
    {{- $db := include "moongate.dbName" .id }}
    {{- $var := .id | upper | replace "-" "_" }}

    provision_role {{ $db }}_schema "$PW_{{ $var }}_SCHEMA"
    provision_role {{ $db }}_runtime "$PW_{{ $var }}_RUNTIME"
    provision_database {{ $db }} {{ $db }}_schema {{ $db }}_runtime
    provision_schema {{ $db }} world {{ $db }}_schema {{ $db }}_runtime
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "moongate.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "moongate.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "moongate.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "moongate.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moongate.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
      annotations:
        checksum/init: {{ toYaml .Values.realms | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- include "moongate.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secret" $gen "key" "postgres-admin") | nindent 12 }}
            {{- include "moongate.secretEnv" (dict "name" "PW_ACCOUNTS_SCHEMA" "secret" $gen "key" "accounts-schema") | nindent 12 }}
            {{- include "moongate.secretEnv" (dict "name" "PW_ACCOUNTS_RUNTIME" "secret" $gen "key" "accounts-runtime") | nindent 12 }}
            {{- range .Values.realms }}
            {{- $var := .id | upper | replace "-" "_" }}
            {{- include "moongate.secretEnv" (dict "name" (printf "PW_%s_SCHEMA" $var) "secret" $gen "key" (printf "%s-schema" .id)) | nindent 12 }}
            {{- include "moongate.secretEnv" (dict "name" (printf "PW_%s_RUNTIME" $var) "secret" $gen "key" (printf "%s-runtime" .id)) | nindent 12 }}
            {{- end }}
          ports:
            - {name: postgresql, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            periodSeconds: 5
          securityContext:
            {{- include "moongate.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/10-moongate.sh, subPath: 10-moongate.sh}
      volumes:
        - name: init
          configMap:
            name: {{ $name }}
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
