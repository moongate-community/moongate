{{- $bundled := and .Values.postgresql.enabled .Values.redis.enabled -}}
{{- if .Values.secrets.existingSecret -}}
{{- if or .Values.postgresql.enabled .Values.redis.enabled -}}
{{- fail "the bundled PostgreSQL and Redis use generated passwords: unset secrets.existingSecret, or disable postgresql and redis" -}}
{{- end -}}
{{- else -}}
{{- if not $bundled -}}
{{- fail "set secrets.existingSecret, or enable both postgresql and redis (trials only)" -}}
{{- end -}}
{{- $old := dict -}}
{{- $found := lookup "v1" "Secret" .Release.Namespace (include "moongate.generatedName" .) -}}
{{- if $found -}}
{{- range $k, $v := $found.data -}}
{{- $_ := set $old $k ($v | b64dec) -}}
{{- end -}}
{{- end -}}
{{- $pw := dict -}}
{{- $names := list "postgres-admin" "accounts-schema" "accounts-runtime" -}}
{{- range .Values.realms -}}
{{- $names = concat $names (list (printf "%s-schema" .id) (printf "%s-runtime" .id)) -}}
{{- end -}}
{{- range $names -}}
{{- $_ := set $pw . (default (randAlphaNum 24) (get $old .)) -}}
{{- end -}}
{{- $_ := set $pw "redis" (default (randAlphaNum 32 | sha256sum) (get $old "redis")) -}}
{{- $_ := set $pw "handoff" (default (randAlphaNum 32 | sha256sum) (get $old "handoff")) -}}
{{- $host := printf "%s-postgresql" (include "moongate.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moongate.generatedName" . }}
  labels:
    {{- include "moongate.labels" . | nindent 4 }}
  annotations:
    # Losing these passwords locks the chart out of its own databases: keep them on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $pw }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moongate.fullname" . }}
  labels:
    {{- include "moongate.labels" . | nindent 4 }}
type: Opaque
stringData:
  accounts-runtime-url: {{ printf "postgres://moongate_accounts_runtime:%s@%s:5432/moongate_accounts?pooling=true" (get $pw "accounts-runtime") $host | quote }}
  accounts-schema-url: {{ printf "postgres://moongate_accounts_schema:%s@%s:5432/moongate_accounts?pooling=true" (get $pw "accounts-schema") $host | quote }}
  {{- range .Values.realms }}
  {{- $db := include "moongate.dbName" .id }}
  {{ .id }}-runtime-url: {{ printf "postgres://%s_runtime:%s@%s:5432/%s?pooling=true" $db (get $pw (printf "%s-runtime" .id)) $host $db | quote }}
  {{ .id }}-schema-url: {{ printf "postgres://%s_schema:%s@%s:5432/%s?pooling=true" $db (get $pw (printf "%s-schema" .id)) $host $db | quote }}
  {{- end }}
  redis-connection-string: {{ printf "%s-redis:6379,password=%s" (include "moongate.fullname" .) (get $pw "redis") | quote }}
  handoff-secret: {{ get $pw "handoff" | quote }}
{{- end -}}
